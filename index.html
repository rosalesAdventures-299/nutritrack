/* ============================================================
   NUTRI TRACK — registro de alimentos (buscador, cantidades, texto)
   ============================================================ */
NT.log = (function () {
  const u = NT.u, d = NT.dom, ui = NT.ui, st = NT.state, M = NT.model;

  /* ---------------------------------------------------------
     Hoja de cantidad
     --------------------------------------------------------- */
  function quantitySheet(food, opts) {
    opts = opts || {};
    const editing = opts.entry || null;
    let portionId = editing ? editing.portionId : (food.defaultPortion || food.portions[0].id);
    let qty = editing ? editing.qty : 1;
    let mealId = editing ? editing.mealId : (opts.mealId || suggestMealId());

    const mealOpts = st.S.meals.filter(function (m) { return m.enabled !== false; });

    function preview() {
      const p = M.portionOf(food, portionId);
      const grams = u.num(qty, 0) * p.grams;
      const n = M.nutrientsFor(food, grams);
      return { grams: grams, n: n };
    }

    function bodyHtml() {
      const pv = preview();
      return '' +
      '<div class="card" style="display:flex;gap:12px;align-items:center">' +
        '<div class="row-ico" style="font-size:22px">' + (food.emoji || '🍽️') + '</div>' +
        '<div style="flex:1;min-width:0">' +
          '<div style="font-weight:650">' + u.esc(food.name) + ' ' + ui.stateTag(food.state) + '</div>' +
          '<div class="tiny muted">' + u.esc(food.brand || NT.model.CATS[food.cat].n) +
            ' · ' + u.fmt(food.kcal) + ' kcal / 100 g</div>' +
        '</div>' +
      '</div>' +

      '<div class="field mt16"><label>Porción</label>' +
        '<select class="input" id="q-portion">' +
          food.portions.map(function (p) {
            return '<option value="' + p.id + '"' + (p.id === portionId ? ' selected' : '') + '>' + u.esc(p.label) + '</option>';
          }).join('') +
        '</select></div>' +

      '<div class="field"><label>Cantidad</label>' +
        '<div class="qty-stepper">' +
          '<button type="button" class="stp" data-step="-1">−</button>' +
          '<input class="input" id="q-qty" type="number" inputmode="decimal" step="any" min="0" value="' + qty + '">' +
          '<button type="button" class="stp" data-step="1">+</button>' +
        '</div>' +
        '<div class="hint" id="q-grams">= ' + u.fmt(pv.grams, 1) + ' g' +
          (food.state !== 'na' ? ' en peso <b>' + food.state + '</b>' : '') + '</div>' +
      '</div>' +

      '<div class="field"><label>¿En qué comida?</label>' +
        '<select class="input" id="q-meal">' +
          '<option value="">Sin comida asignada</option>' +
          mealOpts.map(function (m) {
            return '<option value="' + m.id + '"' + (m.id === mealId ? ' selected' : '') + '>' +
                   m.emoji + ' ' + u.esc(m.name) + ' · ' + u.pretty12(m.time) + '</option>';
          }).join('') +
        '</select></div>' +

      '<div class="card card-flat" id="q-macros">' + macrosHtml(pv) + '</div>' +
      (food.src ? '<div class="tiny muted mt12">Fuente: ' + u.esc(food.src) + '</div>' : '');
    }

    function macrosHtml(pv) {
      const n = pv.n;
      return '<div class="kpi" style="margin:-16px -16px 0;border:0;border-radius:0">' +
          '<div><div class="k">Calorías</div><div class="v">' + u.fmt(n.kcal) + '</div></div>' +
          '<div><div class="k">Proteína</div><div class="v">' + u.fmt(n.protein, 1) + '<small> g</small></div></div>' +
          '<div><div class="k">Carbos</div><div class="v">' + u.fmt(n.carbs, 1) + '<small> g</small></div></div>' +
        '</div>' +
        '<div class="kpi" style="margin:1px -16px -16px;border:0;border-radius:0">' +
          '<div><div class="k">Grasa</div><div class="v">' + u.fmt(n.fat, 1) + '<small> g</small></div></div>' +
          '<div><div class="k">Fibra</div><div class="v">' + (n.micros.fiber === null ? '—' : u.fmt(n.micros.fiber, 1)) + '<small> g</small></div></div>' +
          '<div><div class="k">Sodio</div><div class="v">' + (n.micros.sodium === null ? '—' : u.fmt(n.micros.sodium)) + '<small> mg</small></div></div>' +
        '</div>';
    }

    const s = ui.sheet({
      title: editing ? 'Editar registro' : 'Registrar alimento',
      body: bodyHtml(),
      foot: '<div class="btn-row">' +
              (editing ? '<button class="btn btn-danger" data-del>Eliminar</button>' : '') +
              '<button class="btn btn-primary" data-save>' + (editing ? 'Guardar cambios' : 'Registrar') + '</button>' +
            '</div>'
    });

    function rerenderPreview() {
      const pv = preview();
      const g = d.q('#q-grams', s.el);
      if (g) g.innerHTML = '= ' + u.fmt(pv.grams, 1) + ' g' + (food.state !== 'na' ? ' en peso <b>' + food.state + '</b>' : '');
      const m = d.q('#q-macros', s.el);
      if (m) m.innerHTML = macrosHtml(pv);
    }

    d.on(s.el, 'input', '#q-qty', function (e, el) { qty = u.num(el.value, 0); rerenderPreview(); });
    d.on(s.el, 'change', '#q-portion', function (e, el) { portionId = el.value; rerenderPreview(); });
    d.on(s.el, 'change', '#q-meal', function (e, el) { mealId = el.value || null; });
    d.on(s.el, 'click', '[data-step]', function (e, el) {
      const p = M.portionOf(food, portionId);
      const inc = p.grams === 1 ? 10 : (p.grams >= 100 ? 0.5 : 1);
      qty = Math.max(0, u.r1(u.num(qty, 0) + inc * u.num(el.dataset.step, 1)));
      d.q('#q-qty', s.el).value = qty;
      rerenderPreview();
    });
    d.on(s.el, 'click', '[data-save]', function () {
      if (u.num(qty, 0) <= 0) { d.toast('Escribe una cantidad mayor a cero'); return; }
      if (editing) {
        const p = M.portionOf(food, portionId);
        const grams = u.r1(u.num(qty, 1) * p.grams);
        const n = M.nutrientsFor(food, grams);
        const e2 = Object.assign({}, editing, {
          qty: u.num(qty, 1), portionId: p.id, portionLabel: p.label, grams: grams,
          mealId: mealId || null, kcal: n.kcal, protein: n.protein, carbs: n.carbs,
          fat: n.fat, micros: n.micros, incomplete: n.incomplete
        });
        st.updateEntry(e2).then(function () { d.toast('Registro actualizado'); s.close(); });
      } else {
        st.logFood(food, qty, portionId, { mealId: mealId || null, source: opts.source || 'busqueda' })
          .then(function () {
            d.toast('✓ ' + food.name + ' registrado');
            s.close();
            ui.closeAllSheets();
          });
      }
    });
    d.on(s.el, 'click', '[data-del]', function () {
      ui.confirm('¿Eliminar este registro del día?', { danger: true, ok: 'Eliminar' }).then(function (ok) {
        if (ok) st.removeEntry(editing.id).then(function () { d.toast('Registro eliminado'); s.close(); });
      });
    });
    return s;
  }

  function suggestMealId() {
    const day = st.S.day;
    if (!day) return null;
    if (day.current) return day.current.meal.id;
    const now = u.nowMinutes();
    let best = null, bd = 1e9;
    st.S.meals.forEach(function (m) {
      const dd = Math.abs(u.hhmmToMin(m.time) - now);
      if (dd < bd) { bd = dd; best = m; }
    });
    return best ? best.id : null;
  }

    return s;
  }

  /* ---------------------------------------------------------
     Registro por texto  ("me comí 200 g de filete y un yogur")
     --------------------------------------------------------- */
  const NUMS = { un:1, una:1, uno:1, dos:2, tres:3, cuatro:4, cinco:5, seis:6, siete:7, ocho:8,
                 nueve:9, diez:10, media:0.5, medio:0.5 };
  const UNITS = [
    { re:/\b(gramos|gramo|grs|gr|g)\b/, kind:'g' },
    { re:/\b(kilos|kilo|kg)\b/, kind:'kg' },
    { re:/\b(mililitros|ml)\b/, kind:'ml' },
    { re:/\b(litros|litro|lt|l)\b/, kind:'l' },
    { re:/\b(piezas|pieza|pzas|pza|unidades|unidad)\b/, kind:'pieza' },
    { re:/\b(tazas|taza)\b/, kind:'taza' },
    { re:/\b(cucharadas|cucharada|cdas|cda)\b/, kind:'cucharada' },
    { re:/\b(cucharaditas|cucharadita)\b/, kind:'cucharadita' },
    { re:/\b(rebanadas|rebanada)\b/, kind:'rebanada' },
    { re:/\b(latas|lata)\b/, kind:'lata' },
    { re:/\b(botellas|botella)\b/, kind:'botella' },
    { re:/\b(vasos|vaso)\b/, kind:'vaso' },
    { re:/\b(porciones|porcion)\b/, kind:'porcion' },
    { re:/\b(scoops|scoop|medidas|medida)\b/, kind:'scoop' },
    { re:/\b(filetes|filete)\b/, kind:'filete' }
  ];
  const STOP = /^(me|ya|acabo|acabe|de|comi|comí|tome|tomé|un|una|uno|el|la|los|las|con|y|que|mi|hoy|desayune|desayuné|cene|cené|almorce|almorcé|aprox|como|unos|unas|del|al|en|para|por)$/;

  function parseText(text) {
    const raw = String(text || '').toLowerCase();
    // separa en fragmentos por conectores
    const parts = raw.split(/\s*(?:,|\+|\by\b|\.|;)\s*/).filter(function (p) { return p.trim().length > 1; });
    return parts.map(function (p) { return parseFragment(p); }).filter(Boolean);
  }

  function parseFragment(frag) {
    const s = ' ' + u.norm(frag) + ' ';
    // cantidad
    let qty = null;
    const mNum = s.match(/(\d+(?:[.,]\d+)?)/);
    if (mNum) qty = u.num(mNum[1]);
    if (qty === null) {
      for (const w in NUMS) { if (new RegExp('\\b' + w + '\\b').test(s)) { qty = NUMS[w]; break; } }
    }
    // unidad
    let unit = null;
    for (let i = 0; i < UNITS.length; i++) { if (UNITS[i].re.test(s)) { unit = UNITS[i].kind; break; } }

    // proteína declarada explícitamente ("de 12 gramos de proteina")
    let declaredProtein = null;
    const mp = s.match(/(\d+(?:[.,]\d+)?)\s*(?:g|gr|gramos)?\s*de\s*prote/);
    if (mp) declaredProtein = u.num(mp[1]);

    // palabras candidatas para el nombre
    const words = s.replace(/[0-9.,]/g, ' ').split(/\s+/).filter(function (w) {
      if (!w || w.length < 3) return false;
      if (STOP.test(w)) return false;
      for (let i = 0; i < UNITS.length; i++) if (UNITS[i].re.test(' ' + w + ' ')) return false;
      if (/^prote/.test(w)) return false;
      return true;
    });
    if (!words.length) return null;

    const matches = matchFoods(words);
    return { text: frag.trim(), qty: qty, unit: unit, words: words,
             declaredProtein: declaredProtein, matches: matches };
  }

  function matchFoods(words) {
    const scored = st.S.foods.filter(function (f) { return !f.archived; }).map(function (f) {
      const hay = u.norm(f.name + ' ' + (f.brand || ''));
      let sc = 0;
      words.forEach(function (w) {
        if (hay === w) sc += 10;
        else if (hay.split(/\s+/).indexOf(w) >= 0) sc += 6;
        else if (hay.indexOf(w) >= 0) sc += 4;
        else if (w.length > 4 && hay.indexOf(w.slice(0, w.length - 1)) >= 0) sc += 2;
      });
      if (f.favorite) sc += 0.6;
      return { food: f, score: sc };
    }).filter(function (x) { return x.score > 0; });
    scored.sort(function (a, b) { return b.score - a.score; });
    return scored.slice(0, 6);
  }

  /* traduce cantidad+unidad a (qty, portionId) del alimento */
  function resolvePortion(food, qty, unit) {
    const ps = food.portions || [];
    function find(rx) { return ps.filter(function (p) { return rx.test(u.norm(p.label)); })[0]; }
    if (unit === 'g') return { portionId: 'g', qty: qty };
    if (unit === 'kg') return { portionId: 'g', qty: qty * 1000 };
    if (unit === 'ml') return { portionId: 'g', qty: qty };
    if (unit === 'l') return { portionId: 'g', qty: qty * 1000 };
    let p = null;
    if (unit === 'pieza' || unit === 'filete') p = find(/pieza|filete|clara/);
    else if (unit === 'taza') p = find(/taza/);
    else if (unit === 'cucharada') p = find(/cucharada \(/) || find(/cucharada/);
    else if (unit === 'cucharadita') p = find(/cucharadita/);
    else if (unit === 'rebanada') p = find(/rebanada/);
    else if (unit === 'lata') p = find(/lata/);
    else if (unit === 'botella') p = find(/botella/);
    else if (unit === 'vaso') p = find(/vaso/);
    else if (unit === 'scoop') p = find(/scoop|dosis/);
    else if (unit === 'porcion') p = find(/porcion|porción/);
    if (p) return { portionId: p.id, qty: qty };
    // sin unidad: usa la porción por defecto
    const def = ps.filter(function (x) { return x.id === food.defaultPortion; })[0] || ps[0];
    return { portionId: def.id, qty: qty };
  }

  function openText(opts) {
    opts = opts || {};
    const s = ui.sheet({
      title: 'Escribe lo que comiste',
      body:
        '<div class="field">' +
          '<textarea class="input" id="tx" rows="3" placeholder="Ej.: me comí 200 g de filete y 150 g de arroz"></textarea>' +
          '<div class="hint">Interpreto la cantidad y busco el alimento en <b>tu</b> biblioteca. ' +
          'Si hay varias opciones parecidas, te pregunto cuál es. Nunca invento valores nutricionales.</div>' +
        '</div>' +
        '<div class="btn-row"><button class="btn btn-primary btn-block" data-parse>Interpretar</button></div>' +
        '<div id="tx-res" class="mt16"></div>'
    });

    d.on(s.el, 'click', '[data-parse]', function () {
      const txt = d.q('#tx', s.el).value;
      const res = parseText(txt);
      const box = d.q('#tx-res', s.el);
      if (!res.length) {
        box.innerHTML = '<div class="note warn">No pude identificar ningún alimento en ese texto. ' +
          'Intenta algo como “200 g de tilapia” o regístralo desde el buscador.</div>';
        return;
      }
      box.innerHTML = res.map(function (r, i) {
        if (!r.matches.length) {
          return '<div class="note warn">No encontré <b>' + u.esc(r.words.join(' ')) + '</b> en tu biblioteca. ' +
            '<button class="btn btn-sm mt8" data-create="' + i + '">Crear este alimento</button></div>';
        }
        const many = r.matches.length > 1 && r.matches[1].score >= r.matches[0].score - 1;
        return '<div class="card mt12">' +
          '<div class="tiny muted">“' + u.esc(r.text) + '”</div>' +
          (many ? '<div class="note mt8" style="border-left-color:var(--warn)">Hay varias opciones parecidas. ¿Cuál es?</div>' : '') +
          '<div class="mt8">' + r.matches.slice(0, many ? 5 : 3).map(function (m) {
            const rp = resolvePortion(m.food, r.qty === null ? 1 : r.qty, r.unit);
            const por = M.portionOf(m.food, rp.portionId);
            return '<button class="row" style="padding-left:0;padding-right:0" data-pick="' + m.food.id + '" data-qty="' + rp.qty + '" data-por="' + rp.portionId + '">' +
              '<span class="row-ico">' + (m.food.emoji || '🍽️') + '</span>' +
              '<span class="row-main"><span class="row-t">' + u.esc(m.food.name) + '</span>' +
              '<span class="row-s">' + (rp.portionId === 'g' ? u.fmt(rp.qty) + ' g' : u.fmt(rp.qty, 1) + ' × ' + u.esc(por.label) + ' = ' + u.fmt(rp.qty * por.grams) + ' g') + '</span></span>' +
              '<span class="row-chev">›</span></button>';
          }).join('') + '</div>' +
          (r.declaredProtein !== null ? '<div class="tiny muted mt8">Mencionaste ' + r.declaredProtein +
            ' g de proteína. Verifica que el producto elegido coincida; uso los valores guardados, no los del texto.</div>' : '') +
          '</div>';
      }).join('');
    });

    d.on(s.el, 'click', '[data-pick]', function (e, el) {
      const f = st.S.foodsById[el.dataset.pick];
      if (!f) return;
      quantitySheet(f, { mealId: opts.mealId, source: 'texto', preQty: el.dataset.qty });
      // precargar cantidad detectada
      setTimeout(function () {
        const inp = document.querySelector('.scrim.show:last-of-type #q-qty');
        const sel = document.querySelector('.scrim.show:last-of-type #q-portion');
        if (sel) { sel.value = el.dataset.por; sel.dispatchEvent(new Event('change', { bubbles:true })); }
        if (inp) { inp.value = el.dataset.qty; inp.dispatchEvent(new Event('input', { bubbles:true })); }
      }, 60);
    });
    d.on(s.el, 'click', '[data-create]', function () {
      NT.foodEdit.open(null, function (food) { quantitySheet(food, { mealId: opts.mealId }); });
    });
    return s;
  }

  /* ---------------------------------------------------------
     Agua
     --------------------------------------------------------- */
  function openWater() {
    const goal = st.S.goals.water;
    const s = ui.sheet({
      title: 'Registrar agua',
      body:
        '<div class="center" style="padding:6px 0 14px">' +
          '<div style="font-size:34px;font-weight:750;letter-spacing:-.03em">' + u.fmt(st.S.water / 1000, 1) + ' L</div>' +
          '<div class="tiny muted">de ' + u.fmt(goal / 1000, 1) + ' L objetivo</div>' +
        '</div>' +
        '<div class="grid-3">' +
          [200, 250, 330, 500, 750, 1000].map(function (ml) {
            return '<button class="btn" data-ml="' + ml + '">+' + (ml >= 1000 ? '1 L' : ml + ' ml') + '</button>';
          }).join('') +
        '</div>' +
        '<div class="btn-row mt16"><button class="btn btn-sm" data-reset>Reiniciar el día</button></div>'
    });
    d.on(s.el, 'click', '[data-ml]', function (e, el) {
      st.addWater(u.num(el.dataset.ml)).then(function () {
        d.toast('💧 +' + el.dataset.ml + ' ml');
        s.close();
      });
    });
    d.on(s.el, 'click', '[data-reset]', function () {
      st.resetWater().then(function () { d.toast('Agua reiniciada'); s.close(); });
    });
    return s;
  }

  return { openLog, openText, openWater, quantitySheet, parseText, resolvePortion, suggestMealId };
})();

      d.q('#f-portions', s.el).innerHTML = portionsHtml();
    });
    d.on(s.el, 'click', '[data-delp]', function (e, el) {
      f.portions = f.portions.filter(function (p) { return p.id !== el.dataset.delp; });
      d.q('#f-portions', s.el).innerHTML = portionsHtml();
    });
    d.on(s.el, 'input', '[data-plabel]', function (e, el) {
      const p = f.portions.filter(function (x) { return x.id === el.dataset.plabel; })[0];
      if (p) p.label = el.value;
    });
    d.on(s.el, 'input', '[data-pgrams]', function (e, el) {
      const p = f.portions.filter(function (x) { return x.id === el.dataset.pgrams; })[0];
      if (p) p.grams = u.num(el.value, 100);
    });

    d.on(s.el, 'click', '[data-save]', function () {
      const name = d.q('#f-name', s.el).value.trim();
      if (!name) { d.toast('Ponle un nombre al alimento'); return; }
      basis = u.num(d.q('#f-basis', s.el).value, 100) || 100;
      const k = 100 / basis;

      f.name = name;
      f.brand = d.q('#f-brand', s.el).value.trim();
      f.cat = d.q('#f-cat', s.el).value;
      f.kcal = u.r1(u.num(d.q('#f-kcal', s.el).value) * k);
      f.protein = u.r1(u.num(d.q('#f-protein', s.el).value) * k);
      f.carbs = u.r1(u.num(d.q('#f-carbs', s.el).value) * k);
      f.fat = u.r1(u.num(d.q('#f-fat', s.el).value) * k);
      d.qa('[data-micro]', s.el).forEach(function (el) {
        const raw = el.value.trim();
        f.micros[el.dataset.micro] = raw === '' ? null : u.r1(u.num(raw) * k);
      });
      const price = u.num(d.q('#f-price', s.el).value, 0);
      f.price = price > 0 ? { amount: price, per: d.q('#f-priceper', s.el).value } : null;
      f.src = d.q('#f-src', s.el).value.trim() || 'Capturado por mí';
      f.portions = f.portions.filter(function (p) { return p.id === 'g' || (p.label && p.grams > 0); });
      if (!f.portions.some(function (p) { return p.id === 'g'; })) f.portions.push({ id:'g', label:'g (gramos)', grams:1 });
      if (!f.portions.some(function (p) { return p.id !== 'g'; })) f.portions.unshift({ id:'p0', label:'100 g', grams:100 });
      f.defaultPortion = f.portions[0].id;
      f.custom = true;

      st.saveFood(f).then(function (saved) {
        d.toast(isNew ? 'Alimento creado' : 'Alimento actualizado');
        s.close();
        if (onSaved) onSaved(saved);
      });
    });

    d.on(s.el, 'click', '[data-del]', function () {
      ui.confirm('¿Eliminar "' + f.name + '" de tu biblioteca? Los registros ya guardados no se modifican.',
        { danger:true, ok:'Eliminar' }).then(function (ok) {
        if (ok) st.deleteFood(f.id).then(function () { d.toast('Alimento eliminado'); s.close(); });
      });
    });
    return s;
  }

  return { open };
})();


/* ===== 56-measure.js ===== */
/* ============================================================
   NUTRI TRACK — mediciones corporales y lector de mediciones (Fase 3)
   ------------------------------------------------------------
   Regla dura: NUNCA se guarda un dato extraído de una imagen sin
   que pase por la pantalla "Datos detectados" y lo confirmes.
   ============================================================ */
NT.measure = (function () {
  const u = NT.u, d = NT.dom, ui = NT.ui, st = NT.state;

  /* ---------------- campos de una medición ---------------- */
  const FIELDS = [
    { k:'weight',      n:'Peso',                unit:'kg',   min:25,  max:250,
      re:/\b(peso|weight|wt)\b/i },
    { k:'bodyFat',     n:'Grasa corporal',      unit:'%',    min:3,   max:60,
      re:/(%\s*grasa|grasa\s*corporal|body\s*fat|\bfat\b|\bgrasa\b)/i },
    { k:'fatMass',     n:'Masa grasa',          unit:'kg',   min:1,   max:120,
      re:/(masa\s*grasa|fat\s*mass|kg\s*de\s*grasa)/i },
    { k:'muscleMass',  n:'Masa muscular',       unit:'kg',   min:10,  max:120,
      re:/(masa\s*muscular|m[úu]sculo|muscle\s*mass|masa\s*magra|lean)/i },
    { k:'water',       n:'Agua corporal',       unit:'L',    min:5,   max:90,
      re:/(agua\s*corporal|total\s*body\s*water|\btbw\b|\bagua\b)/i },
    { k:'waterPct',    n:'% de agua',           unit:'%',    min:20,  max:80,
      re:/(%\s*agua|agua\s*%|water\s*%|hidrataci)/i },
    { k:'bmi',         n:'IMC',                 unit:'',     min:8,   max:70,
      re:/(\bimc\b|\bbmi\b|[íi]ndice\s*de\s*masa)/i },
    { k:'visceral',    n:'Grasa visceral',      unit:'',     min:1,   max:60,
      re:/(visceral)/i },
    { k:'bone',        n:'Masa ósea',           unit:'kg',   min:0.5, max:10,
      re:/(masa\s*[óo]sea|bone\s*mass|hueso)/i },
    { k:'bmr',         n:'Metabolismo basal',   unit:'kcal', min:600, max:4000,
      re:/(metabolismo\s*basal|\bbmr\b|\brmr\b|\btmb\b|basal)/i },
    { k:'metabolicAge',n:'Edad metabólica',     unit:'años', min:5,   max:99,
      re:/(edad\s*metab|metabolic\s*age)/i },
    { k:'chest',       n:'Pecho',               unit:'cm',   min:40,  max:200, re:/(pecho|chest)/i },
    { k:'waist',       n:'Cintura',             unit:'cm',   min:40,  max:200, re:/(cintura|waist)/i },
    { k:'hip',         n:'Cadera',              unit:'cm',   min:40,  max:200, re:/(cadera|hip)/i },
    { k:'arm',         n:'Brazo',               unit:'cm',   min:15,  max:80,  re:/(brazo|arm|b[íi]ceps)/i },
    { k:'thigh',       n:'Pierna',              unit:'cm',   min:25,  max:110, re:/(pierna|muslo|thigh)/i }
  ];
  const CORE = ['weight','bodyFat','fatMass','muscleMass','water','waterPct','bmi','visceral','bone','bmr','metabolicAge'];

  function fieldByKey(k) { return FIELDS.filter(function (f) { return f.k === k; })[0]; }

  /* ---------------- intérprete de texto ----------------
     Funciona igual con texto pegado a mano o con texto salido
     del reconocimiento de imagen del navegador. */
  const NUM = /(-?\d{1,4}(?:[.,]\d{1,2})?)/;

  function parseText(text) {
    const lines = String(text || '')
      .replace(/ /g, ' ')
      .split(/[\n\r]+/)
      .map(function (l) { return l.trim(); })
      .filter(Boolean);

    const out = {};
    // 1) etiqueta y número en la misma línea → confianza alta
    lines.forEach(function (line, i) {
      FIELDS.forEach(function (f) {
        if (out[f.k]) return;
        if (!f.re.test(line)) return;
        const after = line.slice(line.search(f.re));
        let m = after.match(NUM);
        let conf = 'alta';
        if (!m) { m = line.match(NUM); conf = 'media'; }
        if (!m && lines[i + 1]) { m = lines[i + 1].match(NUM); conf = 'media'; }
        if (!m) return;
        const v = u.num(m[1], null);
        if (v === null || !isFinite(v)) return;
        out[f.k] = { value: v, conf: inRange(f, v) ? conf : 'baja', raw: line };
      });
    });
    // 2) coherencias sencillas
    if (out.weight && out.bodyFat && !out.fatMass) {
      const fm = out.weight.value * out.bodyFat.value / 100;
      out.fatMass = { value: u.r1(fm), conf:'calculada', raw:'calculado desde peso y % de grasa' };
    }
    if (out.water && out.weight && out.water.value > out.weight.value) delete out.water;
    return out;
  }

  function inRange(f, v) { return v >= f.min && v <= f.max; }

  /* ---------------- reconocimiento de texto en imagen ----------------
     Usa el detector de texto del navegador si existe (Chrome en Android).
     Si no está disponible, se cae con elegancia a captura manual guiada. */
  function detectFromImage(file) {
    if (!('TextDetector' in window)) {
      return Promise.resolve({ supported: false, text: '' });
    }
    return createImageBitmap(file).then(function (bmp) {
      const det = new window.TextDetector();
      return det.detect(bmp).then(function (blocks) {
        const text = blocks.map(function (b) { return b.rawValue; }).join('\n');
        return { supported: true, text: text, blocks: blocks.length };
      });
    }).catch(function () { return { supported: false, text: '' }; });
  }

  /* ---------------- flujo: analizar medición ---------------- */
  function openAnalyze(onSaved) {
    const s = ui.sheet({
      title: 'Analizar medición',
      body:
        '<div class="note">Sube la foto o captura de pantalla de la báscula del gimnasio. ' +
        'Voy a intentar leer los números y <b>siempre</b> te los muestro para que los revises ' +
        'antes de guardar nada.</div>' +
        '<div class="btn-row mt16">' +
          '<button class="btn btn-primary btn-block" data-pick>📷 Elegir imagen</button>' +
        '</div>' +
        '<input type="file" id="mz-file" accept="image/png,image/jpeg,image/webp,image/*" style="display:none">' +
        '<div class="hr"></div>' +
        '<div class="field"><label>O pega aquí los datos como texto</label>' +
          '<textarea class="input" id="mz-text" rows="5" placeholder="Peso: 69.2 kg&#10;Grasa: 24.8 %&#10;Músculo: 48.1 kg&#10;Agua: 52.3 %"></textarea>' +
          '<div class="hint">Sirve si la máquina te manda los resultados por correo o app.</div></div>' +
        '<button class="btn btn-block" data-parsetext>Interpretar texto</button>' +
        '<div class="hr"></div>' +
        '<button class="btn btn-block" data-manual>✍️ Capturar todo a mano</button>' +
        '<div id="mz-preview" class="mt16"></div>'
    });

    d.on(s.el, 'click', '[data-pick]', function () { d.q('#mz-file', s.el).click(); });
    d.on(s.el, 'click', '[data-manual]', function () { s.close(); openEditor(null, onSaved); });
    d.on(s.el, 'click', '[data-parsetext]', function () {
      const txt = d.q('#mz-text', s.el).value;
      if (!txt.trim()) { d.toast('Escribe o pega algo primero'); return; }
      const found = parseText(txt);
      s.close();
      openReview(found, { source:'texto pegado' }, onSaved);
    });
    d.on(s.el, 'change', '#mz-file', function (e, el) {
      const file = el.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const box = d.q('#mz-preview', s.el);
      box.innerHTML = '<div class="card card-pad-0"><img src="' + url + '" alt="medición" ' +
        'style="width:100%;display:block;max-height:280px;object-fit:contain;background:var(--surface-2)"></div>' +
        '<div class="tiny muted center mt8">Analizando la imagen…</div>';

      detectFromImage(file).then(function (res) {
        const found = res.supported ? parseText(res.text) : {};
        s.close();
        openReview(found, {
          source: res.supported ? 'lectura de imagen' : 'imagen (sin lector automático)',
          imageUrl: url,
          imageFile: file,
          unsupported: !res.supported,
          rawText: res.text || ''
        }, onSaved);
      });
    });
    return s;
  }

  /* ---------------- pantalla "Datos detectados" ---------------- */
  function openReview(found, ctx, onSaved) {
    ctx = ctx || {};
    const detected = CORE.filter(function (k) { return found[k]; });
    const missing = CORE.filter(function (k) { return !found[k]; });

    const s = ui.sheet({
      title: 'Datos detectados',
      body:
        (ctx.imageUrl
          ? '<div class="card card-pad-0" style="margin-bottom:14px"><img src="' + ctx.imageUrl + '" alt="medición" ' +
            'style="width:100%;display:block;max-height:220px;object-fit:contain;background:var(--surface-2)"></div>'
          : '') +
        (ctx.unsupported
          ? '<div class="note warn">Este navegador no tiene lector de texto en imágenes, así que ' +
            'no pude leer la foto automáticamente. Puedes ver la imagen arriba y escribir los datos a mano; ' +
            'los guardo igual junto con la foto.</div>'
          : detected.length
            ? '<div class="note">Revisa y corrige lo que haga falta. Nada se guarda hasta que confirmes.</div>'
            : '<div class="note warn">No pude identificar con suficiente confianza ningún dato en esta imagen. ' +
              'Captúralos a mano abajo.</div>') +

        '<div class="field mt16"><label>Fecha de la medición</label>' +
          '<input class="input" id="mr-date" type="date" value="' + u.todayKey() + '"></div>' +

        '<div class="grid-2">' +
          CORE.map(function (k) {
            const f = fieldByKey(k), got = found[k];
            const bad = got && got.conf === 'baja';
            return '<div class="field"><label>' + f.n + (f.unit ? ' (' + f.unit + ')' : '') + '</label>' +
              '<input class="input" data-mf="' + k + '" type="number" inputmode="decimal" step="any" ' +
              'value="' + (got ? got.value : '') + '" placeholder="—">' +
              (got
                ? '<div class="hint" style="color:' + (bad ? 'var(--bad)' : 'var(--brand)') + '">' +
                  (got.conf === 'alta' ? '✓ detectado' :
                   got.conf === 'calculada' ? '≈ calculado desde otros datos' :
                   got.conf === 'media' ? '⚠️ detectado con dudas — verifica' :
                   '⚠️ fuera de rango razonable — verifica') + '</div>'
                : '<div class="hint">No pude identificar este dato con suficiente confianza.</div>') +
              '</div>';
          }).join('') +
        '</div>' +

        '<details><summary style="font-size:13px;font-weight:650;color:var(--brand);cursor:pointer;padding:6px 0">Medidas con cinta (opcional)</summary>' +
          '<div class="grid-2 mt12">' +
            ['chest','waist','hip','arm','thigh'].map(function (k) {
              const f = fieldByKey(k);
              return '<div class="field"><label>' + f.n + ' (cm)</label>' +
                '<input class="input" data-mf="' + k + '" type="number" inputmode="decimal" step="any" ' +
                'value="' + (found[k] ? found[k].value : '') + '"></div>';
            }).join('') +
          '</div></details>' +

        '<div class="field"><label>Notas</label>' +
          '<input class="input" id="mr-note" placeholder="Ej.: en ayunas, antes de entrenar"></div>' +

        (ctx.rawText
          ? '<details><summary style="font-size:12px;color:var(--txt-3);cursor:pointer;padding:6px 0">Ver el texto que leí de la imagen</summary>' +
            '<pre class="tiny muted" style="white-space:pre-wrap;margin:8px 0 0">' + u.esc(ctx.rawText) + '</pre></details>'
          : '') +

        '<div class="note warn mt16">Las básculas de bioimpedancia son <b>indicadores de tendencia</b>, ' +
        'no mediciones clínicas. Compáralas entre sí en las mismas condiciones y no tomes decisiones ' +
        'a partir de una sola medición.</div>',

      foot: '<div class="btn-row">' +
              '<button class="btn" data-close>Cancelar</button>' +
              '<button class="btn btn-primary" data-confirm>Confirmar medición</button></div>'
    });

    d.on(s.el, 'click', '[data-confirm]', function () {
      const rec = { id: u.uid('med'), date: d.q('#mr-date', s.el).value || u.todayKey(),
                    createdAt: Date.now(), source: ctx.source || 'manual',
                    note: d.q('#mr-note', s.el).value.trim() };
      let any = false;
      d.qa('[data-mf]', s.el).forEach(function (el) {
        const raw = el.value.trim();
        if (raw === '') { rec[el.dataset.mf] = null; return; }
        rec[el.dataset.mf] = u.num(raw, null);
        any = true;
      });
      if (!any) { d.toast('Captura al menos un dato'); return; }

      const finish = function () {
        st.saveMeasurement(rec).then(function () {
          d.toast('✓ Medición guardada');
          s.close();
          if (onSaved) onSaved(rec);
        });
      };
      if (ctx.imageFile) {
        st.savePhoto({ id:u.uid('ph'), date:rec.date, kind:'medicion', blob:ctx.imageFile,
                       measurementId:rec.id, createdAt:Date.now() }).then(finish);
      } else finish();
    });
    return s;
  }

  /* ---------------- alta / edición manual ---------------- */
  function openEditor(existing, onSaved) {
    const m = existing || { date: u.todayKey() };
    const s = ui.sheet({
      title: existing ? 'Editar medición' : 'Nueva medición',
      body:
        '<div class="field"><label>Fecha</label>' +
          '<input class="input" id="me-date" type="date" value="' + (m.date || u.todayKey()) + '"></div>' +
        '<div class="grid-2">' +
          CORE.map(function (k) {
            const f = fieldByKey(k);
            return '<div class="field"><label>' + f.n + (f.unit ? ' (' + f.unit + ')' : '') + '</label>' +
              '<input class="input" data-mf="' + k + '" type="number" inputmode="decimal" step="any" value="' +
              (m[k] === null || m[k] === undefined ? '' : m[k]) + '" placeholder="—"></div>';
          }).join('') +
        '</div>' +
        '<details><summary style="font-size:13px;font-weight:650;color:var(--brand);cursor:pointer;padding:6px 0">Medidas con cinta (opcional)</summary>' +
          '<div class="grid-2 mt12">' +
            ['chest','waist','hip','arm','thigh'].map(function (k) {
              const f = fieldByKey(k);
              return '<div class="field"><label>' + f.n + ' (cm)</label>' +
                '<input class="input" data-mf="' + k + '" type="number" inputmode="decimal" step="any" value="' +
                (m[k] === null || m[k] === undefined ? '' : m[k]) + '"></div>';
            }).join('') +
          '</div></details>' +
        '<div class="field"><label>Notas</label>' +
          '<input class="input" id="me-note" value="' + u.esc(m.note || '') + '" placeholder="Ej.: en ayunas"></div>' +
        '<div class="note">Deja en blanco lo que tu báscula no mida. No relleno huecos con estimaciones.</div>',
      foot: '<div class="btn-row">' +
              (existing ? '<button class="btn btn-danger" data-delm>Eliminar</button>' : '') +
              '<button class="btn btn-primary" data-savem>Guardar</button></div>'
    });

    d.on(s.el, 'click', '[data-savem]', function () {
      const rec = Object.assign({}, m);
      rec.date = d.q('#me-date', s.el).value || u.todayKey();
      rec.note = d.q('#me-note', s.el).value.trim();
      rec.source = existing ? (m.source || 'manual') : 'manual';
      let any = false;
      d.qa('[data-mf]', s.el).forEach(function (el) {
        const raw = el.value.trim();
        rec[el.dataset.mf] = raw === '' ? null : u.num(raw, null);
        if (raw !== '') any = true;
      });
      if (!any) { d.toast('Captura al menos un dato'); return; }
      st.saveMeasurement(rec).then(function () {
        d.toast('✓ Medición guardada'); s.close(); if (onSaved) onSaved(rec);
      });
    });
    d.on(s.el, 'click', '[data-delm]', function () {
      ui.confirm('¿Eliminar esta medición del historial?', { danger:true, ok:'Eliminar' }).then(function (ok) {
        if (ok) st.deleteMeasurement(m.id).then(function () { d.toast('Medición eliminada'); s.close(); });
      });
    });
    return s;
  }

  return { FIELDS, CORE, fieldByKey, parseText, detectFromImage, openAnalyze, openReview, openEditor };
})();


/* ===== 60-view-today.js ===== */
/* ============================================================
   NUTRI TRACK — pantalla "Hoy"
   ============================================================ */
NT.viewToday = (function () {
  const u = NT.u, d = NT.dom, ui = NT.ui, st = NT.state, M = NT.model;

  let tab = 'hoy';

  function render(root) {
    const S = st.S, day = S.day, g = S.goals;
    const isToday = S.dateKey === u.todayKey();

    root.innerHTML =
      topbar(S, isToday) +
      '<div class="tabs">' +
        '<button data-ht="hoy" class="' + (tab === 'hoy' ? 'on' : '') + '">Mi día</button>' +
        '<button data-ht="falta" class="' + (tab === 'falta' ? 'on' : '') + '">Me falta</button>' +
      '</div>' +
      '<div id="hoy-body"></div>';

    const box = d.q('#hoy-body', root);
    if (tab === 'falta') {
      NT.viewFalta.render(box);
    } else {
      box.innerHTML =
        hero(day, g) +
        yourDay(day, g) +
        mealsCard(day) +
        closeDay(day, g) +
        microsCard(day, g) +
        '<div class="tiny muted center mt24" style="padding:0 16px">' +
          'Las cifras son estimaciones para organizar tu alimentación. ' +
          'NUTRI TRACK no da diagnósticos ni sustituye a un médico o nutriólogo.' +
        '</div>';
    }
    bind(root);
  }

  function topbar(S, isToday) {
    return '<div class="topbar">' +
      '<div><div class="eyebrow">' + (isToday ? u.greeting() : 'Día') + '</div>' +
      '<h1>' + (isToday ? 'Hoy' : u.shortDate(S.dateKey)) + '</h1>' +
      '<div class="tiny muted cap" style="margin-top:2px">' + u.longDate(S.dateKey) + '</div></div>' +
      '<div style="display:flex;gap:6px">' +
        '<button class="x" data-day="-1" aria-label="Día anterior">‹</button>' +
        (isToday ? '' : '<button class="chip" data-today>Hoy</button>') +
        '<button class="x" data-day="1" aria-label="Día siguiente" ' + (isToday ? 'disabled style="opacity:.35"' : '') + '>›</button>' +
      '</div></div>';
  }

  function hero(day, g) {
    const t = day.totals;
    const pctP = g.protein ? Math.round(t.protein / g.protein * 100) : 0;
    return '<div class="card hero">' +
      '<div class="hero-top">' +
        ui.ring(t.kcal, g.kcal) +
        '<div class="hero-side">' +
          '<div class="kv"><span class="muted">Consumidas</span><b>' + u.fmt(t.kcal) + ' kcal</b></div>' +
          '<div class="kv"><span class="muted">Objetivo</span><b>' + u.fmt(g.kcal) + ' kcal</b></div>' +
          '<div class="kv"><span class="muted">Proteína</span><b>' + pctP + '%</b></div>' +
          '<div class="kv"><span class="muted">Comidas</span><b>' +
            day.byMeal.filter(function (b) { return b.status === 'done'; }).length + ' / ' + day.byMeal.length + '</b></div>' +
        '</div>' +
      '</div>' +
      '<div class="bars">' +
        ui.bar({ name:'Proteína', value:t.protein, goal:g.protein, unit:'g', color:'var(--prot)' }) +
        ui.bar({ name:'Carbohidratos', value:t.carbs, goal:g.carbs, unit:'g', color:'var(--carb)' }) +
        ui.bar({ name:'Grasas', value:t.fat, goal:g.fat, unit:'g', color:'var(--fat)' }) +
        ui.bar({ name:'Fibra', value:t.micros.fiber.v, goal:g.fiber, unit:'g', color:'var(--fiber)' }) +
        ui.bar({ name:'Agua', value:day.water/1000, goal:g.water/1000, unit:'L', color:'var(--water)', dec:true }) +
      '</div>' +
      '<div class="btn-row mt16">' +
        '<button class="btn btn-sm" data-water>💧 Agua</button>' +
        '<button class="btn btn-sm" data-text>✍️ Escribir</button>' +
        '<button class="btn btn-sm" data-goals>🎯 Objetivos</button>' +
      '</div>' +
    '</div>';
  }

  /* ---------- Tu día: lo hecho, lo que sigue, lo que falta ---------- */
  function yourDay(day, g) {
    const done = day.byMeal.filter(function (b) { return b.status === 'done'; });
    const plan = M.planRemaining(day);
    const next = plan[0];

    let html = '<div class="sec"><div class="sec-head"><h2>Tu día</h2></div><div class="card">';

    if (done.length) {
      html += done.map(function (b) {
        return '<div style="font-size:13.5px;color:var(--txt-2);padding:2px 0">✓ ' +
          u.esc(b.meal.name) + ' completado <span class="tiny">· ' + u.fmt(b.totals.kcal) + ' kcal</span></div>';
      }).join('');
      html += '<div class="hr"></div>';
    }

    if (next) {
      const tg = next.target;
      const planned = plannedMeal(next.meal.id);
      html += '<div style="font-weight:700;font-size:15px;margin-bottom:2px">→ ' +
        next.meal.emoji + ' ' + u.esc(next.meal.name).toUpperCase() + ' · ' + u.pretty12(next.meal.time) + '</div>';

      if (planned && planned.items.length) {
        html += (planned.recipeName
            ? '<div style="display:flex;align-items:center;gap:8px;margin:8px 0 4px">' +
              '<span style="font-size:20px">' + (planned.recipeEmoji || '🍽️') + '</span>' +
              '<span style="font-weight:650;font-size:14.5px">' + u.esc(planned.recipeName) + '</span>' +
              (planned.minutes ? '<span class="tiny muted">· ' + planned.minutes + ' min</span>' : '') +
              '</div>'
            : '') +
          '<div class="tiny muted">Te corresponde:</div>' +
          '<div class="mt8" style="display:grid;gap:4px">' +
            planned.items.map(function (it) {
              return '<div style="font-size:14px;font-weight:600">' + (it.emoji || '•') + ' ' +
                u.fmt(it.grams) + ' g de ' + u.esc(it.name.toLowerCase()) + ' ' + ui.stateTag(it.state) + '</div>';
            }).join('') +
          '</div>' +
          '<div class="tiny muted mt12">Te aportará aproximadamente:</div>' +
          '<div class="kpi mt8">' +
            '<div><div class="k">Calorías</div><div class="v">' + u.fmt(planned.sum.kcal) + '</div></div>' +
            '<div><div class="k">Proteína</div><div class="v">' + u.fmt(planned.sum.protein) + '<small> g</small></div></div>' +
            '<div><div class="k">Carbos</div><div class="v">' + u.fmt(planned.sum.carbs) + '<small> g</small></div></div>' +
          '</div>' +
          '<div class="tiny muted mt12">Después de esta comida te quedarán: ' +
            '<b>' + u.fmt(Math.max(0, day.rest.protein - planned.sum.protein)) + ' g</b> de proteína, ' +
            '<b>' + u.fmt(Math.max(0, day.rest.carbs - planned.sum.carbs)) + ' g</b> de carbohidratos y ' +
            '<b>' + u.fmt(Math.max(0, day.rest.fat - planned.sum.fat)) + ' g</b> de grasa.</div>' +
          '<div class="btn-row mt12">' +
            '<button class="btn btn-primary btn-sm" data-logplan="' + next.meal.id + '">✓ Comí esto</button>' +
            '<button class="btn btn-sm" data-verreceta>Ver receta</button>' +
          '</div>' +
          '<button class="btn btn-sm btn-block mt8" data-logmeal="' + next.meal.id + '">Comí otra cosa</button>';
      } else {
        html += '<div class="tiny muted">Para ir bien en tu día, esta comida debería aportarte aproximadamente:</div>' +
          '<div class="kpi mt12">' +
            '<div><div class="k">Calorías</div><div class="v">' + u.fmt(tg.kcal) + '</div></div>' +
            '<div><div class="k">Proteína</div><div class="v">' + u.fmt(tg.protein) + '<small> g</small></div></div>' +
            '<div><div class="k">Carbos</div><div class="v">' + u.fmt(tg.carbs) + '<small> g</small></div></div>' +
          '</div>' +
          '<div class="btn-row mt12">' +
            '<button class="btn btn-primary btn-sm" data-logmeal="' + next.meal.id + '">Registrar esta comida</button>' +
            '<button class="btn btn-sm" data-ideas="' + next.meal.id + '">Ver opciones</button>' +
          '</div>' +
          '<button class="btn btn-sm btn-block mt8" data-genplan>✨ Generar mi plan del día</button>';
      }
    } else {
      html += '<div style="font-weight:650">Ya cubriste todas las comidas programadas.</div>' +
        '<div class="tiny muted mt8">Si comes algo más, regístralo y recalculo el día.</div>';
    }

    const r = day.rest;
    html += '<div class="hr"></div>' +
      '<div class="tiny muted" style="margin-bottom:6px">Lo que te falta hoy</div>' +
      '<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:13px">' +
        restPill('Proteína', r.protein, 'g', 'var(--prot)') +
        restPill('Carbos', r.carbs, 'g', 'var(--carb)') +
        restPill('Grasas', r.fat, 'g', 'var(--fat)') +
        restPill('Calorías', r.kcal, 'kcal', 'var(--kcal)') +
      '</div>';

    html += '</div></div>';
    return html;
  }

  function plannedMeal(mealId) {
    const p = st.S.plan;
    if (!p || p.date !== st.S.dateKey) return null;
    return p.meals.filter(function (m) { return m.mealId === mealId; })[0] || null;
  }

  function restPill(name, v, unit, color) {
    const over = v < 0;
    return '<div><div class="tiny muted">' + name + '</div>' +
      '<div style="font-weight:700;font-variant-numeric:tabular-nums;color:' + (over ? 'var(--bad)' : color) + '">' +
      (over ? '+' + u.fmt(-v) : u.fmt(v)) + ' ' + unit + '</div></div>';
  }

  /* ---------- comidas del día ---------- */
  function mealsCard(day) {
    let html = '<div class="sec"><div class="sec-head"><h2>Comidas del día</h2>' +
      '<button class="link" data-tab="comidas">Editar horarios</button></div>' +
      '<div class="card card-pad-0">';

    html += day.byMeal.map(function (b) { return mealRow(b); }).join('');

    if (day.loose.length) {
      const t = M.sumEntries(day.loose);
      html += '<div class="meal"><div class="meal-time">—</div><div class="meal-body">' +
        '<div class="meal-title">Sin comida asignada</div>' +
        '<div class="meal-items">' + day.loose.map(entryLine).join('') + '</div>' +
        '<div class="meal-macros">' + ui.macroPills(t) + '</div></div></div>';
    }
    html += '</div></div>';
    return html;
  }

  function mealRow(b) {
    const badge = { done:['badge-done','✓ Completada'], now:['badge-now','Es ahora'],
                    next:['badge-next','Pendiente'], missed:['badge-miss','Sin registrar'] }[b.status];
    return '<div class="meal" data-meal="' + b.meal.id + '">' +
      '<div class="meal-time">' + u.pretty12(b.meal.time).replace(' ', '<br>') + '</div>' +
      '<div class="meal-body">' +
        '<div class="meal-title">' + b.meal.emoji + ' ' + u.esc(b.meal.name) +
          '<span class="badge ' + badge[0] + '">' + badge[1] + '</span></div>' +
        (b.entries.length
          ? '<div class="meal-items">' + b.entries.map(entryLine).join('') + '</div>' +
            '<div class="meal-macros">' + ui.macroPills(b.totals) + '</div>'
          : '<div class="meal-empty">Nada registrado todavía</div>') +
      '</div>' +
      '<div class="meal-cta"><button class="btn btn-sm" data-logmeal="' + b.meal.id + '">+</button></div>' +
    '</div>';
  }

  function entryLine(e) {
    return '<div class="meal-item" data-entry="' + e.id + '">' +
      '<span>' + (e.emoji || '•') + ' ' + u.esc(e.foodName) + '</span>' +
      '<span class="q">' + u.fmt(e.grams) + ' g · ' + u.fmt(e.kcal) + ' kcal</span></div>';
  }

  /* ---------- cerrar el día ---------- */
  function closeDay(day, g) {
    const r = day.rest;
    if (r.kcal <= 40 && r.protein <= 6) {
      return '<div class="sec"><div class="card"><div style="font-weight:650">🎉 Día cerrado</div>' +
        '<div class="tiny muted mt8">Ya alcanzaste tus objetivos de hoy. ' +
        (r.kcal < -100 ? 'Te pasaste ' + u.fmt(-r.kcal) + ' kcal; mañana lo retomas con calma, sin recortes extremos.' : 'Buen trabajo.') +
        '</div></div></div>';
    }
    return '<div class="sec"><div class="card">' +
      '<div style="font-weight:700;font-size:15px">Para cerrar tu día</div>' +
      '<div class="tiny muted mt8">Te quedan <b>' + u.fmt(Math.max(0, r.protein)) + ' g de proteína</b>, ' +
      '<b>' + u.fmt(Math.max(0, r.carbs)) + ' g de carbohidratos</b>, ' +
      '<b>' + u.fmt(Math.max(0, r.fat)) + ' g de grasa</b> y <b>' + u.fmt(Math.max(0, r.kcal)) + ' kcal</b>.</div>' +
      '<button class="btn btn-primary btn-block mt16" data-verfalta>Ver qué me conviene comer</button>' +
      '</div></div>';
  }

  /* ---------- micronutrientes ---------- */
  function microsCard(day, g) {
    const t = day.totals;
    const rows = M.MICROS.filter(function (m) { return m.k !== 'fiber'; }).map(function (m) {
      const cell = t.micros[m.k];
      const rda = m.k === 'sodium' ? 2300 : m.rda;
      const pct = rda ? u.clamp(cell.v / rda * 100, 0, 100) : 0;
      const color = m.limit ? (cell.v > rda ? 'var(--bad)' : 'var(--warn)') : 'var(--brand)';
      return '<div class="micro-row">' +
        '<div class="micro-name">' + m.n + '</div>' +
        '<div class="micro-bar"><div class="track"><div class="fill" style="width:' + pct.toFixed(0) + '%;background:' + color + '"></div></div></div>' +
        '<div class="micro-val">' + u.fmt(cell.v, cell.v < 10 ? 1 : 0) + ' / ' + u.fmt(rda) + ' ' + m.unit +
          (cell.missing ? ' <span title="Faltan datos en ' + cell.missing + ' alimento(s)">⚠️</span>' : '') +
        '</div></div>';
    }).join('');

    return '<div class="sec"><div class="sec-head"><h2>Micronutrientes</h2></div>' +
      '<div class="card">' +
      (t.incompleteCount
        ? '<div class="note warn" style="margin-bottom:10px">Información nutricional incompleta en ' +
          t.incompleteCount + ' registro(s). Los totales de abajo solo suman lo que sí tiene datos.</div>'
        : '') +
      rows +
      '<div class="tiny muted mt12">Referencias generales para adulto; no son una recomendación clínica personalizada.</div>' +
      '</div></div>';
  }

  /* ---------- eventos ---------- */
  function bind(root) {
    d.on(root, 'click', '[data-day]', function (e, el) {
      st.loadDate(u.addDays(st.S.dateKey, u.num(el.dataset.day)));
    });
    d.on(root, 'click', '[data-today]', function () { st.loadDate(u.todayKey()); });
    d.on(root, 'click', '[data-water]', function () { NT.log.openWater(); });
    d.on(root, 'click', '[data-text]', function () { NT.log.openText({}); });
    d.on(root, 'click', '[data-goals]', function () { NT.app.go('perfil'); setTimeout(function(){ NT.viewProfile.openGoals(); }, 60); });
    d.on(root, 'click', '[data-logmeal]', function (e, el) {
      const m = st.S.meals.filter(function (x) { return x.id === el.dataset.logmeal; })[0];
      NT.log.openLog({ mealId: el.dataset.logmeal, mealTitle: m ? m.name : '' });
    });
    d.on(root, 'click', '[data-ideas]', function (e, el) { openIdeas(el.dataset.ideas); });
    d.on(root, 'click', '[data-ht]', function (e, el) { tab = el.dataset.ht; NT.app.rerender(); });
    d.on(root, 'click', '[data-verfalta]', function () { tab = 'falta'; NT.app.rerender(); });
    d.on(root, 'click', '[data-verreceta]', function () { NT.app.go('plan'); });
    d.on(root, 'click', '[data-genplan]', function () {
      st.generatePlan({ variant: 0 }).then(function () { d.toast('✨ Plan del día generado'); });
    });
    d.on(root, 'click', '[data-logplan]', function (e, el) {
      st.logPlannedMeal(el.dataset.logplan).then(function (rows) {
        d.toast(rows.length ? '✓ Comida registrada' : 'Nada que registrar');
      });
    });
    d.on(root, 'click', '[data-tab]', function (e, el) { NT.app.go(el.dataset.tab); });
    d.on(root, 'click', '[data-entry]', function (e, el) {
      const en = st.S.entries.filter(function (x) { return x.id === el.dataset.entry; })[0];
      if (!en) return;
      const f = st.S.foodsById[en.foodId];
      if (f) NT.log.quantitySheet(f, { entry: en });
      else d.toast('Ese alimento ya no está en tu biblioteca');
    });
    d.on(root, 'click', '[data-sug]', function (e, el) {
      const sg = (window.__NT_SUGS || [])[u.num(el.dataset.sug)];
      if (!sg) return;
      const mealId = NT.log.suggestMealId();
      Promise.all(sg.items.map(function (it) {
        return st.logFood(it.food, it.grams, 'g', { mealId: mealId, source: 'sugerencia' });
      })).then(function () { d.toast('✓ Opción registrada'); });
    });
  }

  /* ---------- opciones para una comida concreta ---------- */
  function openIdeas(mealId) {
    const day = st.S.day;
    const plan = M.planRemaining(day);
    const p = plan.filter(function (x) { return x.meal.id === mealId; })[0] || plan[0];
    if (!p) return;
    const sugs = M.suggest(p.target, st.S.foods, { limit: 4 });
    const s = ui.sheet({
      title: 'Opciones para ' + p.meal.name,
      body:
        '<div class="note">Objetivo aproximado de esta comida: <b>' + u.fmt(p.target.kcal) + ' kcal</b>, ' +
        '<b>' + u.fmt(p.target.protein) + ' g</b> de proteína, <b>' + u.fmt(p.target.carbs) + ' g</b> de carbohidratos y ' +
        '<b>' + u.fmt(p.target.fat) + ' g</b> de grasa.</div>' +
        '<div class="mt16">' +
        (sugs.length ? sugs.map(function (sg, i) {
          return '<div class="sug">' +
            '<div class="sug-t"><span>Opción ' + (i + 1) + '</span><span class="tiny muted">' + u.fmt(sg.sum.kcal) + ' kcal</span></div>' +
            '<div class="sug-s">' + sg.items.map(function (it) {
              return (it.food.emoji || '•') + ' ' + u.fmt(it.grams) + ' g de ' + u.esc(it.food.name.toLowerCase()) +
              (it.food.state !== 'na' ? ' <span class="tag tag-' + (it.food.state === 'crudo' ? 'raw">crudo' : 'cook">cocido') + '</span>' : '');
            }).join(' + ') + '</div>' +
            '<div class="sug-m">' + ui.macroPills(sg.sum) + '</div>' +
            '<div class="btn-row mt12"><button class="btn btn-sm btn-primary" data-take="' + i + '">Registrar</button></div>' +
          '</div>';
        }).join('') : ui.empty('🥗', 'Sin opciones', 'Agrega alimentos con proteína a tu biblioteca.')) +
        '</div>'
    });
    d.on(s.el, 'click', '[data-take]', function (e, el) {
      const sg = sugs[u.num(el.dataset.take)];
      Promise.all(sg.items.map(function (it) {
        return st.logFood(it.food, it.grams, 'g', { mealId: p.meal.id, source: 'sugerencia' });
      })).then(function () { d.toast('✓ Registrado en ' + p.meal.name); s.close(); });
    });
  }

  return { render, setTab: function (t) { tab = t; } };
})();


/* ===== 61-view-meals.js ===== */
/* ============================================================
   NUTRI TRACK — pantalla "Comidas" (horarios y registros)
   ============================================================ */
NT.viewMeals = (function () {
  const u = NT.u, d = NT.dom, ui = NT.ui, st = NT.state, M = NT.model;
  let tab = 'dia';

  const TITLES = { dia:'Registro del día', plan:'Plan del día', horario:'Horario', alimentos:'Mis alimentos' };

  function render(root) {
    const S = st.S, day = S.day;
    root.innerHTML =
      '<div class="topbar"><div><div class="eyebrow">Comidas</div><h1>' + TITLES[tab] + '</h1></div>' +
        (tab === 'alimentos' ? '<button class="btn btn-sm btn-primary" data-newfood>➕</button>' : '') +
      '</div>' +
      '<div class="tabs">' +
        '<button data-t="dia" class="' + (tab === 'dia' ? 'on' : '') + '">Registro</button>' +
        '<button data-t="plan" class="' + (tab === 'plan' ? 'on' : '') + '">Plan</button>' +
        '<button data-t="horario" class="' + (tab === 'horario' ? 'on' : '') + '">Horarios</button>' +
        '<button data-t="alimentos" class="' + (tab === 'alimentos' ? 'on' : '') + '">Alimentos</button>' +
      '</div>' +
      '<div id="mt-body"></div>';

    const box = d.q('#mt-body', root);
    if (tab === 'dia') box.innerHTML = dayTab(day);
    else if (tab === 'horario') box.innerHTML = scheduleTab(S.meals);
    else if (tab === 'plan') NT.viewPlan.render(box);
    else NT.viewFoods.render(box, { embedded: true });

    bind(root);
  }

  /* ---------------- pestaña registro ---------------- */
  function dayTab(day) {
    let html = '<div class="tiny muted cap" style="margin-bottom:10px">' +
      u.longDate(day.dateKey) + '</div>';

    html += day.byMeal.map(function (b) {
      return '<div class="sec" style="margin-top:14px"><div class="sec-head">' +
        '<h2>' + b.meal.emoji + ' ' + u.esc(b.meal.name) + ' <span class="tiny muted">· ' + u.pretty12(b.meal.time) + '</span></h2>' +
        '<button class="link" data-logmeal="' + b.meal.id + '">+ Agregar</button></div>' +
        '<div class="card card-pad-0">' +
        (b.entries.length
          ? b.entries.map(entryRow).join('') +
            '<div class="row" style="background:var(--surface-2)"><span class="row-main"><span class="row-t tiny">Total</span></span>' +
            '<span class="row-end"><b>' + u.fmt(b.totals.kcal) + ' kcal</b>' +
            'P ' + u.fmt(b.totals.protein) + ' · C ' + u.fmt(b.totals.carbs) + ' · G ' + u.fmt(b.totals.fat) + '</span></div>'
          : '<div class="empty-sm">Nada registrado todavía · toca “+ Agregar”</div>') +
        '</div></div>';
    }).join('');

    if (day.loose.length) {
      const t = M.sumEntries(day.loose);
      html += '<div class="sec"><div class="sec-head"><h2>Sin comida asignada</h2></div>' +
        '<div class="card card-pad-0">' + day.loose.map(entryRow).join('') + '</div></div>';
    }
    return html;
  }

  function entryRow(e) {
    return '<button class="row" data-entry="' + e.id + '">' +
      '<span class="row-ico">' + (e.emoji || '🍽️') + '</span>' +
      '<span class="row-main"><span class="row-t">' + u.esc(e.foodName) + '</span>' +
      '<span class="row-s">' + (e.portionId === 'g' ? u.fmt(e.grams) + ' g' : u.fmt(e.qty, 1) + ' × ' + u.esc(e.portionLabel) + ' = ' + u.fmt(e.grams) + ' g') +
      (e.state !== 'na' ? ' (' + e.state + ')' : '') + ' · ' + u.esc(e.time) + '</span></span>' +
      '<span class="row-end"><b>' + u.fmt(e.kcal) + '</b>P ' + u.fmt(e.protein) + ' g</span></button>';
  }

  /* ---------------- pestaña horarios ---------------- */
  function scheduleTab(meals) {
    const total = meals.filter(function (m) { return m.enabled !== false; })
                       .reduce(function (s, m) { return s + (m.share || 0); }, 0);
    return '<div class="note">Define a qué hora comes y qué peso tiene cada comida dentro de tu día. ' +
        'Uso el reparto para decirte cuánto te toca en cada una.</div>' +
      '<div class="card card-pad-0 mt16">' +
        meals.map(function (m, i) {
          return '<div class="row">' +
            '<span class="row-ico">' + m.emoji + '</span>' +
            '<span class="row-main"><span class="row-t">' + u.esc(m.name) + '</span>' +
            '<span class="row-s">' + u.pretty12(m.time) + ' · ' + Math.round((m.share || 0) * 100) + '% del día</span></span>' +
            '<button class="btn btn-sm" data-editmeal="' + m.id + '">Editar</button></div>';
        }).join('') +
      '</div>' +
      (Math.abs(total - 1) > 0.02
        ? '<div class="note warn mt12">El reparto de tus comidas suma ' + Math.round(total * 100) +
          '%. Ajústalo para que sume 100% y los cálculos por comida sean correctos.</div>'
        : '') +
      '<div class="btn-row mt16"><button class="btn" data-addmeal>➕ Agregar comida</button>' +
      '<button class="btn" data-resetmeals>Restaurar horario sugerido</button></div>';
  }

  function editMeal(meal) {
    const isNew = !meal;
    const m = meal ? Object.assign({}, meal) : { id: u.uid('m'), name:'Nueva comida', time:'16:00', emoji:'🍽️', enabled:true, share:0.1 };
    const EM = ['🍳','🍎','🍽️','🥤','🌙','🥗','🍗','🥣','☕','🍫'];
    const s = ui.sheet({
      title: isNew ? 'Nueva comida' : 'Editar comida',
      body:
        '<div class="field"><label>Nombre</label><input class="input" id="m-name" value="' + u.esc(m.name) + '"></div>' +
        '<div class="grid-2">' +
          '<div class="field"><label>Hora</label><input class="input" id="m-time" type="time" value="' + m.time + '"></div>' +
          '<div class="field"><label>% del día</label><div class="inline-unit">' +
            '<input class="input" id="m-share" type="number" inputmode="numeric" step="1" min="0" max="100" value="' + Math.round((m.share || 0) * 100) + '"><span class="u">%</span></div></div>' +
        '</div>' +
        '<div class="field"><label>Ícono</label><div class="chips">' +
          EM.map(function (e) { return '<button type="button" class="chip' + (m.emoji === e ? ' on' : '') + '" data-emo="' + e + '" style="font-size:17px">' + e + '</button>'; }).join('') +
        '</div></div>' +
        '<div class="switch"><div><div class="sw-txt">Comida activa</div>' +
          '<div class="sw-sub">Si la desactivas no aparece en tu día</div></div>' +
          '<button data-toggle>' + ui.toggle(m.enabled !== false) + '</button></div>',
      foot: '<div class="btn-row">' + (isNew ? '' : '<button class="btn btn-danger" data-del>Eliminar</button>') +
            '<button class="btn btn-primary" data-save>Guardar</button></div>'
    });
    d.on(s.el, 'click', '[data-emo]', function (e, el) {
      m.emoji = el.dataset.emo;
      d.qa('[data-emo]', s.el).forEach(function (b) { b.classList.toggle('on', b.dataset.emo === m.emoji); });
    });
    d.on(s.el, 'click', '[data-toggle]', function (e, el) {
      m.enabled = !(m.enabled !== false);
      el.innerHTML = ui.toggle(m.enabled);
    });
    d.on(s.el, 'click', '[data-save]', function () {
      m.name = d.q('#m-name', s.el).value.trim() || 'Comida';
      m.time = d.q('#m-time', s.el).value || '12:00';
      m.share = u.clamp(u.num(d.q('#m-share', s.el).value, 10) / 100, 0, 1);
      let meals = st.S.meals.slice();
      const ix = meals.findIndex(function (x) { return x.id === m.id; });
      if (ix >= 0) meals[ix] = m; else meals.push(m);
      meals.sort(function (a, b) { return u.hhmmToMin(a.time) - u.hhmmToMin(b.time); });
      st.saveMeals(meals).then(function () { d.toast('Horario actualizado'); s.close(); });
    });
    d.on(s.el, 'click', '[data-del]', function () {
      ui.confirm('¿Eliminar "' + m.name + '" de tu horario?', { danger:true, ok:'Eliminar' }).then(function (ok) {
        if (!ok) return;
        st.saveMeals(st.S.meals.filter(function (x) { return x.id !== m.id; }))
          .then(function () { d.toast('Comida eliminada'); s.close(); });
      });
    });
  }

  function bind(root) {
    d.on(root, 'click', '[data-t]', function (e, el) { tab = el.dataset.t; NT.app.rerender(); });
    d.on(root, 'click', '[data-newfood]', function () { NT.foodEdit.open(null); });
    d.on(root, 'click', '[data-logmeal]', function (e, el) {
      const m = st.S.meals.filter(function (x) { return x.id === el.dataset.logmeal; })[0];
      NT.log.openLog({ mealId: el.dataset.logmeal, mealTitle: m ? m.name : '' });
    });
    d.on(root, 'click', '[data-entry]', function (e, el) {
      const en = st.S.entries.filter(function (x) { return x.id === el.dataset.entry; })[0];
      if (!en) return;
      const f = st.S.foodsById[en.foodId];
      if (f) NT.log.quantitySheet(f, { entry: en });
      else d.toast('Ese alimento ya no está en tu biblioteca');
    });
    d.on(root, 'click', '[data-editmeal]', function (e, el) {
      editMeal(st.S.meals.filter(function (x) { return x.id === el.dataset.editmeal; })[0]);
    });
    d.on(root, 'click', '[data-addmeal]', function () { editMeal(null); });
    d.on(root, 'click', '[data-resetmeals]', function () {
      ui.confirm('¿Restaurar el horario sugerido de 5 comidas?').then(function (ok) {
        if (ok) st.saveMeals(M.defaultMeals()).then(function () { d.toast('Horario restaurado'); });
      });
    });
  }

  return { render, setTab: function (t) { tab = t; } };
})();

   ============================================================ */
NT.viewFoods = (function () {
  const u = NT.u, d = NT.dom, ui = NT.ui, st = NT.state, M = NT.model;
  let term = '', cat = '';

  function render(root, opts) {
    opts = opts || {};
    let list;
    if (cat === 'fav') list = st.searchFoods(term).filter(function (f) { return f.favorite; });
    else if (cat === 'mios') list = st.searchFoods(term).filter(function (f) { return f.custom; });
    else list = st.searchFoods(term, { cat: cat || null });

    root.innerHTML =
      (opts.embedded
        ? ''
        : '<div class="topbar"><div><div class="eyebrow">Biblioteca</div><h1>Mis alimentos</h1>' +
          '<div class="tiny muted">' + st.S.foods.length + ' alimentos guardados</div></div>' +
          '<button class="btn btn-sm btn-primary" data-new>➕</button></div>') +
      '<div class="searchbar"><span class="si">🔍</span>' +
        '<input class="input" id="fd-q" type="search" placeholder="Buscar en mi biblioteca…" value="' + u.esc(term) + '"></div>' +
      '<div class="chips mt12">' + chips() + '</div>' +
      '<div class="card card-pad-0 mt12">' +
        (list.length ? list.map(row).join('')
          : ui.empty('🔎', 'Sin resultados', 'Crea el alimento con el botón ➕ de arriba.')) +
      '</div>' +
      '<div class="note mt16">Los valores precargados vienen de USDA FoodData Central y de etiquetas de productos comunes en México. ' +
      'Puedes editar cualquiera para que coincida con lo que realmente compras.</div>';
    bind(root);
  }

  function chips() {
    const list = [{ v:'', n:'Todos' }, { v:'fav', n:'⭐ Favoritos' }, { v:'mios', n:'✏️ Míos' }].concat(
      Object.keys(M.CATS).map(function (k) { return { v:k, n:M.CATS[k].e + ' ' + M.CATS[k].n }; }));
    return list.map(function (c) {
      return '<button class="chip' + (c.v === cat ? ' on' : '') + '" data-cat="' + c.v + '">' + u.esc(c.n) + '</button>';
    }).join('');
  }

  function row(f) {
    return '<div class="row">' +
      '<button class="row-ico" data-fav="' + f.id + '" title="Favorito">' + (f.favorite ? '⭐' : (f.emoji || '🍽️')) + '</button>' +
      '<button class="row-main" style="text-align:left" data-food="' + f.id + '">' +
        '<span class="row-t">' + u.esc(f.name) + ' ' + ui.stateTag(f.state) + '</span>' +
        '<span class="row-s">' + (f.brand ? u.esc(f.brand) + ' · ' : '') +
        u.fmt(f.kcal) + ' kcal · P ' + u.fmt(f.protein, 1) + ' · C ' + u.fmt(f.carbs, 1) + ' · G ' + u.fmt(f.fat, 1) + ' / 100 g</span>' +
      '</button>' +
      '<button class="btn btn-sm" data-add="' + f.id + '">+</button>' +
    '</div>';
  }

  function detail(f) {
    const complete = M.MICROS.filter(function (m) { return f.micros[m.k] !== null && f.micros[m.k] !== undefined; });
    const missing = M.MICROS.length - complete.length;
    const s = ui.sheet({
      title: f.name,
      body:
        '<div class="card" style="display:flex;gap:12px;align-items:center">' +
          '<div class="row-ico" style="font-size:22px">' + (f.emoji || '🍽️') + '</div>' +
          '<div style="flex:1"><div style="font-weight:650">' + u.esc(f.name) + ' ' + ui.stateTag(f.state) + '</div>' +
          '<div class="tiny muted">' + (f.brand ? u.esc(f.brand) + ' · ' : '') + M.CATS[f.cat].n + '</div></div>' +
          '<button class="btn btn-sm" data-fav2>' + (f.favorite ? '⭐' : '☆') + '</button>' +
        '</div>' +
        '<div class="kpi mt16">' +
          '<div><div class="k">Calorías</div><div class="v">' + u.fmt(f.kcal) + '</div></div>' +
          '<div><div class="k">Proteína</div><div class="v">' + u.fmt(f.protein, 1) + '<small> g</small></div></div>' +
          '<div><div class="k">Carbos</div><div class="v">' + u.fmt(f.carbs, 1) + '<small> g</small></div></div>' +
        '</div>' +
        '<div class="tiny muted center mt8">valores por 100 g' + (f.state !== 'na' ? ' en peso ' + f.state : '') + '</div>' +
        '<div class="sec"><div class="sec-head"><h2>Porciones</h2></div><div class="card">' +
          f.portions.map(function (p) {
            return '<div class="dl"><dt>' + u.esc(p.label) + '</dt><dd>' + u.fmt(p.grams, 1) + ' g</dd></div>';
          }).join('') + '</div></div>' +
        '<div class="sec"><div class="sec-head"><h2>Micronutrientes</h2></div><div class="card">' +
          (complete.length
            ? complete.map(function (m) {
                return '<div class="dl"><dt>' + m.n + '</dt><dd>' + u.fmt(f.micros[m.k], f.micros[m.k] < 10 ? 1 : 0) + ' ' + m.unit + '</dd></div>';
              }).join('')
            : '<div class="tiny muted">Sin datos capturados.</div>') +
          (missing ? '<div class="note warn mt12">Información nutricional incompleta: faltan ' + missing + ' nutrientes.</div>' : '') +
        '</div></div>' +
        (f.price ? '<div class="note mt12">Precio guardado: $' + u.fmt(f.price.amount, 1) + ' por ' + f.price.per + '</div>' : '') +
        '<div class="tiny muted mt16">Fuente: ' + u.esc(f.src || 'sin especificar') + '</div>',
      foot: '<div class="btn-row">' +
              '<button class="btn" data-edit>Editar</button>' +
              '<button class="btn btn-primary" data-addnow>Registrar</button></div>'
    });
    d.on(s.el, 'click', '[data-edit]', function () { s.close(); NT.foodEdit.open(f); });
    d.on(s.el, 'click', '[data-addnow]', function () { s.close(); NT.log.quantitySheet(f, {}); });
    d.on(s.el, 'click', '[data-fav2]', function (e, el) {
      st.toggleFavorite(f.id).then(function () { el.textContent = st.S.foodsById[f.id].favorite ? '⭐' : '☆'; });
    });
  }

  function bind(root) {
    d.on(root, 'input', '#fd-q', u.debounce(function (e, el) {
      term = el.value;
      const sel = el.selectionStart;
      NT.app.rerender();
      const n = d.q('#fd-q');
      if (n) { n.focus(); try { n.setSelectionRange(sel, sel); } catch (x) {} }
    }, 220));
    d.on(root, 'click', '[data-cat]', function (e, el) { cat = el.dataset.cat; NT.app.rerender(); });
    d.on(root, 'click', '[data-food]', function (e, el) { detail(st.S.foodsById[el.dataset.food]); });
    d.on(root, 'click', '[data-add]', function (e, el) { NT.log.quantitySheet(st.S.foodsById[el.dataset.add], {}); });
    d.on(root, 'click', '[data-fav]', function (e, el) { st.toggleFavorite(el.dataset.fav); });
    d.on(root, 'click', '[data-new]', function () { NT.foodEdit.open(null); });
  }

  return { render };
})();

          sw('Recordar comidas', 'A la hora de cada comida programada', 'remindMeals') +
          sw('Recordar agua', 'Un par de avisos durante el día', 'remindWater') +
          sw('Aviso de proteína', 'Si al final del día te falta proteína', 'remindProtein') +

      '<button data-pref="' + key + '">' + ui.toggle(!!st.S.prefs[key]) + '</button></div>';
  }

  /* ---------------- editar perfil ---------------- */
  function openProfile() {
    const p = Object.assign({}, st.S.profile);
    const s = ui.sheet({
      title: 'Mi perfil',
      body: profileForm(p),
      foot: '<button class="btn btn-primary btn-block" data-save>Guardar y recalcular</button>'
    });
    ui.bindSeg(s.el, function (name, val) { p[name] = val; });
    d.on(s.el, 'click', '[data-save]', function () {
      ['name','age','height','weight','weightGoal','trainDays','trainMin','trainTime',
       'workStart','workEnd','sleepHours','wakeTime','sleepTime','activity','trainType'].forEach(function (k) {

        p[k] = (el.type === 'number') ? u.num(el.value, 0) : el.value;
      });
      st.saveProfile(p).then(function () { d.toast('Perfil actualizado'); s.close(); });
    });
    return s;
  }

    return '' +
    '<div class="field"><label>Nombre</label><input class="input" id="p-name" value="' + u.esc(p.name) + '" placeholder="Tu nombre"></div>' +
    '<div class="grid-2">' +
      '<div class="field"><label>Edad</label><div class="inline-unit"><input class="input" id="p-age" type="number" inputmode="numeric" value="' + p.age + '"><span class="u">años</span></div></div>' +
      '<div class="field"><label>Sexo</label>' + ui.seg('sex', [{v:'h',n:'Hombre'},{v:'m',n:'Mujer'}], p.sex) + '</div>' +
    '</div>' +
    '<div class="grid-2">' +
      '<div class="field"><label>Estatura</label><div class="inline-unit"><input class="input" id="p-height" type="number" inputmode="decimal" step="any" value="' + p.height + '"><span class="u">cm</span></div></div>' +
      '<div class="field"><label>Peso actual</label><div class="inline-unit"><input class="input" id="p-weight" type="number" inputmode="decimal" step="any" value="' + p.weight + '"><span class="u">kg</span></div></div>' +
    '</div>' +
    '<div class="field"><label>Peso objetivo</label><div class="inline-unit"><input class="input" id="p-weightGoal" type="number" inputmode="decimal" step="any" value="' + p.weightGoal + '"><span class="u">kg</span></div>' +
      '<div class="hint">Diferencia actual: ' + u.fmt(p.weight - p.weightGoal, 1) + ' kg.</div></div>' +

    '<div class="field"><label>Objetivo principal</label><select class="input" id="p-goal">' +
      Object.keys(M.GOALS).map(function (k) {
        return '<option value="' + k + '"' + (p.goal === k ? ' selected' : '') + '>' + M.GOALS[k].n + '</option>';
      }).join('') + '</select></div>' +
    '<div class="field"><label>Ritmo</label>' +
      ui.seg('pace', Object.keys(M.PACE).map(function (k) { return { v:k, n:M.PACE[k].n }; }), p.pace) +
      '<div class="hint">Suave ≈ 0.3 kg/semana · Moderado ≈ 0.5 · Agresivo ≈ 0.7. ' +
      'Un ritmo más agresivo aumenta el riesgo de perder masa muscular.</div></div>' +

    '<div class="hr"></div>' +
    '<div class="field"><label>Nivel de actividad diaria (sin contar el gimnasio)</label>' +
      '<select class="input" id="p-activity">' +
      Object.keys(M.ACTIVITY).map(function (k) {
        return '<option value="' + k + '"' + (p.activity === k ? ' selected' : '') + '>' + M.ACTIVITY[k].n + ' — ' + M.ACTIVITY[k].d + '</option>';
      }).join('') + '</select></div>' +
    '<div class="grid-2">' +
      '<div class="field"><label>Días de entrenamiento</label><div class="inline-unit"><input class="input" id="p-trainDays" type="number" inputmode="numeric" min="0" max="7" value="' + p.trainDays + '"><span class="u">/sem</span></div></div>' +
      '<div class="field"><label>Duración</label><div class="inline-unit"><input class="input" id="p-trainMin" type="number" inputmode="numeric" value="' + p.trainMin + '"><span class="u">min</span></div></div>' +
    '</div>' +
    '<div class="grid-2">' +
      '<div class="field"><label>Hora de entrenar</label><input class="input" id="p-trainTime" type="time" value="' + p.trainTime + '"></div>' +
      '<div class="field"><label>Tipo</label><select class="input" id="p-trainType">' +
        [['fuerza','Fuerza / pesas'],['cardio','Cardio'],['mixto','Mixto'],['ligero','Ligero']].map(function (o) {
          return '<option value="' + o[0] + '"' + (p.trainType === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
        }).join('') + '</select></div>' +
    '</div>' +
    '<div class="grid-2">' +
      '<div class="field"><label>Entrada al trabajo</label><input class="input" id="p-workStart" type="time" value="' + p.workStart + '"></div>' +
      '<div class="field"><label>Salida</label><input class="input" id="p-workEnd" type="time" value="' + p.workEnd + '"></div>' +
    '</div>' +
    '<div class="grid-3">' +
      '<div class="field"><label>Despertar</label><input class="input" id="p-wakeTime" type="time" value="' + p.wakeTime + '"></div>' +
      '<div class="field"><label>Dormir</label><input class="input" id="p-sleepTime" type="time" value="' + p.sleepTime + '"></div>' +
      '<div class="field"><label>Horas sueño</label><input class="input" id="p-sleepHours" type="number" inputmode="decimal" step="any" value="' + p.sleepHours + '"></div>' +
    '</div>';
  }

  /* ---------------- ajustar objetivos ---------------- */
  function openGoals() {
    const g = Object.assign({}, st.S.goals);
    const est = M.computeTargets(st.S.profile);
    const s = ui.sheet({
      title: 'Objetivos diarios',
      body:
        '<div class="note">Propuesta calculada a partir de tu perfil: <b>' + u.fmt(est.kcal) + ' kcal</b>, ' +
        u.fmt(est.protein) + ' g de proteína, ' + u.fmt(est.carbs) + ' g de carbohidratos y ' + u.fmt(est.fat) + ' g de grasa. ' +
        'Es una <b>estimación</b>, no una prescripción médica. Puedes cambiar cualquier número.</div>' +
        (est.floored ? '<div class="note warn mt12">El déficit calculado quedaba por debajo de tu metabolismo basal, ' +
          'así que subí las calorías a un piso más seguro.</div>' : '') +
        '<div class="grid-2 mt16">' +
          gf('Calorías','kcal','kcal',g.kcal) + gf('Proteína','protein','g',g.protein) +
          gf('Carbohidratos','carbs','g',g.carbs) + gf('Grasas','fat','g',g.fat) +
          gf('Fibra','fiber','g',g.fiber) + gf('Agua','water','ml',g.water) +
        '</div>' +
        '<div id="g-check" class="note mt8"></div>' +
        '<div class="btn-row mt16"><button class="btn btn-sm" data-recalc>Usar la propuesta automática</button></div>',
      foot: '<button class="btn btn-primary btn-block" data-save>Guardar objetivos</button>'
    });

    function check() {
      const k = u.num(d.q('#g-kcal', s.el).value), pr = u.num(d.q('#g-protein', s.el).value),
            c = u.num(d.q('#g-carbs', s.el).value), f = u.num(d.q('#g-fat', s.el).value);
      const sum = pr * 4 + c * 4 + f * 9;
      const diff = sum - k;
      const el = d.q('#g-check', s.el);
      el.className = 'note mt8' + (Math.abs(diff) > k * 0.05 ? ' warn' : '');
      el.innerHTML = 'Tus macros suman <b>' + u.fmt(sum) + ' kcal</b>' +
        (Math.abs(diff) <= k * 0.05 ? ' — coinciden con tu objetivo.'
          : ' — ' + (diff > 0 ? 'están ' + u.fmt(diff) + ' kcal por encima' : 'faltan ' + u.fmt(-diff) + ' kcal') + ' de las ' + u.fmt(k) + ' kcal objetivo.');
    }
    check();
    d.on(s.el, 'input', 'input', check);
    d.on(s.el, 'click', '[data-recalc]', function () {
      ['kcal','protein','carbs','fat','fiber','water'].forEach(function (k) { d.q('#g-' + k, s.el).value = est[k]; });
      check();
    });
    d.on(s.el, 'click', '[data-save]', function () {
      const patch = { auto: false };
      ['kcal','protein','carbs','fat','fiber','water'].forEach(function (k) { patch[k] = u.num(d.q('#g-' + k, s.el).value, 0); });
      st.saveGoals(patch).then(function () { d.toast('Objetivos guardados'); s.close(); });
    });
    return s;
  }

  function gf(label, key, unit, val) {
    return '<div class="field"><label>' + label + '</label><div class="inline-unit">' +
      '<input class="input" id="g-' + key + '" type="number" inputmode="decimal" step="any" value="' + val + '">' +
      '<span class="u">' + unit + '</span></div></div>';
  }

  /* ---------------- eventos ---------------- */
  function bind(root) {
    d.on(root, 'click', '[data-editprofile]', function () { openProfile(); });
    d.on(root, 'click', '[data-goals]', function () { openGoals(); });
    d.on(root, 'click', '[data-go]', function (e, el) {
      const k = el.dataset.go;
      if (k === 'prefs') NT.prefsUI.openPreferences();
      else if (k === 'train') NT.prefsUI.openTraining();
      else if (k === 'supp') NT.prefsUI.openSupplements();
      else if (k === 'meals') { NT.viewMeals.setTab('horario'); NT.app.go('comidas'); }
    });
    d.on(root, 'click', '[data-pref]', function (e, el) {
      const k = el.dataset.pref;
      const patch = {}; patch[k] = !st.S.prefs[k];
      st.savePrefs(patch).then(function () { el.innerHTML = ui.toggle(st.S.prefs[k]); });
    });
    d.on(root, 'click', '[data-notifperm]', function () {
      if (!('Notification' in window)) { d.toast('Este navegador no soporta notificaciones'); return; }
      Notification.requestPermission().then(function (p) {
        d.toast(p === 'granted' ? 'Notificaciones activadas' : 'Permiso no concedido');
      });
    });
    d.on(root, 'click', '[data-export]', function () {
      st.exportAll().then(function (data) {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'nutritrack-' + u.todayKey() + '.json';
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
        d.toast('Respaldo descargado');
      });
    });
