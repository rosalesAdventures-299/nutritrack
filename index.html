:root{
  --bg:#f4f5f7;
  --surface:#ffffff;
  --surface-2:#fafbfc;
  --line:#e7e9ee;
  --line-strong:#d8dbe3;
  --txt:#12151c;
  --txt-2:#5c6474;
  --txt-3:#949cad;

  --brand:#12a37b;
  --brand-soft:#e4f6f0;
  --brand-dark:#0c7a5c;

  --kcal:#f0a020;
  --prot:#2f7de1;
  --carb:#8b5cf6;
  --fat:#ef6f5c;
  --fiber:#68a63c;

  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);
  color:var(--txt);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--brand);text-decoration:none}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.02em}
h1{font-size:26px}
h2{font-size:19px}
h3{font-size:16px}
p{margin:0 0 10px}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

/* ---------- layout ---------- */
#app{min-height:100dvh}
.screen{
  max-width:560px;margin:0 auto;
  padding:0 16px calc(var(--nav-h) + var(--safe-b) + 92px);
}
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--bg);
  padding:14px 0 10px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
}
.topbar::after{content:'';position:absolute;left:-16px;right:-16px;top:100%;height:16px;pointer-events:none;background:linear-gradient(var(--bg),rgba(0,0,0,0))}
.topbar .eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--txt-3);font-weight:650}
.topbar h1{margin-top:2px}
.sec{margin-top:22px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
.sec-head h2{font-size:16px}
.sec-head .link{font-size:13px;font-weight:600;color:var(--brand)}

/* ---------- cards ---------- */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:16px;
  box-shadow:var(--shadow);
}
.card + .card{margin-top:12px}
.card-flat{box-shadow:none}
.card-pad-0{padding:0;overflow:hidden}

/* ---------- ring + macro rows ---------- */
.hero{padding:18px 16px 14px}
.hero-top{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:112px;height:112px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg);display:block}
.ring-mid{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
}
.ring-mid .big{font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1}
.ring-mid .sub{font-size:11px;color:var(--txt-2);margin-top:3px}
.hero-side{flex:1;min-width:0}
.hero-side .kv{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.hero-side .kv b{font-weight:650}

.bars{margin-top:14px;display:grid;gap:12px}
.bar-row .bar-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;gap:8px}
.bar-row .bar-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.bar-row .bar-val{font-size:12.5px;color:var(--txt-2);font-variant-numeric:tabular-nums}
.bar-row .bar-val b{color:var(--txt);font-weight:650}
.track{height:8px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.fill{height:100%;border-radius:99px;transition:width .35s cubic-bezier(.4,0,.2,1);min-width:0}
.fill.over{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 5px,transparent 5px 10px)}
.bar-rest{font-size:11.5px;color:var(--txt-3);margin-top:4px}

/* ---------- meals ---------- */
.meal{
  display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);
  align-items:flex-start;width:100%;text-align:left;
}
.meal:last-child{border-bottom:0}
.meal-time{
  flex:0 0 54px;font-size:12px;font-weight:700;color:var(--txt-2);
  font-variant-numeric:tabular-nums;padding-top:2px;
}
.meal-body{flex:1;min-width:0}
.meal-title{display:flex;align-items:center;gap:8px;font-weight:650;font-size:14.5px}
.meal-title .badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;letter-spacing:.03em}
.badge-done{background:var(--brand-soft);color:var(--brand-dark)}
.badge-now{background:#fff3d6;color:#8a5b00}
.badge-next{background:var(--surface-2);color:var(--txt-2);border:1px solid var(--line)}
.badge-miss{background:#fdecec;color:#a53131}
@media (prefers-color-scheme:dark){
  .badge-now{background:#3a2c07;color:#f4c65a}
  .badge-miss{background:#3a1f1f;color:#f09a9a}
}
.meal-items{margin-top:6px;display:grid;gap:3px}
.meal-item{font-size:13px;color:var(--txt-2);display:flex;justify-content:space-between;gap:10px}
.meal-item .q{color:var(--txt-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.meal-macros{margin-top:7px;font-size:11.5px;color:var(--txt-3);display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.meal-empty{font-size:13px;color:var(--txt-3);font-style:italic;margin-top:4px}
.meal-cta{flex:0 0 auto;align-self:center}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 16px;border-radius:12px;font-size:14.5px;font-weight:650;
  background:var(--surface-2);color:var(--txt);border:1px solid var(--line-strong);
  transition:transform .08s ease, background .15s ease;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--brand);color:#fff;border-color:transparent}
.btn-ghost{background:transparent;border-color:transparent;color:var(--brand);padding:8px 10px}
.btn-danger{color:var(--bad);border-color:var(--line)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn-block{display:flex;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 12px;border-radius:99px;font-size:13px;font-weight:600;
  background:var(--surface);border:1px solid var(--line-strong);color:var(--txt-2);
  white-space:nowrap;
}
.chip.on{background:var(--brand);border-color:transparent;color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

/* ---------- forms ---------- */
.field{margin-bottom:14px}
.field > label{display:block;font-size:12.5px;font-weight:650;color:var(--txt-2);margin-bottom:6px}
.field .hint{font-size:11.5px;color:var(--txt-3);margin-top:5px;line-height:1.4}
.input,select.input,textarea.input{
  width:100%;padding:12px 13px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line-strong);
  font-size:15.5px;color:var(--txt);
}
textarea.input{resize:vertical;min-height:80px;line-height:1.5}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--txt-3) 50%),linear-gradient(135deg,var(--txt-3) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
.input::placeholder{color:var(--txt-3)}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.inline-unit{position:relative}
.inline-unit .u{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--txt-3);pointer-events:none}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--txt-2)}
.seg button.on{background:var(--surface);color:var(--txt);box-shadow:var(--shadow)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.switch > div:first-child{flex:1;min-width:0}
.switch > button{flex:0 0 auto;display:flex;align-items:center}
.switch:last-child{border-bottom:0}
.switch .sw-txt{font-size:14px;font-weight:600}
.switch .sw-sub{font-size:12px;color:var(--txt-3);font-weight:400;margin-top:2px}
.toggle{width:46px;height:27px;border-radius:99px;background:var(--line-strong);position:relative;flex:0 0 auto;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle.on{background:var(--brand)}
.toggle.on::after{transform:translateX(19px)}

/* ---------- list rows ---------- */
.row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 16px;border-bottom:1px solid var(--line);background:none;
}
.row:last-child{border-bottom:0}
.row-ico{
  flex:0 0 auto;width:38px;height:38px;border-radius:11px;background:var(--surface-2);
  display:grid;place-items:center;font-size:18px;border:1px solid var(--line);
}
.row-main{flex:1;min-width:0;display:block;text-align:left;background:none}
.row-t{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{display:block;font-size:12px;color:var(--txt-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-end{flex:0 0 auto;text-align:right;font-size:12.5px;color:var(--txt-2);font-variant-numeric:tabular-nums}
.row-end b{display:block;font-size:14px;color:var(--txt);font-weight:650}
.row-chev{color:var(--txt-3);font-size:18px;flex:0 0 auto}

.empty{text-align:center;padding:34px 20px;color:var(--txt-3)}
.empty-sm{padding:16px;text-align:center;color:var(--txt-3);font-size:13px;font-style:italic}
.empty .ico{font-size:34px;margin-bottom:10px}
.empty p{font-size:13.5px;margin:0 auto;max-width:280px}

/* ---------- nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:saturate(180%) blur(18px);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  border-top:1px solid var(--line);
  display:flex;
}
.nav-inner{max-width:560px;margin:0 auto;width:100%;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--txt-3);font-size:10px;font-weight:600;padding-top:6px;
}
.nav button .ni{font-size:19px;line-height:1}
.nav button.on{color:var(--brand)}
.fab{
  position:fixed;z-index:41;right:max(16px, calc(50vw - 280px + 16px));
  bottom:calc(var(--nav-h) + var(--safe-b) + 16px);
  height:54px;padding:0 20px;border-radius:99px;
  background:var(--brand);color:#fff;font-weight:700;font-size:15px;
  box-shadow:0 8px 22px rgba(18,163,123,.42);
  display:flex;align-items:center;gap:8px;
}
.fab:active{transform:scale(.96)}

/* ---------- sheet / modal ---------- */
.scrim{
  position:fixed;inset:0;z-index:60;background:rgba(9,12,18,.5);
  opacity:0;transition:opacity .22s ease;
  display:flex;align-items:flex-end;justify-content:center;
}
.scrim.show{opacity:1}
.sheet{
  width:100%;max-width:560px;max-height:92dvh;
  background:var(--bg);border-radius:22px 22px 0 0;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg);
  padding-bottom:var(--safe-b);
}
.scrim.show .sheet{transform:translateY(0)}
.sheet-head{
  padding:14px 16px 10px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--line);position:relative;flex:0 0 auto;
}
.sheet-head h2{flex:1;font-size:17px}
.sheet-grab{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:99px;background:var(--line-strong)}
.sheet-body{padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.sheet-foot{padding:12px 16px 16px;border-top:1px solid var(--line);background:var(--surface);flex:0 0 auto}
.x{width:32px;height:32px;border-radius:50%;background:var(--surface-2);color:var(--txt-2);display:grid;place-items:center;font-size:17px;border:1px solid var(--line)}

.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 82px);
  transform:translate(-50%,14px);z-index:80;
  background:#12151c;color:#fff;padding:11px 16px;border-radius:12px;
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);
  opacity:0;transition:all .22s ease;pointer-events:none;max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- misc ---------- */
.note{
  font-size:12px;color:var(--txt-2);background:var(--surface-2);
  border:1px solid var(--line);border-left:3px solid var(--brand);
  padding:10px 12px;border-radius:8px;line-height:1.5;
}
.note.warn{border-left-color:var(--warn)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.kpi > div{background:var(--surface);padding:13px 10px;text-align:center}
.kpi .k{font-size:11px;color:var(--txt-3);font-weight:600}
.kpi .v{font-size:18px;font-weight:700;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:11px;font-weight:600;color:var(--txt-3)}

.micro-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.micro-row:last-child{border-bottom:0}
.micro-name{flex:0 0 108px;font-size:13px;font-weight:600}
.micro-bar{flex:1}
.micro-val{flex:0 0 auto;font-size:11.5px;color:var(--txt-2);font-variant-numeric:tabular-nums;text-align:right;min-width:82px}

.pill-macro{display:inline-flex;gap:4px;align-items:baseline;font-size:11.5px;font-variant-numeric:tabular-nums}
.pill-macro b{font-weight:700}

.sug{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface)}
.sug + .sug{margin-top:10px}
.sug-t{font-size:14px;font-weight:650;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sug-s{font-size:12px;color:var(--txt-2);margin-top:4px;line-height:1.5}
.sug-m{font-size:11.5px;color:var(--txt-3);margin-top:7px;display:flex;gap:9px;flex-wrap:wrap;font-variant-numeric:tabular-nums}

.qty-stepper{display:flex;align-items:center;gap:10px}
.qty-stepper .stp{width:42px;height:42px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-size:20px;color:var(--txt-2);display:grid;place-items:center}
.qty-stepper .input{text-align:center;font-weight:650;font-size:17px}

.searchbar{position:relative}
.searchbar .input{padding-left:38px}
.searchbar .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--txt-3);font-size:15px}

.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
.tabs button{flex:1;padding:9px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--txt-2)}
.tabs button.on{background:var(--surface);color:var(--txt);box-shadow:var(--shadow)}

.skel{background:linear-gradient(90deg,var(--line) 25%,var(--surface-2) 50%,var(--line) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

.onb{max-width:460px;margin:0 auto;padding:26px 18px calc(28px + var(--safe-b));min-height:100dvh;display:flex;flex-direction:column}
.onb-prog{display:flex;gap:5px;margin-bottom:22px}
.onb-prog span{height:4px;flex:1;border-radius:99px;background:var(--line)}
.onb-prog span.on{background:var(--brand)}
.onb-body{flex:1}
.onb h1{font-size:24px;margin-bottom:6px}
.onb .lead{color:var(--txt-2);font-size:14px;margin-bottom:22px;line-height:1.5}
.onb-foot{padding-top:16px}

.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.03em;font-size:19px}
.logo .mark{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:16px;box-shadow:0 4px 12px rgba(18,163,123,.35)}

.dl{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.dl:last-child{border-bottom:0}
.dl dt{color:var(--txt-2)}
.dl dd{margin:0;font-weight:650;font-variant-numeric:tabular-nums;text-align:right}

.tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--txt-3);border:1px solid var(--line);letter-spacing:.02em}
.tag-raw{background:#fff4e6;color:#a35b00;border-color:#ffe0b8}
.tag-cook{background:#e8f1ff;color:#1b5bb5;border-color:#cfe0ff}
@media (prefers-color-scheme:dark){
  .tag-raw{background:#3a2a12;color:#f0b366;border-color:#4d3a1c}
  .tag-cook{background:#12233d;color:#8ab6f5;border-color:#1d3557}
}
.hr{height:1px;background:var(--line);margin:16px 0}
.center{text-align:center}
.muted{color:var(--txt-2)}
.tiny{font-size:11.5px}
.nowrap{white-space:nowrap}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.mb0{margin-bottom:0}

.cap{display:inline-block}
.cap::first-letter{text-transform:uppercase}

</style>
</head>

<div id="app">
  <div class="screen" style="padding-top:40vh;text-align:center">
    <div class="logo" style="justify-content:center"><span class="mark">N</span> NUTRI TRACK</div>
    <div class="tiny muted mt12">Cargando tu día…</div>
  </div>
</div>
<script>

/* ===== 00-core.js ===== */
/* ============================================================
   NUTRI TRACK — núcleo: utilidades, DOM y persistencia
   ============================================================ */
var NT = window.NT || {};
window.NT = NT;

NT.VERSION = '1.1.0';
NT.ICON = 'icons/icon-192.png';
NT.ICON = 'icons/icon-192.png';

/* ---------------- utilidades ---------------- */
NT.u = (function () {
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

  function pad(n) { return String(n).padStart(2, '0'); }

  function todayKey(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function keyToDate(k) {
    const p = String(k).split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }
  function addDays(key, n) {
    const d = keyToDate(key); d.setDate(d.getDate() + n); return todayKey(d);
  }
  function longDate(k) {
    const d = keyToDate(k);
    return DIAS[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()];
  }
  function shortDate(k) {
    const d = keyToDate(k);
    return d.getDate() + ' ' + MESES[d.getMonth()].slice(0, 3);
  }
  function nowMinutes() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  function hhmmToMin(s) { const p = String(s || '00:00').split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
  function minToHhmm(m) { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function pretty12(hhmm) {
    const m = hhmmToMin(hhmm), h = Math.floor(m / 60), mi = m % 60;
    const ap = h < 12 ? 'AM' : 'PM'; let h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + ':' + pad(mi) + ' ' + ap;
  }
  function greeting() {
    const h = new Date().getHours();
    if (h < 12) return 'Buenos días';
    if (h < 19) return 'Buenas tardes';
    return 'Buenas noches';
  }

  function uid(p) {
    return (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function num(v, d) { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : (d === undefined ? 0 : d); }
  function r0(n) { return Math.round(n || 0); }
  function r1(n) { return Math.round((n || 0) * 10) / 10; }
  function fmt(n, dec) {
    if (n === null || n === undefined || !isFinite(n)) return '—';
    const v = dec ? r1(n) : r0(n);
    return v.toLocaleString('es-MX', { maximumFractionDigits: dec ? 1 : 0 });
  }
  function fmtG(n) { return fmt(n) + ' g'; }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function norm(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
  }
  function debounce(fn, ms) {
    let t; return function () { const a = arguments, c = this; clearTimeout(t); t = setTimeout(() => fn.apply(c, a), ms || 220); };
  }
  return { pad, todayKey, keyToDate, addDays, longDate, shortDate, nowMinutes, hhmmToMin, minToHhmm,

NT.dom = (function () {
  function h(html) { const t = document.createElement('template'); t.innerHTML = String(html).trim(); return t.content.firstElementChild; }
  function q(sel, root) { return (root || document).querySelector(sel); }
  function qa(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function on(root, evt, sel, fn) {
    root.addEventListener(evt, function (e) {
      const t = e.target.closest(sel);
      if (t && root.contains(t)) fn.call(t, e, t);
    });
  }
  let toastTimer = null;
  function toast(msg) {
    let el = q('#toast');
    if (!el) { el = h('<div id="toast" class="toast"></div>'); document.body.appendChild(el); }
    el.textContent = msg;
    requestAnimationFrame(() => el.classList.add('show'));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
  }
  return { h, q, qa, on, toast };
})();

/* ---------------- IndexedDB ---------------- */
NT.db = (function () {
  const NAME = 'nutritrack';
  const VERSION = 1;
  const STORES = {
    kv:            { keyPath: 'k' },
    foods:         { keyPath: 'id', indexes: [['byName', 'nameKey']] },
    entries:       { keyPath: 'id', indexes: [['byDate', 'date']] },
    measurements:  { keyPath: 'id', indexes: [['byDate', 'date']] },
    workouts:      { keyPath: 'id', indexes: [['byDate', 'date']] },
    supplements:   { keyPath: 'id' },
    photos:        { keyPath: 'id', indexes: [['byDate', 'date']] },
    plans:         { keyPath: 'id' },
    shopping:      { keyPath: 'id' }
  };
  let _db = null;
  let memory = null; // respaldo si IndexedDB no está disponible

  function open() {
    if (_db) return Promise.resolve(_db);
    if (memory) return Promise.resolve(null);
    return new Promise(function (resolve) {
      let req;
      try { req = indexedDB.open(NAME, VERSION); }
      catch (e) { memory = makeMemory(); return resolve(null); }
      req.onupgradeneeded = function (e) {
        const db = e.target.result;
        Object.keys(STORES).forEach(function (name) {
          if (db.objectStoreNames.contains(name)) return;
          const cfg = STORES[name];
          const os = db.createObjectStore(name, { keyPath: cfg.keyPath });
          (cfg.indexes || []).forEach(function (ix) { os.createIndex(ix[0], ix[1], { unique: false }); });
        });
      };
      req.onsuccess = function (e) { _db = e.target.result; resolve(_db); };
      req.onerror = function () { memory = makeMemory(); resolve(null); };
      req.onblocked = function () { memory = makeMemory(); resolve(null); };
    });
  }

  function makeMemory() {
    const m = {};
    Object.keys(STORES).forEach(function (s) { m[s] = {}; });
    try {
      const raw = localStorage.getItem('nutritrack_fallback');
      if (raw) Object.assign(m, JSON.parse(raw));
    } catch (e) {}
    return m;
  }
  function saveMemory() {
    try { localStorage.setItem('nutritrack_fallback', JSON.stringify(memory)); } catch (e) {}
  }

  function tx(store, mode, fn) {
    return open().then(function (db) {
      if (!db) { const r = fn(null, memory[store]); saveMemory(); return Promise.resolve(r); }
      return new Promise(function (resolve, reject) {
        const t = db.transaction(store, mode);
        const os = t.objectStore(store);
        let out;
        try { out = fn(os, null); } catch (e) { reject(e); return; }
        t.oncomplete = function () { resolve(out && out.__req ? out.__req.result : out); };
        t.onerror = function () { reject(t.error); };
        t.onabort = function () { reject(t.error); };
      });
    });
  }

  function put(store, obj) {
    return tx(store, 'readwrite', function (os, mem) {
      if (mem) { mem[obj[STORES[store].keyPath]] = obj; return obj; }
      os.put(obj); return obj;
    });
  }
  function putAll(store, arr) {
    return tx(store, 'readwrite', function (os, mem) {
      arr.forEach(function (o) { if (mem) mem[o[STORES[store].keyPath]] = o; else os.put(o); });
      return arr.length;
    });
  }
  function del(store, key) {
    return tx(store, 'readwrite', function (os, mem) {
      if (mem) { delete mem[key]; return true; }
      os.delete(key); return true;
    });
  }
  function get(store, key) {
    return tx(store, 'readonly', function (os, mem) {
      if (mem) return mem[key] || null;
      return { __req: os.get(key) };
    }).then(function (v) { return v || null; });
  }
  function all(store) {
    return tx(store, 'readonly', function (os, mem) {
      if (mem) return Object.keys(mem).map(function (k) { return mem[k]; });
      return { __req: os.getAll() };
    }).then(function (v) { return v || []; });
  }
  function byIndex(store, index, value) {
    return tx(store, 'readonly', function (os, mem) {
      if (mem) {
        const field = (STORES[store].indexes || []).filter(function (i) { return i[0] === index; })[0][1];
        return Object.keys(mem).map(function (k) { return mem[k]; }).filter(function (o) { return o[field] === value; });
      }
      return { __req: os.index(index).getAll(value) };
    }).then(function (v) { return v || []; });
  }
  function clear(store) {
    return tx(store, 'readwrite', function (os, mem) {
      if (mem) { Object.keys(mem).forEach(function (k) { delete mem[k]; }); return true; }
      os.clear(); return true;
    });
  }

  /* clave-valor sencillo */
  function kvGet(k, def) { return get('kv', k).then(function (r) { return r ? r.v : (def === undefined ? null : def); }); }
  function kvSet(k, v) { return put('kv', { k: k, v: v }); }

  return { open, put, putAll, del, get, all, byIndex, clear, kvGet, kvSet,
           isFallback: function () { return !!memory; } };
})();
