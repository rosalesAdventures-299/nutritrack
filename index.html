    d.on(root, 'click', '[data-import]', function () { d.q('#imp-file', root).click(); });
    d.on(root, 'change', '#imp-file', function (e, el) {
      const file = el.files[0]; if (!file) return;
      const fr = new FileReader();
      fr.onload = function () {
        try {
          st.importAll(JSON.parse(fr.result)).then(function () {
            d.toast('Datos importados'); NT.app.rerender();
          }).catch(function (err) { d.toast('Error: ' + err.message); });
        } catch (x) { d.toast('El archivo no es válido'); }
      };
      fr.readAsText(file);
    });
    d.on(root, 'click', '[data-wipe]', function () {
      ui.confirm('Esto borra perfil, alimentos, registros y mediciones de este dispositivo. No se puede deshacer.',
        { danger:true, ok:'Borrar todo', title:'¿Borrar todos mis datos?' }).then(function (ok) {
        if (!ok) return;
        st.wipe().then(function () { location.reload(); });
      });
    });
  }

  return { render, openProfile, openGoals, profileForm };
})();


/* ===== 65-view-plan.js ===== */
/* ============================================================
   NUTRI TRACK — pantalla "Plan del día" (Fase 2)
   ============================================================ */
NT.viewPlan = (function () {
  const u = NT.u, d = NT.dom, ui = NT.ui, st = NT.state, M = NT.model;

  function render(root) {
    const S = st.S, plan = S.plan, day = S.day;

    root.innerHTML =
      '<div class="tiny muted cap" style="margin-bottom:10px">' + u.longDate(S.dateKey) + '</div>' +
      (plan ? planHtml(plan, day) : emptyHtml());
    bind(root);
  }

  function emptyHtml() {
    return '<div class="card">' +
      '<div style="font-weight:700;font-size:16px">Todavía no hay plan para este día</div>' +
      '<div class="tiny muted mt8">Armo qué comer en cada comida y en qué cantidad, ' +
      'a partir de tus objetivos, tus horarios y los alimentos de tu biblioteca ' +
      '(dando prioridad a tus favoritos).</div>' +
      '<button class="btn btn-primary btn-block mt16" data-gen>✨ Generar plan del día</button>' +
      '</div>' +
      '<div class="note mt16">El plan es una guía, no una obligación. Si comes otra cosa, ' +
      'regístrala y recalculo lo que falta con el botón <b>Ajustar el resto</b>.</div>';
  }

  function planHtml(plan, day) {
    const g = plan.goals, t = plan.total;
    const doneIds = {};
    day.byMeal.forEach(function (b) { if (b.entries.length) doneIds[b.meal.id] = true; });

    return '<div class="card">' +
        '<div class="sec-head" style="margin-bottom:10px"><h2>Lo que te toca comer hoy</h2></div>' +
        '<div class="kpi">' +
          '<div><div class="k">Calorías</div><div class="v">' + u.fmt(t.kcal) + '</div></div>' +
          '<div><div class="k">Proteína</div><div class="v">' + u.fmt(t.protein) + '<small> g</small></div></div>' +
          '<div><div class="k">Carbos</div><div class="v">' + u.fmt(t.carbs) + '<small> g</small></div></div>' +
        '</div>' +
        '<div class="tiny muted center mt8">objetivo: ' + u.fmt(g.kcal) + ' kcal · P ' + u.fmt(g.protein) +
          ' · C ' + u.fmt(g.carbs) + ' · G ' + u.fmt(g.fat) + '</div>' +
        '<div class="btn-row mt16">' +
          '<button class="btn btn-sm" data-other>🔀 Otra propuesta</button>' +
          '<button class="btn btn-sm" data-replan>♻️ Ajustar el resto</button>' +
        '</div>' +
      '</div>' +

      plan.meals.map(function (m) {
        const done = !!doneIds[m.mealId];
        return '<div class="sec"><div class="sec-head">' +
          '<h2>' + (m.emoji || '🍽️') + ' ' + u.esc(m.mealName) +
            ' <span class="tiny muted">· ' + u.pretty12(m.time) + '</span></h2>' +
          (done ? '<span class="badge badge-done">✓ Registrada</span>' : '') +
          '</div>' +
          (m.recipeName
            ? '<div class="card" style="margin-bottom:10px;padding:12px 14px">' +
                '<div style="display:flex;align-items:center;gap:10px">' +
                  '<span style="font-size:22px">' + (m.recipeEmoji || '🍽️') + '</span>' +
                  '<div style="flex:1;min-width:0">' +
                    '<div style="font-weight:700;font-size:15px">' + u.esc(m.recipeName) + '</div>' +
                    '<div class="tiny muted">' + (m.minutes ? m.minutes + ' min de preparación' : 'platillo del recetario') + '</div>' +
                  '</div>' +
                  '<button class="btn btn-sm" data-recipe="' + m.mealId + '">Ver receta</button>' +
                '</div></div>'
            : '') +
          '<div class="card card-pad-0">' +
          (m.items.length
            ? m.items.map(function (it, i) {
                return '<button class="row" data-item="' + m.mealId + '|' + i + '">' +
                  '<span class="row-ico">' + (it.emoji || '🍽️') + '</span>' +
                  '<span class="row-main"><span class="row-t">' + u.esc(it.name) + ' ' + ui.stateTag(it.state) + '</span>' +
                  '<span class="row-s">' + u.fmt(it.grams) + ' g · ' + u.fmt(it.n.kcal) + ' kcal · P ' +
                    u.fmt(it.n.protein, 1) + ' g</span></span>' +
                  '<span class="row-chev">›</span></button>';
              }).join('')
            : '<div class="empty-sm">Sin alimentos asignados</div>') +
          '<div class="row" style="background:var(--surface-2)">' +
            '<span class="row-main"><span class="row-t tiny">Aporta</span></span>' +
            '<span class="row-end"><b>' + u.fmt(m.sum.kcal) + ' kcal</b>P ' + u.fmt(m.sum.protein) +
              ' · C ' + u.fmt(m.sum.carbs) + ' · G ' + u.fmt(m.sum.fat) + '</span></div>' +
          '</div>' +
          '<div class="btn-row mt12">' +
            (done
              ? '<button class="btn btn-sm" disabled>Ya registrada</button>'
              : '<button class="btn btn-sm btn-primary" data-logplan="' + m.mealId + '">✓ Comí esto</button>') +
            '<button class="btn btn-sm" data-editmealplan="' + m.mealId + '">Cambiar</button>' +
          '</div></div>';
      }).join('') +

      '<div class="sec"><div class="card">' +
        '<div class="tiny muted">El plan se guarda en tu dispositivo y puedes editarlo alimento por alimento. ' +
        'Tocar “Comí esto” registra la comida completa de un golpe.</div>' +
        '<button class="btn btn-sm btn-danger btn-block mt12" data-del>Borrar el plan de hoy</button>' +
      '</div></div>';
  }

  /* ---------- editar un alimento del plan ---------- */
  function itemSheet(mealId, index) {
    const plan = st.S.plan;
    const meal = plan.meals.filter(function (m) { return m.mealId === mealId; })[0];
    const it = meal.items[index];
    const food = st.S.foodsById[it.foodId];

    const s = ui.sheet({
      title: it.name,
      body:
        '<div class="field"><label>Cantidad planeada</label>' +
          '<div class="inline-unit"><input class="input" id="pi-g" type="number" inputmode="decimal" step="any" value="' + it.grams + '">' +
          '<span class="u">g' + (it.state !== 'na' ? ' ' + it.state : '') + '</span></div></div>' +
        '<div class="kpi" id="pi-macros">' + macros(it) + '</div>' +
        '<div class="btn-row mt16">' +
          '<button class="btn btn-sm btn-primary" data-swap>🔁 No tengo esto</button>' +
          '<button class="btn btn-sm" data-remove>🗑️ Quitar</button>' +
        '</div>' +
        '<div class="tiny muted mt12">Si cambias este ingrediente, reajusto las cantidades del ' +
        'resto del platillo para que los macros de la comida sigan cuadrando.</div>' +
        (food ? '<div class="tiny muted mt16">Fuente: ' + u.esc(food.src || '—') + '</div>' : ''),
      foot: '<div class="btn-row">' +
              '<button class="btn" data-lognow>Registrar solo esto</button>' +
              '<button class="btn btn-primary" data-savei>Guardar</button></div>'
    });

    function macros(x) {
      return '<div><div class="k">kcal</div><div class="v">' + u.fmt(x.n.kcal) + '</div></div>' +
             '<div><div class="k">Proteína</div><div class="v">' + u.fmt(x.n.protein, 1) + '<small> g</small></div></div>' +
             '<div><div class="k">Carbos</div><div class="v">' + u.fmt(x.n.carbs, 1) + '<small> g</small></div></div>';
    }
    function recalc(grams) {
      const k = grams / 100;
      return { kcal:it.per100.kcal*k, protein:it.per100.protein*k, carbs:it.per100.carbs*k, fat:it.per100.fat*k };
    }
    d.on(s.el, 'input', '#pi-g', function (e, el) {
      const n = recalc(u.num(el.value, 0));
      d.q('#pi-macros', s.el).innerHTML = macros({ n: n });
    });
    d.on(s.el, 'click', '[data-savei]', function () {
      it.grams = u.num(d.q('#pi-g', s.el).value, it.grams);
      it.n = recalc(it.grams);
      resum(plan);
      st.savePlan(plan).then(function () { d.toast('Plan actualizado'); s.close(); });
    });
    d.on(s.el, 'click', '[data-remove]', function () {
      meal.items.splice(index, 1);
      resum(plan);
      st.savePlan(plan).then(function () { d.toast('Alimento quitado del plan'); s.close(); });
    });
    d.on(s.el, 'click', '[data-lognow]', function () {
      if (!food) { d.toast('Ese alimento ya no está en tu biblioteca'); return; }
      st.logFood(food, u.num(d.q('#pi-g', s.el).value, it.grams), 'g', { mealId: mealId, source: 'plan' })
        .then(function () { d.toast('✓ Registrado'); s.close(); });
    });
    d.on(s.el, 'click', '[data-swap]', function () { swapSheet(mealId, index); });
  }

  function swapSheet(mealId, index) {
    const plan = st.S.plan;
    const meal = plan.meals.filter(function (m) { return m.mealId === mealId; })[0];
    const it = meal.items[index];
    const cands = NT.recipes.swapCandidates(it, st.S.foods, 16);

    const s = ui.sheet({
      title: 'En vez de ' + it.name,
      body:
        '<div class="note">Dime qué sí tienes y recalculo las cantidades de todo el platillo ' +
        'para que la comida siga aportando lo mismo. Tus favoritos van primero.</div>' +
        '<div class="searchbar mt16"><span class="si">🔍</span>' +
          '<input class="input" id="sw-q" type="search" placeholder="Buscar otro alimento…"></div>' +
        '<div class="card card-pad-0 mt12" id="sw-list"></div>'
    });

    function draw(term) {
      let list = cands;
      if (term) {
        const q = u.norm(term);
        list = st.searchFoods(term).slice(0, 20).map(function (f) {
          const c = NT.recipes.swapCandidates(it, [f], 1)[0];
          return c || null;
        }).filter(Boolean);
      }
      d.q('#sw-list', s.el).innerHTML = list.length
        ? list.map(function (c, i) {
            return '<button class="row" data-alt="' + c.food.id + '">' +
              '<span class="row-ico">' + (c.food.emoji || '🍽️') + '</span>' +
              '<span class="row-main"><span class="row-t">' + u.esc(c.food.name) +
                (c.food.favorite ? ' ⭐' : '') + ' ' + ui.stateTag(c.food.state) + '</span>' +
              '<span class="row-s">usaría ' + u.fmt(c.grams) + ' g · ' + u.fmt(c.n.kcal) +
                ' kcal · P ' + u.fmt(c.n.protein, 1) + '</span></span>' +
              '<span class="row-chev">›</span></button>';
          }).join('')
        : ui.empty('🔎', 'Sin opciones', 'Busca el alimento por su nombre.');
    }
    draw('');
    d.on(s.el, 'input', '#sw-q', u.debounce(function (e, el) { draw(el.value); }, 180));

    d.on(s.el, 'click', '[data-alt]', function (e, el) {
      const food = st.S.foodsById[el.dataset.alt];
      if (!food) return;
      const res = NT.recipes.swapIngredient(meal.items, index, food, meal.target);
      if (!res) { d.toast('No pude hacer el cambio'); return; }
      meal.sum = res.sum;
      meal.swapped = true;
      resum(plan);
      st.savePlan(plan).then(function () {
        ui.closeAllSheets();
        afterSwap(res.from, res.to);
      });
    });
  }

  /* tras cambiar un ingrediente, ofrece reacomodar lo que queda del día */
  function afterSwap(from, to) {
    const s = ui.sheet({
      title: 'Listo, cambié el platillo',
      body:
        '<div class="card"><div style="font-weight:650">' + u.esc(from) + ' → ' + u.esc(to) + '</div>' +
        '<div class="tiny muted mt8">Reajusté las cantidades del platillo para que aporte ' +
        'prácticamente lo mismo que antes.</div></div>' +
        '<div class="note mt16">¿Quieres que además reacomode las comidas que te faltan hoy, ' +
        'para compensar cualquier diferencia?</div>',
      foot: '<div class="btn-row">' +
              '<button class="btn" data-close>Así está bien</button>' +
              '<button class="btn btn-primary" data-adjust>Sí, ajusta el resto</button></div>'
    });
    d.on(s.el, 'click', '[data-adjust]', function () {
      st.replanRemaining().then(function (p) {
        d.toast(p ? 'Ajusté lo que falta del día' : 'Ya no quedan comidas pendientes');
        s.close();
      });
    });
  }

  /* ---------- ficha de la receta ---------- */
  function recipeSheet(mealId) {
    const meal = st.S.plan.meals.filter(function (m) { return m.mealId === mealId; })[0];
    if (!meal || !meal.recipeName) return;
    ui.sheet({
      title: meal.recipeName,
      body:
        '<div class="card" style="display:flex;gap:12px;align-items:center">' +
          '<span style="font-size:30px">' + (meal.recipeEmoji || '🍽️') + '</span>' +
          '<div><div style="font-weight:700">' + u.esc(meal.recipeName) + '</div>' +
          '<div class="tiny muted">' + (meal.minutes ? meal.minutes + ' min · ' : '') +
            u.fmt(meal.sum.kcal) + ' kcal · P ' + u.fmt(meal.sum.protein) + ' g</div></div>' +
        '</div>' +
        '<div class="sec"><div class="sec-head"><h2>Ingredientes</h2></div>' +
          '<div class="card card-pad-0">' +
            meal.items.map(function (it) {
              return '<div class="row"><span class="row-ico">' + (it.emoji || '🍽️') + '</span>' +
                '<span class="row-main"><span class="row-t">' + u.esc(it.name) + ' ' +
                  ui.stateTag(it.state) + (it.swapped ? ' <span class="tag">cambiado</span>' : '') + '</span>' +
                '<span class="row-s">' + u.fmt(it.n.kcal) + ' kcal · P ' + u.fmt(it.n.protein, 1) + ' g</span></span>' +
                '<span class="row-end"><b>' + u.fmt(it.grams) + ' g</b></span></div>';
            }).join('') +
          '</div></div>' +
        (meal.steps && meal.steps.length
          ? '<div class="sec"><div class="sec-head"><h2>Preparación</h2></div><div class="card">' +
              meal.steps.map(function (t, i) {
                return '<div style="display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)">' +
                  '<span style="flex:0 0 22px;height:22px;border-radius:50%;background:var(--brand-soft);' +
                  'color:var(--brand-dark);font-size:12px;font-weight:700;display:grid;place-items:center">' +
                  (i + 1) + '</span><span style="font-size:13.5px;line-height:1.5">' + u.esc(t) + '</span></div>';
              }).join('') +
            '</div></div>'
          : '') +
        '<div class="note mt16">Las cantidades ya están ajustadas a lo que te toca en esta comida, ' +
        'no son las de una receta genérica.</div>',
      foot: '<button class="btn btn-primary btn-block" data-close>Cerrar</button>'
    });
  }

  function resum(plan) {
    const t = { kcal:0, protein:0, carbs:0, fat:0 };
    plan.meals.forEach(function (m) {
      m.sum = { kcal:0, protein:0, carbs:0, fat:0 };
      m.items.forEach(function (it) {
        m.sum.kcal += it.n.kcal; m.sum.protein += it.n.protein;
        m.sum.carbs += it.n.carbs; m.sum.fat += it.n.fat;
      });
      t.kcal += m.sum.kcal; t.protein += m.sum.protein; t.carbs += m.sum.carbs; t.fat += m.sum.fat;
    });
    plan.total = t;
  }

  /* ---------- eventos ---------- */
  let variant = 0;
  function bind(root) {
    d.on(root, 'click', '[data-gen]', function () {
      st.generatePlan({ variant: 0 }).then(function () { d.toast('Plan generado'); });
    });
    d.on(root, 'click', '[data-other]', function () {
      variant = (variant + 1) % 50;
      st.generatePlan({ variant: variant }).then(function () { d.toast('Nueva propuesta'); });
    });
    d.on(root, 'click', '[data-replan]', function () {
      st.replanRemaining().then(function (p) {
        d.toast(p ? 'Ajusté las comidas que faltan' : 'Ya no quedan comidas pendientes hoy');
      });
    });
    d.on(root, 'click', '[data-del]', function () {
      ui.confirm('¿Borrar el plan de este día?', { danger:true, ok:'Borrar' }).then(function (ok) {
        if (ok) st.deletePlan().then(function () { d.toast('Plan borrado'); });
      });
    });
    d.on(root, 'click', '[data-logplan]', function (e, el) {
      st.logPlannedMeal(el.dataset.logplan).then(function (rows) {
        d.toast(rows.length ? '✓ ' + rows.length + ' alimentos registrados' : 'Nada que registrar');
      });
    });
    d.on(root, 'click', '[data-item]', function (e, el) {
      const p = el.dataset.item.split('|');
      itemSheet(p[0], u.num(p[1]));
    });
    d.on(root, 'click', '[data-recipe]', function (e, el) { recipeSheet(el.dataset.recipe); });
    d.on(root, 'click', '[data-editmealplan]', function (e, el) {
      const m = st.S.meals.filter(function (x) { return x.id === el.dataset.editmealplan; })[0];
      NT.log.openLog({ mealId: el.dataset.editmealplan, mealTitle: m ? m.name : '' });
    });
  }

  return { render, resum };
})();


/* ===== 66-view-body.js ===== */
/* ============================================================
   NUTRI TRACK — pantalla "Mi progreso" (Fase 3 y 4)
   Mediciones, tendencias, fotos y análisis semanal/mensual.
   ============================================================ */
NT.viewProgress = (function () {
  const u = NT.u, d = NT.dom, ui = NT.ui, st = NT.state, M = NT.model, ME = NT.measure;

  let tab = 'cuerpo';
  let metric = 'weight';
  let photos = [];
  let weekCache = null;

  const METRICS = [
    { k:'weight',     n:'Peso',          unit:'kg', color:'var(--brand)', down:true },
    { k:'bodyFat',    n:'% grasa',       unit:'%',  color:'var(--fat)',   down:true },
    { k:'fatMass',    n:'Masa grasa',    unit:'kg', color:'var(--kcal)',  down:true },
    { k:'muscleMass', n:'Masa muscular', unit:'kg', color:'var(--prot)',  down:false },
    { k:'waterPct',   n:'% agua',        unit:'%',  color:'var(--water)', down:false }
  ];

  function render(root) {
    root.innerHTML =
      '<div class="topbar"><div><div class="eyebrow">Seguimiento</div><h1>Mi progreso</h1></div>' +
        (tab === 'cuerpo' ? '<button class="btn btn-sm btn-primary" data-analyze>📷</button>' : '') +
      '</div>' +
      '<div class="tabs">' +
        '<button data-pt="cuerpo" class="' + (tab === 'cuerpo' ? 'on' : '') + '">Cuerpo</button>' +
        '<button data-pt="fotos" class="' + (tab === 'fotos' ? 'on' : '') + '">Fotos</button>' +
        '<button data-pt="analisis" class="' + (tab === 'analisis' ? 'on' : '') + '">Análisis</button>' +
      '</div>' +
      '<div id="pg-body"></div>';

    const box = d.q('#pg-body', root);
    if (tab === 'cuerpo') box.innerHTML = bodyTab();
    else if (tab === 'fotos') { box.innerHTML = '<div class="card"><div class="skel" style="height:120px"></div></div>'; loadPhotos(box); }
    else { box.innerHTML = '<div class="card"><div class="skel" style="height:160px"></div></div>'; loadAnalysis(box); }

    bind(root);
  }

  /* ================= pestaña CUERPO ================= */
  function bodyTab() {
    const ms = st.S.measurements;
    const p = st.S.profile;

    if (!ms.length) {
      return '<div class="card">' +
          '<div style="font-weight:700;font-size:16px">Todavía no hay mediciones</div>' +
          '<div class="tiny muted mt8">Registra tu composición corporal una vez al mes. ' +
          'Puedes subir la foto de la báscula del gimnasio y yo intento leer los números; ' +
          'siempre te los muestro antes de guardar.</div>' +
          '<div class="btn-row mt16">' +
            '<button class="btn btn-primary" data-analyze>📷 Analizar medición</button>' +
            '<button class="btn" data-newm>✍️ Capturar</button>' +
          '</div>' +
        '</div>' +
        '<div class="note warn mt16">Los datos de bioimpedancia son indicadores de tendencia, ' +
        'no mediciones clínicas. Sirven para comparar contigo mismo, no para diagnosticar nada.</div>';
    }

    const latest = ms[0];
    const first = ms[ms.length - 1];
    const series = ms.slice().reverse().filter(function (m) { return m[metric] !== null && m[metric] !== undefined; });
    const mk = METRICS.filter(function (x) { return x.k === metric; })[0];

    return heroCard(p, latest, first) +
      '<div class="sec"><div class="sec-head"><h2>Tendencia</h2></div>' +
        '<div class="chips" style="margin-bottom:10px">' +
          METRICS.map(function (x) {
            return '<button class="chip' + (x.k === metric ? ' on' : '') + '" data-metric="' + x.k + '">' + x.n + '</button>';
          }).join('') +
        '</div>' +
        '<div class="card">' +
          (series.length >= 2
            ? ui.lineChart(series.map(function (m) { return { y: m[metric] }; }), { color: mk.color, h:130 }) +
              '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--txt-3);margin-top:4px">' +
                '<span>' + u.shortDate(series[0].date) + '</span>' +
                '<span>' + u.shortDate(series[series.length - 1].date) + '</span>' +
              '</div>' +
              trendLine(series, mk)
            : '<div class="empty-sm">Necesito al menos dos mediciones con ' + mk.n.toLowerCase() + ' para dibujar la tendencia.</div>') +
        '</div></div>' +

      monthCompare(ms) +

      '<div class="sec"><div class="sec-head"><h2>Historial</h2>' +
        '<button class="link" data-newm>+ Nueva</button></div>' +
        '<div class="card card-pad-0">' +
          ms.map(function (m) {
            return '<button class="row" data-med="' + m.id + '">' +
              '<span class="row-ico">⚖️</span>' +
              '<span class="row-main"><span class="row-t">' + u.shortDate(m.date) +
                (m.source && m.source !== 'manual' ? ' <span class="tag">' + u.esc(m.source) + '</span>' : '') + '</span>' +
              '<span class="row-s">' +
                [m.weight !== null && m.weight !== undefined ? u.fmt(m.weight, 1) + ' kg' : null,
                 m.bodyFat !== null && m.bodyFat !== undefined ? u.fmt(m.bodyFat, 1) + '% grasa' : null,
                 m.muscleMass !== null && m.muscleMass !== undefined ? u.fmt(m.muscleMass, 1) + ' kg músculo' : null]
                .filter(Boolean).join(' · ') + '</span></span>' +
              '<span class="row-chev">›</span></button>';
          }).join('') +
        '</div></div>' +

      '<div class="btn-row mt16">' +
        '<button class="btn btn-primary" data-analyze>📷 Analizar medición</button>' +
        '<button class="btn" data-newm>✍️ Capturar a mano</button>' +
      '</div>' +
      '<div class="note warn mt16">Una sola medición no dice mucho: pésate en las mismas condiciones ' +
      '(misma hora, misma hidratación) y fíjate en la tendencia de varias, no en el último número.</div>';
  }

  function heroCard(p, latest, first) {
    const start = (first && first.weight) || p.weight;
    const now = (latest && latest.weight) || p.weight;
    const goal = p.weightGoal;
    const total = Math.abs(start - goal) || 1;
    const donePct = u.clamp(Math.abs(start - now) / total * 100, 0, 100);

    return '<div class="card">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-end">' +
        '<div><div class="tiny muted">Inicio</div><div style="font-size:19px;font-weight:700">' + u.fmt(start, 1) + ' kg</div></div>' +
        '<div class="center"><div class="tiny muted">Ahora</div><div style="font-size:26px;font-weight:750;letter-spacing:-.03em">' + u.fmt(now, 1) + ' kg</div></div>' +
        '<div style="text-align:right"><div class="tiny muted">Objetivo</div><div style="font-size:19px;font-weight:700">' + u.fmt(goal, 1) + ' kg</div></div>' +
      '</div>' +
      '<div class="track mt12" style="height:10px"><div class="fill" style="width:' + donePct.toFixed(0) + '%;background:var(--brand)"></div></div>' +
      '<div class="tiny muted center mt8">' + u.fmt(Math.abs(start - now), 1) + ' kg de ' + u.fmt(total, 1) + ' kg · ' +
        u.fmt(donePct) + '% del camino' + '</div>' +
      (latest && (latest.bodyFat || latest.muscleMass)
        ? '<div class="kpi mt16">' +
            '<div><div class="k">% grasa</div><div class="v">' + (latest.bodyFat != null ? u.fmt(latest.bodyFat, 1) : '—') + '</div></div>' +
            '<div><div class="k">Masa grasa</div><div class="v">' + (latest.fatMass != null ? u.fmt(latest.fatMass, 1) : '—') + '<small> kg</small></div></div>' +
            '<div><div class="k">Músculo</div><div class="v">' + (latest.muscleMass != null ? u.fmt(latest.muscleMass, 1) : '—') + '<small> kg</small></div></div>' +
          '</div>'
        : '') +
      '<div class="tiny muted center mt8">El peso solo no cuenta la historia completa: mira también la composición.</div>' +
    '</div>';
  }

  function trendLine(series, mk) {
    const a = series[0][mk.k], b = series[series.length - 1][mk.k];
    const diff = b - a;
    const good = mk.down ? diff < 0 : diff > 0;
    const flat = Math.abs(diff) < 0.15;
    return '<div class="dl mt12" style="border:0"><dt>Cambio total</dt>' +
      '<dd style="color:' + (flat ? 'var(--txt-2)' : good ? 'var(--ok)' : 'var(--bad)') + '">' +
      (diff > 0 ? '+' : '') + u.fmt(diff, 1) + ' ' + mk.unit +
      ' ' + (flat ? '→' : diff > 0 ? '↑' : '↓') + '</dd></div>';
  }

  function monthCompare(ms) {
    const byMonth = {};
    ms.forEach(function (m) {
      const k = m.date.slice(0, 7);
      if (!byMonth[k]) byMonth[k] = [];
      byMonth[k].push(m);
    });
    const keys = Object.keys(byMonth).sort().reverse();
    if (keys.length < 2) {
      return '<div class="sec"><div class="card"><div class="tiny muted">' +
        'Con dos meses de mediciones te muestro aquí la comparación mes anterior vs mes actual.' +
        '</div></div></div>';
    }
    function avg(list, k) {
      const v = list.filter(function (m) { return m[k] !== null && m[k] !== undefined; });
      return v.length ? v.reduce(function (s, m) { return s + m[k]; }, 0) / v.length : null;
    }
    const cur = byMonth[keys[0]], prev = byMonth[keys[1]];
    const rows = METRICS.map(function (mk) {
      const a = avg(prev, mk.k), b = avg(cur, mk.k);
      if (a === null || b === null) return null;
      const diff = b - a;
      const good = mk.down ? diff < 0 : diff > 0;
      const flat = Math.abs(diff) < 0.15;
      return '<div class="dl"><dt>' + mk.n + '</dt><dd>' +
        u.fmt(a, 1) + ' → <b>' + u.fmt(b, 1) + '</b> ' +
        '<span style="color:' + (flat ? 'var(--txt-3)' : good ? 'var(--ok)' : 'var(--bad)') + '">(' +
        (diff > 0 ? '+' : '') + u.fmt(diff, 1) + ' ' + mk.unit + ')</span></dd></div>';
    }).filter(Boolean).join('');

    return '<div class="sec"><div class="sec-head"><h2>Mes anterior vs mes actual</h2></div>' +
      '<div class="card">' +
        '<div class="tiny muted" style="margin-bottom:8px">' + monthName(keys[1]) + ' → ' + monthName(keys[0]) + '</div>' +
        (rows || '<div class="tiny muted">No hay métricas comparables entre esos meses.</div>') +
        '<div class="tiny muted mt12">Promedios de cada mes, no el último dato: así una medición rara no distorsiona la lectura.</div>' +
      '</div></div>';
  }

  function monthName(k) {
    const p = k.split('-');
    return u.MESES[u.num(p[1]) - 1] + ' ' + p[0];
  }

  /* ================= pestaña FOTOS ================= */
  const KINDS = [{ k:'frente', n:'Frente', e:'🧍' }, { k:'lateral', n:'Lateral', e:'🧍‍♂️' }, { k:'espalda', n:'Espalda', e:'🔙' }];

  function loadPhotos(box) {
    st.allPhotos().then(function (rows) {
      photos = rows.filter(function (r) { return r.kind !== 'medicion'; });
      box.innerHTML = photosTab();
    });
  }

  function photosTab() {
    const byDate = {};
    photos.forEach(function (p) { (byDate[p.date] = byDate[p.date] || []).push(p); });
    const dates = Object.keys(byDate).sort().reverse();

    return '<div class="note">Tus fotos se guardan solo en este dispositivo, dentro de la app. ' +
        'No se suben a ningún servidor ni salen de aquí.</div>' +
      '<div class="btn-row mt16">' +
        KINDS.map(function (k) {
          return '<button class="btn btn-sm" data-addphoto="' + k.k + '">' + k.e + ' ' + k.n + '</button>';
        }).join('') +
      '</div>' +
      '<input type="file" id="ph-file" accept="image/*" style="display:none">' +
      (dates.length >= 2
        ? '<div class="btn-row mt12"><button class="btn btn-block" data-compare>🔍 Comparar progreso</button></div>'
        : '') +
      (dates.length
        ? dates.map(function (dt) {
            return '<div class="sec"><div class="sec-head"><h2>' + u.shortDate(dt) + '</h2></div>' +
              '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">' +
                byDate[dt].map(function (p) {
                  return '<button class="card card-pad-0" data-photo="' + p.id + '" style="position:relative">' +
                    '<img src="' + URL.createObjectURL(p.blob) + '" alt="' + p.kind + '" ' +
                    'style="width:100%;aspect-ratio:3/4;object-fit:cover;display:block">' +
                    '<div class="tiny" style="padding:5px;text-align:center;color:var(--txt-2)">' + p.kind + '</div>' +
                  '</button>';
                }).join('') +
              '</div></div>';
          }).join('')
        : ui.empty('🖼️', 'Sin fotos todavía',
            'Sube una foto de frente, una lateral y una de espalda cada mes. La cámara ve lo que la báscula no.'));
  }

  function comparePhotos() {
    const byDate = {};
    photos.forEach(function (p) { (byDate[p.date] = byDate[p.date] || []).push(p); });
    const dates = Object.keys(byDate).sort();
    let a = dates[0], b = dates[dates.length - 1], kind = 'frente';

    const s = ui.sheet({ title: 'Comparar progreso', body: '<div id="cmp"></div>' });

    function draw() {
      const pa = (byDate[a] || []).filter(function (x) { return x.kind === kind; })[0];
      const pb = (byDate[b] || []).filter(function (x) { return x.kind === kind; })[0];
      d.q('#cmp', s.el).innerHTML =
        '<div class="chips" style="margin-bottom:12px">' +
          KINDS.map(function (k) {
            return '<button class="chip' + (k.k === kind ? ' on' : '') + '" data-ck="' + k.k + '">' + k.e + ' ' + k.n + '</button>';
          }).join('') +
        '</div>' +
        '<div class="grid-2">' +
          '<div class="field"><label>Antes</label><select class="input" id="cmp-a">' +
            dates.map(function (dt) { return '<option value="' + dt + '"' + (dt === a ? ' selected' : '') + '>' + u.shortDate(dt) + '</option>'; }).join('') +
          '</select></div>' +
          '<div class="field"><label>Después</label><select class="input" id="cmp-b">' +
            dates.map(function (dt) { return '<option value="' + dt + '"' + (dt === b ? ' selected' : '') + '>' + u.shortDate(dt) + '</option>'; }).join('') +
          '</select></div>' +
        '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
          [pa, pb].map(function (p) {
            return '<div class="card card-pad-0">' +
              (p ? '<img src="' + URL.createObjectURL(p.blob) + '" style="width:100%;aspect-ratio:3/4;object-fit:cover;display:block">'
                 : '<div class="empty-sm" style="aspect-ratio:3/4;display:grid;place-items:center">Sin foto</div>') +
            '</div>';
          }).join('') +
        '</div>' +
        weightDelta(a, b);
    }
    function weightDelta(da, db) {
      const ma = st.S.measurements.filter(function (m) { return m.date <= da; })[0];
      const mb = st.S.measurements.filter(function (m) { return m.date <= db; })[0];
      if (!ma || !mb || ma.weight == null || mb.weight == null) return '';
      return '<div class="note mt16">Peso: ' + u.fmt(ma.weight, 1) + ' kg → <b>' + u.fmt(mb.weight, 1) + ' kg</b> (' +
        (mb.weight - ma.weight > 0 ? '+' : '') + u.fmt(mb.weight - ma.weight, 1) + ' kg)</div>';
    }
    draw();
    d.on(s.el, 'click', '[data-ck]', function (e, el) { kind = el.dataset.ck; draw(); });
    d.on(s.el, 'change', '#cmp-a', function (e, el) { a = el.value; draw(); });
    d.on(s.el, 'change', '#cmp-b', function (e, el) { b = el.value; draw(); });
  }

  /* ================= pestaña ANÁLISIS ================= */
  function loadAnalysis(box) {
    const days = [];
    for (let i = 29; i >= 0; i--) days.push(u.addDays(u.todayKey(), -i));
    Promise.all(days.map(function (k) {
      return NT.db.byIndex('entries', 'byDate', k).then(function (rows) {
        const food = rows.filter(function (e) { return e.type !== 'water'; });
        const water = rows.filter(function (e) { return e.type === 'water'; })
                          .reduce(function (s, e) { return s + (e.ml || 0); }, 0);
        return { key:k, totals: M.sumEntries(food), water:water, count: food.length };
      });
    })).then(function (data) {
      weekCache = data;
      box.innerHTML = analysisHtml(data);
    });
  }

  function analysisHtml(data) {
    const g = st.S.goals;
    const week = data.slice(-7);
    const month = data;

    function block(list, title, sub) {
      const withData = list.filter(function (x) { return x.count > 0; });
      if (!withData.length) {
        return '<div class="sec"><div class="sec-head"><h2>' + title + '</h2></div>' +
          '<div class="card">' + ui.empty('📊', 'Sin datos', 'Registra tus comidas y aquí aparecen tus promedios.') + '</div></div>';
      }
      const n = withData.length;
      const avg = ['kcal','protein','carbs','fat'].reduce(function (o, k) {
        o[k] = withData.reduce(function (s, x) { return s + x.totals[k]; }, 0) / n; return o;
      }, {});
      const fiber = withData.reduce(function (s, x) { return s + x.totals.micros.fiber.v; }, 0) / n;
      const water = withData.reduce(function (s, x) { return s + x.water; }, 0) / n;
      const inRange = withData.filter(function (x) { return Math.abs(x.totals.kcal - g.kcal) <= g.kcal * 0.1; }).length;
      const over = withData.filter(function (x) { return x.totals.kcal > g.kcal * 1.1; }).length;
      const under = withData.filter(function (x) { return x.totals.kcal < g.kcal * 0.9; }).length;
      const adher = Math.round(withData.length / list.length * 100);

      return '<div class="sec"><div class="sec-head"><h2>' + title + '</h2></div>' +
        '<div class="card">' +
          '<div class="tiny muted" style="margin-bottom:12px">' + sub + '</div>' +
          ui.lineChart(list.map(function (x) { return { y: x.totals.kcal }; }),
            { color:'var(--kcal)', min:0, max: Math.max(g.kcal * 1.3, Math.max.apply(null, list.map(function (x) { return x.totals.kcal; }))), h:110 }) +
          '<div class="kpi mt16">' +
            '<div><div class="k">kcal prom.</div><div class="v">' + u.fmt(avg.kcal) + '</div></div>' +
            '<div><div class="k">Proteína prom.</div><div class="v">' + u.fmt(avg.protein) + '<small> g</small></div></div>' +
            '<div><div class="k">Adherencia</div><div class="v">' + adher + '<small>%</small></div></div>' +
          '</div>' +
          '<div class="mt16">' +
            '<div class="dl"><dt>Días con registro</dt><dd>' + withData.length + ' de ' + list.length + '</dd></div>' +
            '<div class="dl"><dt>Días dentro del objetivo (±10%)</dt><dd>' + inRange + '</dd></div>' +
            '<div class="dl"><dt>Días por encima</dt><dd>' + over + '</dd></div>' +
            '<div class="dl"><dt>Días por debajo</dt><dd>' + under + '</dd></div>' +
            '<div class="dl"><dt>Carbohidratos promedio</dt><dd>' + u.fmt(avg.carbs) + ' g</dd></div>' +
            '<div class="dl"><dt>Grasas promedio</dt><dd>' + u.fmt(avg.fat) + ' g</dd></div>' +
            '<div class="dl"><dt>Fibra promedio</dt><dd>' + u.fmt(fiber) + ' g</dd></div>' +
            '<div class="dl"><dt>Agua promedio</dt><dd>' + u.fmt(water / 1000, 1) + ' L</dd></div>' +
          '</div>' +
        '</div></div>';
    }

    return block(week, 'Resumen semanal', 'Últimos 7 días') +
      block(month, 'Resumen mensual', 'Últimos 30 días') +
      monthlyBody() +
      insight(week);
  }

  function monthlyBody() {
    const ms = st.S.measurements;
    if (ms.length < 2) return '';
    const latest = ms[0], oldest = ms[ms.length - 1];
    function row(k, name, unit, down) {
      if (oldest[k] == null || latest[k] == null) return '';
      const diff = latest[k] - oldest[k];
      const good = down ? diff < 0 : diff > 0;
      return '<div class="dl"><dt>' + name + '</dt><dd>' + u.fmt(oldest[k], 1) + ' → <b>' + u.fmt(latest[k], 1) + '</b> ' +
        '<span style="color:' + (Math.abs(diff) < 0.15 ? 'var(--txt-3)' : good ? 'var(--ok)' : 'var(--bad)') + '">(' +
        (diff > 0 ? '+' : '') + u.fmt(diff, 1) + ' ' + unit + ')</span></dd></div>';
    }
    return '<div class="sec"><div class="sec-head"><h2>Cambio corporal total</h2></div><div class="card">' +
      '<div class="tiny muted" style="margin-bottom:8px">' + u.shortDate(oldest.date) + ' → ' + u.shortDate(latest.date) + '</div>' +
      row('weight','Peso','kg',true) + row('bodyFat','Grasa corporal','%',true) +
      row('fatMass','Masa grasa','kg',true) + row('muscleMass','Masa muscular','kg',false) +
      '</div></div>';
  }

  function insight(week) {
    const g = st.S.goals;
    const withData = week.filter(function (x) { return x.count > 0; });
    if (withData.length < 3) return '';
    const avgP = withData.reduce(function (s, x) { return s + x.totals.protein; }, 0) / withData.length;
    const avgK = withData.reduce(function (s, x) { return s + x.totals.kcal; }, 0) / withData.length;
    const notes = [];
    if (avgP < g.protein * 0.85) notes.push('Tu proteína promedio va ' + u.fmt(g.protein - avgP) + ' g por debajo del objetivo. En déficit, la proteína es lo que más ayuda a conservar músculo.');
    if (avgK > g.kcal * 1.08) notes.push('Vas en promedio ' + u.fmt(avgK - g.kcal) + ' kcal por encima de tu objetivo. Revisa las porciones o ajusta el objetivo si te parece muy estricto.');
    if (avgK < g.kcal * 0.82) notes.push('Vas bastante por debajo de tu objetivo de calorías. Comer demasiado poco de forma sostenida suele costar masa muscular y adherencia.');
    if (withData.length < 5) notes.push('Registraste ' + withData.length + ' de 7 días. Entre más constante el registro, más útiles son estos números.');
    if (!notes.length) notes.push('Vas consistente con tus objetivos esta semana. Sigue así y deja que la tendencia haga el trabajo.');
    return '<div class="sec"><div class="sec-head"><h2>Lectura de la semana</h2></div><div class="card">' +
      notes.map(function (t) { return '<div class="note mt8">' + t + '</div>'; }).join('') +
      '<div class="tiny muted mt12">Observaciones sobre tus propios registros. No son consejo médico.</div>' +
      '</div></div>';
  }

  /* ================= eventos ================= */
  let pendingKind = 'frente';
  function bind(root) {
    d.on(root, 'click', '[data-pt]', function (e, el) { tab = el.dataset.pt; NT.app.rerender(); });
    d.on(root, 'click', '[data-metric]', function (e, el) { metric = el.dataset.metric; NT.app.rerender(); });
    d.on(root, 'click', '[data-analyze]', function () { ME.openAnalyze(function () { NT.app.rerender(); }); });
    d.on(root, 'click', '[data-newm]', function () { ME.openEditor(null, function () { NT.app.rerender(); }); });
    d.on(root, 'click', '[data-med]', function (e, el) {
      const m = st.S.measurements.filter(function (x) { return x.id === el.dataset.med; })[0];
      if (m) ME.openEditor(m, function () { NT.app.rerender(); });
    });
    d.on(root, 'click', '[data-addphoto]', function (e, el) {
      pendingKind = el.dataset.addphoto;
      d.q('#ph-file', root).click();
    });
    d.on(root, 'change', '#ph-file', function (e, el) {
      const file = el.files[0]; if (!file) return;
      st.savePhoto({ date: u.todayKey(), kind: pendingKind, blob: file, createdAt: Date.now() })
        .then(function () { d.toast('Foto guardada'); NT.app.rerender(); });
    });
    d.on(root, 'click', '[data-compare]', function () { comparePhotos(); });
    d.on(root, 'click', '[data-photo]', function (e, el) {
      const p = photos.filter(function (x) { return x.id === el.dataset.photo; })[0];
      if (!p) return;
      const s = ui.sheet({
        title: p.kind + ' · ' + u.shortDate(p.date),
        body: '<img src="' + URL.createObjectURL(p.blob) + '" style="width:100%;border-radius:14px;display:block">',
        foot: '<button class="btn btn-danger btn-block" data-delph>Eliminar foto</button>'
      });
      d.on(s.el, 'click', '[data-delph]', function () {
        ui.confirm('¿Eliminar esta foto?', { danger:true, ok:'Eliminar' }).then(function (ok) {
          if (ok) st.deletePhoto(p.id).then(function () { d.toast('Foto eliminada'); s.close(); NT.app.rerender(); });
        });
      });
    });
  }

  return { render };
})();


/* ===== 67-view-shop.js ===== */
/* ============================================================
   NUTRI TRACK — pantalla "Compras": plan semanal, lista,
   presupuesto y preparación de comida (Fases 4 y 5)
   ============================================================ */
NT.viewShop = (function () {
  const u = NT.u, d = NT.dom, ui = NT.ui, st = NT.state, M = NT.model, PL = NT.planner;

  let tab = 'semana';
  let weekStart = null;
  let openDay = null;

  function mondayOf(key) {
    const dt = u.keyToDate(key);
    const off = (dt.getDay() + 6) % 7;
    return u.addDays(key, -off);
  }

  function render(root) {
    if (!weekStart) weekStart = mondayOf(u.todayKey());

    root.innerHTML =
      '<div class="topbar"><div><div class="eyebrow">Planeación</div><h1>Compras y semana</h1>' +
        '<div class="tiny muted">Semana del ' + u.shortDate(weekStart) + ' al ' + u.shortDate(u.addDays(weekStart, 6)) + '</div></div>' +
        '<div style="display:flex;gap:6px">' +
          '<button class="x" data-wk="-7">‹</button><button class="x" data-wk="7">›</button>' +
        '</div>' +
      '</div>' +
      '<div class="tabs">' +
        '<button data-st="semana" class="' + (tab === 'semana' ? 'on' : '') + '">Semana</button>' +
        '<button data-st="lista" class="' + (tab === 'lista' ? 'on' : '') + '">Lista</button>' +
        '<button data-st="presupuesto" class="' + (tab === 'presupuesto' ? 'on' : '') + '">Costo</button>' +
        '<button data-st="prep" class="' + (tab === 'prep' ? 'on' : '') + '">Prep</button>' +
      '</div>' +
      '<div id="sh-body"><div class="card"><div class="skel" style="height:140px"></div></div></div>';

    bind(root);
    load(root);
  }

  function load(root) {
    Promise.all([st.loadWeek(weekStart), st.loadShopping(weekStart)]).then(function () {
      // se busca en el documento vivo: el contenedor pudo reemplazarse
      const box = document.getElementById('sh-body');
      if (!box) return;
      const w = st.S.week;
      if (tab === 'semana') box.innerHTML = weekTab(w);
      else if (tab === 'lista') box.innerHTML = listTab(w, st.S.shopping);
      else if (tab === 'presupuesto') box.innerHTML = budgetTab(w, st.S.shopping);
      else box.innerHTML = prepTab(w);
    });
  }

  function noWeek(msg) {
    return '<div class="card">' +
      '<div style="font-weight:700;font-size:16px">Sin plan para esta semana</div>' +
      '<div class="tiny muted mt8">' + msg + '</div>' +
      '<button class="btn btn-primary btn-block mt16" data-genweek>✨ Generar plan semanal</button>' +
      '</div>';
  }

  /* ================= SEMANA ================= */
  function weekTab(w) {
    if (!w) return noWeek('Armo los 7 días completos con tus objetivos, tus horarios y tus alimentos. ' +
      'De ahí sale la lista de compras y el costo estimado.');

    const g = st.S.goals;
    return '<div class="card">' +
        '<div class="sec-head" style="margin-bottom:10px"><h2>Plan de la semana</h2></div>' +
        '<div class="kpi">' +
          '<div><div class="k">kcal / día</div><div class="v">' + u.fmt(avg(w, 'kcal')) + '</div></div>' +
          '<div><div class="k">Proteína</div><div class="v">' + u.fmt(avg(w, 'protein')) + '<small> g</small></div></div>' +
          '<div><div class="k">Carbos</div><div class="v">' + u.fmt(avg(w, 'carbs')) + '<small> g</small></div></div>' +
        '</div>' +
        '<div class="tiny muted center mt8">promedio de los 7 días · objetivo ' + u.fmt(g.kcal) + ' kcal</div>' +
        '<div class="btn-row mt16">' +
          '<button class="btn btn-sm" data-genweek>🔀 Regenerar</button>' +
          '<button class="btn btn-sm" data-genlist>🛒 Actualizar lista</button>' +
        '</div>' +
      '</div>' +

      w.days.map(function (day, i) {
        const isOpen = openDay === day.date;
        const isToday = day.date === u.todayKey();
        return '<div class="sec"><div class="card card-pad-0">' +
          '<button class="row" data-openday="' + day.date + '" style="background:' + (isToday ? 'var(--brand-soft)' : 'none') + '">' +
            '<span class="row-ico">' + (isOpen ? '▾' : '▸') + '</span>' +
            '<span class="row-main"><span class="row-t">' +
              capFirst(u.DIAS[u.keyToDate(day.date).getDay()]) + ' ' + u.shortDate(day.date) +
              (isToday ? ' · hoy' : '') + '</span>' +
            '<span class="row-s">' + u.fmt(day.total.kcal) + ' kcal · P ' + u.fmt(day.total.protein) +
              ' · C ' + u.fmt(day.total.carbs) + ' · G ' + u.fmt(day.total.fat) + '</span></span>' +
          '</button>' +
          (isOpen
            ? day.meals.map(function (m) {
                return '<div class="meal">' +
                  '<div class="meal-time">' + u.pretty12(m.time).replace(' ', '<br>') + '</div>' +
                  '<div class="meal-body"><div class="meal-title">' + (m.emoji || '🍽️') + ' ' + u.esc(m.mealName) + '</div>' +
                  '<div class="meal-items">' + m.items.map(function (it) {
                    return '<div class="meal-item"><span>' + (it.emoji || '•') + ' ' + u.esc(it.name) + '</span>' +
                      '<span class="q">' + u.fmt(it.grams) + ' g</span></div>';
                  }).join('') + '</div>' +
                  '<div class="meal-macros">' + ui.macroPills(m.sum) + '</div></div></div>';
              }).join('') +
              '<div class="row" style="background:var(--surface-2)">' +
                '<span class="row-main"><span class="row-t tiny">Usar este plan</span>' +
                '<span class="row-s">Lo copia al día ' + u.shortDate(day.date) + '</span></span>' +
                '<button class="btn btn-sm" data-useday="' + day.date + '">Aplicar</button></div>'
            : '') +
        '</div></div>';
      }).join('') +

      '<div class="note mt16">Puedes aplicar el plan de un día concreto y luego editarlo alimento por alimento ' +
      'desde <b>Comidas → Plan</b>.</div>';
  }

  function capFirst(t) { return t.charAt(0).toUpperCase() + t.slice(1); }

  function avg(w, k) {
    return w.days.reduce(function (s, d2) { return s + d2.total[k]; }, 0) / w.days.length;
  }

  /* ================= LISTA ================= */
  function listTab(w, shop) {
    if (!w) return noWeek('La lista de compras se calcula a partir del plan semanal.');
    if (!shop) {
      return '<div class="card"><div style="font-weight:700">Lista sin generar</div>' +
        '<div class="tiny muted mt8">Sumo todas las cantidades del plan de los 7 días y las convierto a ' +
        'unidades de compra.</div>' +
        '<button class="btn btn-primary btn-block mt16" data-genlist>🛒 Generar lista de compras</button></div>';
    }
    const done = shop.rows.filter(function (r) { return r.bought; }).length;
    const byCat = {};
    shop.rows.forEach(function (r) { (byCat[r.cat] = byCat[r.cat] || []).push(r); });

    return '<div class="card">' +
        '<div style="display:flex;justify-content:space-between;align-items:center">' +
          '<div><div style="font-weight:700;font-size:16px">' + done + ' de ' + shop.rows.length + ' comprados</div>' +
          '<div class="tiny muted">Semana del ' + u.shortDate(shop.weekStart) + '</div></div>' +
          '<button class="btn btn-sm" data-genlist>↻</button>' +
        '</div>' +
        '<div class="track mt12"><div class="fill" style="width:' +
          (shop.rows.length ? (done / shop.rows.length * 100).toFixed(0) : 0) + '%;background:var(--brand)"></div></div>' +
      '</div>' +

      Object.keys(byCat).sort(function (a, b) {
        return (a === 'condimento' ? 1 : 0) - (b === 'condimento' ? 1 : 0);
      }).map(function (cat) {
        const c = cat === 'condimento'
          ? { n:'Condimentos y básicos', e:'🧂' }
          : (M.CATS[cat] || { n:'Otros', e:'🍽️' });
        return '<div class="sec"><div class="sec-head"><h2>' + c.e + ' ' + c.n + '</h2></div>' +
          '<div class="card card-pad-0">' +
            byCat[cat].map(function (r) {
              return '<button class="row" data-buy="' + r.foodId + '" style="opacity:' + (r.bought ? '.5' : '1') + '">' +
                '<span class="row-ico">' + (r.bought ? '✓' : (r.emoji || '🍽️')) + '</span>' +
                '<span class="row-main"><span class="row-t" style="text-decoration:' + (r.bought ? 'line-through' : 'none') + '">' +
                  u.esc(r.name) + ' ' + ui.stateTag(r.state) + '</span>' +
                '<span class="row-s">' + u.esc(r.display) + '</span></span>' +
                '<span class="row-end">' + (r.cost !== null ? '<b>$' + u.fmt(r.cost, 1) + '</b>' : '<span class="tiny muted">sin precio</span>') + '</span>' +
              '</button>';
            }).join('') +
          '</div></div>';
      }).join('') +

      '<div class="btn-row mt16"><button class="btn btn-sm" data-clearbought>Desmarcar todo</button>' +
      '<button class="btn btn-sm" data-share>📋 Copiar lista</button></div>';
  }

  /* ================= PRESUPUESTO ================= */
  function budgetTab(w, shop) {
    if (!w || !shop) return noWeek('Genera el plan semanal y la lista para estimar el costo.');
    const noPrice = shop.rows.filter(function (r) { return r.cost === null; });
    const budget = st.S.prefs.weeklyBudget;

    return '<div class="card">' +
        '<div class="sec-head" style="margin-bottom:10px"><h2>Costo estimado</h2></div>' +
        '<div class="kpi">' +
          '<div><div class="k">Semana</div><div class="v">$' + u.fmt(shop.cost) + '</div></div>' +
          '<div><div class="k">Mes (×4.3)</div><div class="v">$' + u.fmt(shop.cost * 4.3) + '</div></div>' +
          '<div><div class="k">Por día</div><div class="v">$' + u.fmt(shop.cost / 7) + '</div></div>' +
        '</div>' +
        '<div class="tiny muted center mt8">Calculado con ' + shop.priced + ' de ' + shop.total +
          ' alimentos con precio capturado.</div>' +
        (noPrice.length
          ? '<div class="note warn mt16">Faltan precios en ' + noPrice.length + ' alimentos, ' +
            'así que el costo real será mayor. Captúralos y el número se afina.</div>'
          : '') +
      '</div>' +

      '<div class="sec"><div class="sec-head"><h2>Presupuesto semanal</h2></div><div class="card">' +
        '<div class="field"><label>Cuánto quiero gastar por semana</label>' +
          '<div class="inline-unit"><input class="input" id="bg-week" type="number" inputmode="decimal" step="any" value="' +
          (budget || '') + '" placeholder="Ej.: 900"><span class="u">$</span></div></div>' +
        '<button class="btn btn-sm" data-savebudget>Guardar presupuesto</button>' +
        (budget
          ? (shop.cost <= budget
              ? '<div class="note mt16">Tu plan cabe en el presupuesto: te sobran ~$' + u.fmt(budget - shop.cost) + '.</div>'
              : '<div class="note warn mt16">El plan estimado va ~$' + u.fmt(shop.cost - budget) +
                ' por encima de tu presupuesto. Puedes cambiar alimentos caros por equivalentes ' +
                'desde <b>Comidas → Plan → Cambiar alimento</b>.</div>')
          : '') +
      '</div></div>' +

      (noPrice.length
        ? '<div class="sec"><div class="sec-head"><h2>Sin precio</h2></div><div class="card card-pad-0">' +
          noPrice.map(function (r) {
            return '<button class="row" data-price="' + r.foodId + '">' +
              '<span class="row-ico">' + (r.emoji || '🍽️') + '</span>' +
              '<span class="row-main"><span class="row-t">' + u.esc(r.name) + '</span>' +
              '<span class="row-s">' + u.esc(r.display) + ' · toca para capturar el precio</span></span>' +
              '<span class="row-chev">›</span></button>';
          }).join('') + '</div></div>'
        : '') +

      '<div class="sec"><div class="sec-head"><h2>Más caros del plan</h2></div><div class="card card-pad-0">' +
        shop.rows.filter(function (r) { return r.cost !== null; })
          .sort(function (a, b) { return b.cost - a.cost; }).slice(0, 8)
          .map(function (r) {
            return '<div class="row"><span class="row-ico">' + (r.emoji || '🍽️') + '</span>' +
              '<span class="row-main"><span class="row-t">' + u.esc(r.name) + '</span>' +
              '<span class="row-s">' + u.esc(r.display) + '</span></span>' +
              '<span class="row-end"><b>$' + u.fmt(r.cost, 1) + '</b>' +
              (shop.cost ? u.fmt(r.cost / shop.cost * 100) + '%' : '') + '</span></div>';
          }).join('') +
      '</div></div>';
  }

  /* ================= PREPARACIÓN DE COMIDA ================= */
  function prepTab(w) {
    if (!w) return noWeek('La preparación por lotes sale del plan semanal.');
    const batches = PL.mealPrepFrom(w, st.S.foodsById);
    if (!batches.length) {
      return '<div class="card">' + ui.empty('🍱', 'Nada que preparar por lotes',
        'Cuando el plan repita los mismos alimentos varios días, aquí te digo cuánto cocinar de una vez.') + '</div>';
    }
    return '<div class="note">Cantidades totales de la semana para cocinar de una sentada. ' +
        'El peso está en la misma referencia (crudo o cocido) que tienes guardada en cada alimento.</div>' +
      '<div class="card card-pad-0 mt16">' +
        batches.map(function (b) {
          const days = Object.keys(b.days).length;
          return '<div class="row"><span class="row-ico">' + (b.food.emoji || '🍽️') + '</span>' +
            '<span class="row-main"><span class="row-t">' + u.esc(b.food.name) + ' ' + ui.stateTag(b.food.state) + '</span>' +
            '<span class="row-s">aparece en ' + days + (days === 1 ? ' día' : ' días') + ' de la semana</span></span>' +
            '<span class="row-end"><b>' + (b.grams >= 1000 ? u.fmt(b.grams / 1000, 1) + ' kg' : u.fmt(b.grams) + ' g') + '</b>total</span></div>';
        }).join('') +
      '</div>' +
      '<div class="sec"><div class="sec-head"><h2>Sugerencia de tandas</h2></div><div class="card">' +
        '<div class="tiny muted">Cocinar dos o tres veces por semana suele funcionar mejor que cocinar los siete días:</div>' +
        '<div class="mt12">' +
          '<div class="dl"><dt>Tanda 1 (domingo)</dt><dd>' + Math.ceil(batches.length / 2) + ' alimentos · días 1-4</dd></div>' +
          '<div class="dl"><dt>Tanda 2 (miércoles)</dt><dd>el resto · días 5-7</dd></div>' +
        '</div>' +
        '<div class="tiny muted mt12">Guarda las proteínas cocidas en refrigeración y consúmelas en pocos días; ' +
        'si vas a tardar más, congélalas en porciones.</div>' +
      '</div></div>';
  }

  /* ================= eventos ================= */
  function bind(root) {
    d.on(root, 'click', '[data-st]', function (e, el) { tab = el.dataset.st; NT.app.rerender(); });
    d.on(root, 'click', '[data-wk]', function (e, el) {
      weekStart = u.addDays(weekStart, u.num(el.dataset.wk));
      openDay = null;
      NT.app.rerender();
    });
    d.on(root, 'click', '[data-genweek]', function () {
      d.toast('Armando la semana…');
      st.generateWeek(weekStart).then(function (w) {
        return st.generateShopping(w);
      }).then(function () { d.toast('✨ Plan semanal listo'); NT.app.rerender(); });
    });
    d.on(root, 'click', '[data-genlist]', function () {
      if (!st.S.week) { d.toast('Primero genera el plan semanal'); return; }
      st.generateShopping(st.S.week).then(function () { d.toast('Lista actualizada'); NT.app.rerender(); });
    });
    d.on(root, 'click', '[data-openday]', function (e, el) {
      openDay = openDay === el.dataset.openday ? null : el.dataset.openday;
      NT.app.rerender();
    });
    d.on(root, 'click', '[data-useday]', function (e, el) {
      const day = st.S.week.days.filter(function (x) { return x.date === el.dataset.useday; })[0];
      if (!day) return;
      const copy = JSON.parse(JSON.stringify(day));
      copy.id = 'day_' + st.S.dateKey;
      copy.date = st.S.dateKey;
      st.savePlan(copy).then(function () { d.toast('Plan aplicado a ' + u.shortDate(st.S.dateKey)); });
    });
    d.on(root, 'click', '[data-buy]', function (e, el) {
      const shop = st.S.shopping;
      const r = shop.rows.filter(function (x) { return x.foodId === el.dataset.buy; })[0];
      if (!r) return;
      r.bought = !r.bought;
      st.saveShopping(shop).then(function () { NT.app.rerender(); });
    });
    d.on(root, 'click', '[data-clearbought]', function () {
      const shop = st.S.shopping;
      shop.rows.forEach(function (r) { r.bought = false; });
      st.saveShopping(shop).then(function () { NT.app.rerender(); });
    });
    d.on(root, 'click', '[data-share]', function () {
      const shop = st.S.shopping;
      const txt = 'LISTA DE COMPRAS — semana del ' + u.shortDate(shop.weekStart) + '\n\n' +
        shop.rows.map(function (r) { return (r.bought ? '[x] ' : '[ ] ') + r.name + ' — ' + r.display; }).join('\n') +
        (shop.cost ? '\n\nCosto estimado: $' + u.fmt(shop.cost) : '');
      if (navigator.clipboard) {
        navigator.clipboard.writeText(txt).then(function () { d.toast('Lista copiada'); },
                                                function () { d.toast('No pude copiar'); });
      } else d.toast('Este navegador no permite copiar');
    });
    d.on(root, 'click', '[data-savebudget]', function () {
      const v = u.num(d.q('#bg-week', root).value, 0);
      st.savePrefs({ weeklyBudget: v > 0 ? v : null }).then(function () {
        d.toast('Presupuesto guardado'); NT.app.rerender();
      });
    });
    d.on(root, 'click', '[data-price]', function (e, el) {
      const f = st.S.foodsById[el.dataset.price];
      if (f) NT.foodEdit.open(f);
    });
  }

  return { render };
})();


/* ===== 68-view-falta.js ===== */
/* ============================================================
   NUTRI TRACK — pantalla "Me falta por cubrir"
   Qué te queda pendiente del día y con qué conviene cerrarlo.
   ============================================================ */
NT.viewFalta = (function () {
  const u = NT.u, d = NT.dom, ui = NT.ui, st = NT.state, M = NT.model;

  function render(root) {
    const S = st.S, day = S.day, g = S.goals, t = day.totals, r = day.rest;

    root.innerHTML =
      resumen(day, g, r) +
      avisos(day, g, r) +
      alimentos(r) +
      platillos(r) +
      micros(day, g) +
      '<div class="tiny muted center mt24" style="padding:0 16px">' +
        'Las cantidades son sugerencias calculadas con tus objetivos y tu biblioteca. ' +
        'Ajusta lo que no te acomode.</div>';
    bind(root);
  }

  /* ---------------- lo que falta ---------------- */
  function resumen(day, g, r) {
    const filas = [
      { n:'Calorías',      v:r.kcal,    u:'kcal', c:'var(--kcal)',  goal:g.kcal,    got:day.totals.kcal },
      { n:'Proteína',      v:r.protein, u:'g',    c:'var(--prot)',  goal:g.protein, got:day.totals.protein },
      { n:'Carbohidratos', v:r.carbs,   u:'g',    c:'var(--carb)',  goal:g.carbs,   got:day.totals.carbs },
      { n:'Grasas',        v:r.fat,     u:'g',    c:'var(--fat)',   goal:g.fat,     got:day.totals.fat },
      { n:'Fibra',         v:r.fiber,   u:'g',    c:'var(--fiber)', goal:g.fiber,   got:day.totals.micros.fiber.v },
      { n:'Agua',          v:r.water/1000, u:'L', c:'var(--water)', goal:g.water/1000, got:day.water/1000, dec:true }
    ];
    const cerrado = r.kcal <= 40 && r.protein <= 6;

    return '<div class="card">' +
      '<div class="sec-head" style="margin-bottom:4px"><h2>' +
        (cerrado ? '🎉 Ya cerraste tu día' : 'Te falta por cubrir') + '</h2></div>' +
      '<div class="tiny muted" style="margin-bottom:14px">' +
        (cerrado
          ? 'Alcanzaste tus objetivos de hoy. Lo de abajo es solo referencia.'
          : 'Esto es lo que queda entre lo que ya comiste y tu objetivo del día.') +
      '</div>' +
      '<div style="display:grid;gap:12px">' +
        filas.map(function (f) {
          const falta = f.v > 0;
          const pct = f.goal > 0 ? u.clamp(f.got / f.goal * 100, 0, 100) : 0;
          return '<div>' +
            '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">' +
              '<span style="font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px">' +
                '<span class="dot" style="background:' + f.c + '"></span>' + f.n + '</span>' +
              '<span style="font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:' +
                (falta ? f.c : 'var(--txt-3)') + '">' +
                (falta ? 'faltan ' + u.fmt(f.v, f.dec ? 1 : 0) + ' ' + f.u
                       : '✓ cubierto' + (f.v < -0.5 ? ' (+' + u.fmt(-f.v, f.dec ? 1 : 0) + ')' : '')) +
              '</span>' +
            '</div>' +
            '<div class="track"><div class="fill" style="width:' + pct.toFixed(0) + '%;background:' + f.c + '"></div></div>' +
          '</div>';
        }).join('') +
      '</div>' +
      '<div class="btn-row mt16">' +
        '<button class="btn btn-sm" data-water>💧 Agua</button>' +
        '<button class="btn btn-sm" data-log>＋ Registrar</button>' +
      '</div>' +
    '</div>';
  }

  /* ---------------- avisos según cómo va el día ---------------- */
  function avisos(day, g, r) {
    const notas = [];
    if (r.fat < 0 && r.protein > 10) {
      notas.push(['warn', 'Ya alcanzaste tu objetivo de grasa y todavía te falta proteína. ' +
        'Las opciones de abajo priorizan alimentos magros: claras, pescado blanco, pechuga, lácteos sin grasa.']);
    }
    if (r.kcal < 0) {
      notas.push(['warn', 'Vas ' + u.fmt(-r.kcal) + ' kcal por encima de tu objetivo. ' +
        'No pasa nada por un día: retoma mañana con normalidad, sin recortar de más ni saltarte comidas.']);
    }
    if (r.protein > g.protein * 0.55 && u.nowMinutes() > 17 * 60) {
      notas.push(['warn', 'Te falta más de la mitad de tu proteína y ya es tarde. ' +
        'Reparte lo que queda entre la cena y una colación para no meterte todo de golpe.']);
    }
    if (r.kcal > g.kcal * 0.6) {
      notas.push(['', 'Todavía te falta la mayor parte del día. Los alimentos sueltos de abajo ' +
        'sirven para completar huecos; para una comida entera, mira los platillos.']);
    }
    if (r.fiber > g.fiber * 0.7) {
      notas.push(['', 'Vas bajo en fibra. Verduras, frijol, lenteja, avena y fruta con cáscara son lo que más aporta.']);
    }
    if (r.water > 800) {
      notas.push(['', 'Te faltan ' + u.fmt(r.water / 1000, 1) + ' L de agua. Es lo más fácil de cerrar del día.']);
    }
    if (!notas.length) return '';
    return '<div class="sec">' + notas.map(function (n) {
      return '<div class="note ' + n[0] + ' mt12">' + n[1] + '</div>';
    }).join('') + '</div>';
  }

  /* ---------------- mejores alimentos ---------------- */
  function alimentos(r) {
    const rows = M.bestFoodsFor(r, st.S.foods, { limit: 8 });
    if (!rows.length) {
      return '<div class="sec"><div class="sec-head"><h2>Qué te conviene comer</h2></div>' +
        '<div class="card">' + ui.empty('✅', 'Nada pendiente',
          'Ya cubriste lo importante del día.') + '</div></div>';
    }
    window.__NT_BEST = rows;
    return '<div class="sec"><div class="sec-head"><h2>Los que mejor te cuadran</h2></div>' +
      '<div class="tiny muted" style="margin:-4px 2px 10px">Ordenados por qué tan bien encajan con lo que te falta, ' +
      'no por qué tan “sanos” son. Tus favoritos suben de lugar.</div>' +
      '<div class="card card-pad-0">' +
        rows.map(function (x, i) {
          return '<div class="row">' +
            '<span class="row-ico">' + (x.food.emoji || '🍽️') + '</span>' +
            '<span class="row-main"><span class="row-t">' + u.esc(x.food.name) +
              (x.food.favorite ? ' ⭐' : '') + ' ' + ui.stateTag(x.food.state) + '</span>' +
            '<span class="row-s">' + u.fmt(x.grams) + ' g · ' + u.fmt(x.n.kcal) + ' kcal · P ' +
              u.fmt(x.n.protein) + ' · C ' + u.fmt(x.n.carbs) + ' · G ' + u.fmt(x.n.fat) + '</span></span>' +
            '<button class="btn btn-sm" data-addbest="' + i + '">+</button></div>';
        }).join('') +
      '</div></div>';
  }

  /* ---------------- platillos completos ---------------- */
  function platillos(r) {
    const need = { kcal: Math.max(0, r.kcal), protein: Math.max(0, r.protein),
                   carbs: Math.max(0, r.carbs), fat: Math.max(0, r.fat) };
    if (need.kcal < 220) return '';

    const byId = st.S.foodsById;
    const arche = u.nowMinutes() < 11 * 60 ? 'desayuno' : (u.nowMinutes() < 17 * 60 ? 'comida' : 'cena');
    let cands = NT.recipes.forMeal(arche).concat(NT.recipes.forMeal('colacion'));
    cands = cands.filter(function (rec) {
      return NT.recipes.isAvailable(rec, byId, st.S.prefs) && NT.recipes.fitsTarget(rec, need, byId);
    });
    const scaled = cands.map(function (rec) {
      const s = NT.recipes.scale(rec, need, byId);
      const err = Math.abs(s.sum.kcal - need.kcal) / Math.max(1, need.kcal) +
                  Math.abs(s.sum.protein - need.protein) / Math.max(1, need.protein) * 1.4 +
                  (s.sum.fat > need.fat ? (s.sum.fat - need.fat) / Math.max(1, need.fat) : 0);
      return { rec: rec, s: s, err: err };
    }).sort(function (a, b) { return a.err - b.err; }).slice(0, 3);

    if (!scaled.length) return '';
    window.__NT_DISHES = scaled;

    return '<div class="sec"><div class="sec-head"><h2>Platillos que te cierran el día</h2></div>' +
      '<div class="tiny muted" style="margin:-4px 2px 10px">Recetas del recetario, ya ajustadas ' +
      'a las cantidades que te faltan.</div>' +
      scaled.map(function (x, i) {
        return '<div class="card mt12">' +
          '<div style="display:flex;align-items:center;gap:10px">' +
            '<span style="font-size:24px">' + x.rec.emoji + '</span>' +
            '<div style="flex:1;min-width:0">' +
              '<div style="font-weight:700;font-size:15px">' + u.esc(x.rec.name) + '</div>' +
              '<div class="tiny muted">' + x.rec.minutes + ' min · ' + u.fmt(x.s.sum.kcal) + ' kcal · P ' +
                u.fmt(x.s.sum.protein) + ' g</div>' +
            '</div>' +
          '</div>' +
          '<div class="tiny muted mt12" style="line-height:1.6">' +
            x.s.items.map(function (it) { return u.fmt(it.grams) + ' g ' + u.esc(it.name.toLowerCase()); }).join(' · ') +
          '</div>' +
          '<div class="btn-row mt12">' +
            '<button class="btn btn-sm" data-dish="' + i + '">Ver receta</button>' +
            '<button class="btn btn-sm btn-primary" data-logdish="' + i + '">Registrar</button>' +
          '</div>' +
        '</div>';
      }).join('') +
    '</div>';
  }

  /* ---------------- micronutrientes bajos ---------------- */
  function micros(day, g) {
    const bajos = M.MICROS.filter(function (m) {
      if (m.limit || m.k === 'fiber') return false;
      const cell = day.totals.micros[m.k];
      return m.rda && cell.v < m.rda * 0.6;
    });
    if (!bajos.length) {
      return '<div class="sec"><div class="sec-head"><h2>Micronutrientes</h2></div>' +
        '<div class="card"><div class="tiny muted">Vas bien en los micronutrientes que la app puede seguir hoy.</div></div></div>';
    }
    return '<div class="sec"><div class="sec-head"><h2>Micronutrientes bajos</h2></div>' +
      '<div class="tiny muted" style="margin:-4px 2px 10px">Van por debajo del 60% de la referencia diaria. ' +
      'Estos alimentos de tu biblioteca son los que más aportan de cada uno.</div>' +
      bajos.slice(0, 5).map(function (m) {
        const cell = day.totals.micros[m.k];
        const tops = M.bestForMicro(m.k, st.S.foods, 3);
        return '<div class="card mt12">' +
          '<div style="display:flex;justify-content:space-between;align-items:baseline">' +
            '<span style="font-weight:650">' + m.n + '</span>' +
            '<span class="tiny muted">' + u.fmt(cell.v, cell.v < 10 ? 1 : 0) + ' / ' + u.fmt(m.rda) + ' ' + m.unit + '</span>' +
          '</div>' +
          '<div class="track mt8"><div class="fill" style="width:' +
            u.clamp(cell.v / m.rda * 100, 0, 100).toFixed(0) + '%;background:var(--warn)"></div></div>' +
          '<div class="mt12">' + tops.map(function (t) {
            return '<div class="dl" style="padding:6px 0"><dt>' + (t.food.emoji || '') + ' ' + u.esc(t.food.name) +
              ' <span class="tiny">(' + u.esc(t.label) + ')</span></dt>' +
              '<dd>' + u.fmt(t.amount, t.amount < 10 ? 1 : 0) + ' ' + m.unit + '</dd></div>';
          }).join('') + '</div>' +
        '</div>';
      }).join('') +
      '<div class="tiny muted mt12">Referencias generales para adulto. No son una indicación clínica ' +
      'ni sustituyen a un profesional.</div>' +
    '</div>';
  }

  /* ---------------- eventos ---------------- */
  function bind(root) {
    d.on(root, 'click', '[data-water]', function () { NT.log.openWater(); });
    d.on(root, 'click', '[data-log]', function () { NT.log.openLog({}); });
    d.on(root, 'click', '[data-addbest]', function (e, el) {
      const x = (window.__NT_BEST || [])[u.num(el.dataset.addbest)];
      if (!x) return;
      NT.log.quantitySheet(x.food, { mealId: NT.log.suggestMealId(), preGrams: x.grams });
      setTimeout(function () {
        const sel = document.querySelector('.scrim.show #q-portion');
        const inp = document.querySelector('.scrim.show #q-qty');
        if (sel) { sel.value = 'g'; sel.dispatchEvent(new Event('change', { bubbles:true })); }
        if (inp) { inp.value = x.grams; inp.dispatchEvent(new Event('input', { bubbles:true })); }
      }, 80);
    });
    d.on(root, 'click', '[data-dish]', function (e, el) {
      const x = (window.__NT_DISHES || [])[u.num(el.dataset.dish)];
      if (x) dishSheet(x);
    });
    d.on(root, 'click', '[data-logdish]', function (e, el) {
      const x = (window.__NT_DISHES || [])[u.num(el.dataset.logdish)];
      if (x) logDish(x);
    });
  }

  function logDish(x) {
    const mealId = NT.log.suggestMealId();
    Promise.all(x.s.items.map(function (it) {
      const f = st.S.foodsById[it.foodId];
      return f ? st.logFood(f, it.grams, 'g', { mealId: mealId, source: 'sugerencia' }) : null;
    }).filter(Boolean)).then(function () {
      d.toast('✓ ' + x.rec.name + ' registrado');
    });
  }

  function dishSheet(x) {
    const s = ui.sheet({
      title: x.rec.name,
      body:
        '<div class="card" style="display:flex;gap:12px;align-items:center">' +
          '<span style="font-size:30px">' + x.rec.emoji + '</span>' +
          '<div><div style="font-weight:700">' + u.esc(x.rec.name) + '</div>' +
          '<div class="tiny muted">' + x.rec.minutes + ' min · ' + u.fmt(x.s.sum.kcal) + ' kcal · P ' +
            u.fmt(x.s.sum.protein) + ' · C ' + u.fmt(x.s.sum.carbs) + ' · G ' + u.fmt(x.s.sum.fat) + '</div></div>' +
        '</div>' +
        '<div class="sec"><div class="sec-head"><h2>Ingredientes</h2></div><div class="card card-pad-0">' +
          x.s.items.map(function (it) {
            return '<div class="row"><span class="row-ico">' + (it.emoji || '🍽️') + '</span>' +
              '<span class="row-main"><span class="row-t">' + u.esc(it.name) + ' ' + ui.stateTag(it.state) + '</span>' +
              '<span class="row-s">' + u.fmt(it.n.kcal) + ' kcal · P ' + u.fmt(it.n.protein, 1) + '</span></span>' +
              '<span class="row-end"><b>' + u.fmt(it.grams) + ' g</b></span></div>';
          }).join('') +
        '</div></div>' +
        '<div class="sec"><div class="sec-head"><h2>Preparación</h2></div><div class="card">' +
          x.rec.steps.map(function (t, i) {
            return '<div style="display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)">' +
              '<span style="flex:0 0 22px;height:22px;border-radius:50%;background:var(--brand-soft);' +
              'color:var(--brand-dark);font-size:12px;font-weight:700;display:grid;place-items:center">' +
              (i + 1) + '</span><span style="font-size:13.5px;line-height:1.5">' + u.esc(t) + '</span></div>';
          }).join('') +
        '</div></div>',
      foot: '<button class="btn btn-primary btn-block" data-logit>Registrar este platillo</button>'
    });
    d.on(s.el, 'click', '[data-logit]', function () { logDish(x); s.close(); });
  }

  return { render };
})();


/* ===== 69-prefs.js ===== */
/* ============================================================
   NUTRI TRACK — preferencias, entrenamiento y suplementos (Fase 5)
   ============================================================ */
NT.prefsUI = (function () {
  const u = NT.u, d = NT.dom, ui = NT.ui, st = NT.state, M = NT.model;

  /* ================= preferencias alimentarias ================= */
  function openPreferences() {
    let mode = 'avoid';   // avoid | dislikes
    let term = '';

    const s = ui.sheet({
      title: 'Mis preferencias',
      body:
        '<div class="note">Lo que marques aquí cambia lo que te propongo: los alimentos excluidos ' +
        'nunca aparecen en el plan ni en las sugerencias, y tus favoritos aparecen primero.</div>' +

        '<div class="sec"><div class="sec-head"><h2>Favoritos</h2></div>' +
          '<div class="tiny muted" style="margin-bottom:8px">Los que sí compras y sí comes. Tienen prioridad al armar el plan.</div>' +
          '<div id="pf-favs"></div></div>' +

        '<div class="sec"><div class="sec-head"><h2>Excluidos</h2></div>' +
          '<div class="tabs">' +
            '<button data-pm="avoid" class="on">No los consumo</button>' +
            '<button data-pm="dislikes">No me gustan</button>' +
          '</div>' +
          '<div id="pf-excl"></div>' +
          '<div class="searchbar mt12"><span class="si">🔍</span>' +
            '<input class="input" id="pf-q" type="search" placeholder="Buscar alimento para excluir…"></div>' +
          '<div class="card card-pad-0 mt12" id="pf-list"></div>' +
        '</div>' +

        '<div class="sec"><div class="sec-head"><h2>Número de comidas</h2></div><div class="card">' +
          '<div class="tiny muted">Tienes <b>' + st.S.meals.filter(function (m) { return m.enabled !== false; }).length +
          ' comidas</b> activas al día. Se editan desde Comidas → Horarios.</div></div></div>' +

        '<div class="sec"><div class="sec-head"><h2>Presupuesto semanal</h2></div><div class="card">' +
          '<div class="field mb0"><div class="inline-unit">' +
            '<input class="input" id="pf-budget" type="number" inputmode="decimal" step="any" value="' +
            (st.S.prefs.weeklyBudget || '') + '" placeholder="Ej.: 900"><span class="u">$ / semana</span></div></div>' +
        '</div></div>',
      foot: '<button class="btn btn-primary btn-block" data-savepf>Guardar preferencias</button>'
    });

    function favs() {
      const list = st.S.foods.filter(function (f) { return f.favorite; });
      d.q('#pf-favs', s.el).innerHTML = list.length
        ? '<div class="chips" style="flex-wrap:wrap">' + list.map(function (f) {
            return '<button class="chip on" data-unfav="' + f.id + '">' + (f.emoji || '') + ' ' + u.esc(f.name) + ' ✕</button>';
          }).join('') + '</div>'
        : '<div class="tiny muted">Sin favoritos. Marca la estrella en tus alimentos habituales.</div>';
    }
    function excl() {
      const ids = st.S.prefs[mode] || [];
      d.q('#pf-excl', s.el).innerHTML = ids.length
        ? '<div class="chips" style="flex-wrap:wrap">' + ids.map(function (id) {
            const f = st.S.foodsById[id];
            return '<button class="chip" data-unexcl="' + id + '">' + (f ? u.esc(f.name) : id) + ' ✕</button>';
          }).join('') + '</div>'
        : '<div class="tiny muted">Nada excluido en esta lista.</div>';
    }
    function list() {
      if (!term) { d.q('#pf-list', s.el).innerHTML = ''; return; }
      const rows = st.searchFoods(term).slice(0, 20);
      d.q('#pf-list', s.el).innerHTML = rows.map(function (f) {
        return '<button class="row" data-excl="' + f.id + '">' +
          '<span class="row-ico">' + (f.emoji || '🍽️') + '</span>' +
          '<span class="row-main"><span class="row-t">' + u.esc(f.name) + '</span>' +
          '<span class="row-s">tocar para excluir</span></span></button>';
      }).join('');
    }
    favs(); excl();

    d.on(s.el, 'click', '[data-pm]', function (e, el) {
      mode = el.dataset.pm;
      d.qa('[data-pm]', s.el).forEach(function (b) { b.classList.toggle('on', b.dataset.pm === mode); });
      excl();
    });
    d.on(s.el, 'input', '#pf-q', u.debounce(function (e, el) { term = el.value; list(); }, 180));
    d.on(s.el, 'click', '[data-excl]', function (e, el) {
      const cur = (st.S.prefs[mode] || []).slice();
      if (cur.indexOf(el.dataset.excl) < 0) cur.push(el.dataset.excl);
      const patch = {}; patch[mode] = cur;
      st.savePrefs(patch).then(function () { excl(); d.q('#pf-q', s.el).value = ''; term = ''; list(); });
    });
    d.on(s.el, 'click', '[data-unexcl]', function (e, el) {
      const cur = (st.S.prefs[mode] || []).filter(function (x) { return x !== el.dataset.unexcl; });
      const patch = {}; patch[mode] = cur;
      st.savePrefs(patch).then(excl);
    });
    d.on(s.el, 'click', '[data-unfav]', function (e, el) {
      st.toggleFavorite(el.dataset.unfav).then(favs);
    });
    d.on(s.el, 'click', '[data-savepf]', function () {
      const b = u.num(d.q('#pf-budget', s.el).value, 0);
      st.savePrefs({ weeklyBudget: b > 0 ? b : null }).then(function () {
        d.toast('Preferencias guardadas'); s.close(); NT.app.rerender();
      });
    });
    return s;
  }

  /* ================= entrenamiento ================= */
  function openTraining() {
    const p = st.S.profile;
    const s = ui.sheet({
      title: 'Entrenamiento',
      body:
        '<div class="note">Registro lo suficiente para estimar tu gasto y ordenar tu día. ' +
        'No pretende ser una app de gimnasio.</div>' +
        '<div class="grid-2 mt16">' +
          '<div class="field"><label>Días por semana</label><div class="inline-unit">' +
            '<input class="input" id="tr-days" type="number" inputmode="numeric" min="0" max="7" value="' + p.trainDays + '"><span class="u">/sem</span></div></div>' +
          '<div class="field"><label>Duración</label><div class="inline-unit">' +
            '<input class="input" id="tr-min" type="number" inputmode="numeric" value="' + p.trainMin + '"><span class="u">min</span></div></div>' +
        '</div>' +
        '<div class="grid-2">' +
          '<div class="field"><label>Hora</label><input class="input" id="tr-time" type="time" value="' + p.trainTime + '"></div>' +
          '<div class="field"><label>Tipo</label><select class="input" id="tr-type">' +
