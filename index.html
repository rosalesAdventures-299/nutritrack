            [['fuerza','Fuerza / pesas'],['cardio','Cardio'],['mixto','Mixto'],['ligero','Ligero']].map(function (o) {
              return '<option value="' + o[0] + '"' + (p.trainType === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
            }).join('') + '</select></div>' +
        '</div>' +

        '<div class="sec"><div class="sec-head"><h2>Mi rutina</h2>' +
          '<button class="link" data-addw>+ Agregar</button></div>' +
          '<div class="card card-pad-0" id="tr-list"></div></div>' +

        '<div class="note mt16">Cambiar días o duración recalcula tu gasto diario estimado ' +
        'y, si tus objetivos están en automático, también tus calorías.</div>',
      foot: '<button class="btn btn-primary btn-block" data-savetr>Guardar</button>'
    });

    function list() {
      const w = st.S.workouts;
      d.q('#tr-list', s.el).innerHTML = w.length
        ? w.map(function (x) {
            return '<button class="row" data-editw="' + x.id + '">' +
              '<span class="row-ico">🏋️</span>' +
              '<span class="row-main"><span class="row-t">' + u.esc(x.name) + '</span>' +
              '<span class="row-s">' + u.esc(x.days || '') + (x.notes ? ' · ' + u.esc(x.notes) : '') + '</span></span>' +
              '<span class="row-chev">›</span></button>';
          }).join('')
        : '<div class="empty-sm">Sin rutinas guardadas</div>';
    }
    list();

    function editWorkout(x) {
      const isNew = !x;
      const w = x || { name:'', days:'', notes:'', order: st.S.workouts.length };
      const s2 = ui.sheet({
        title: isNew ? 'Nueva rutina' : 'Editar rutina',
        body:
          '<div class="field"><label>Nombre</label><input class="input" id="w-name" value="' + u.esc(w.name) + '" placeholder="Ej.: Empuje"></div>' +
          '<div class="field"><label>Días</label><input class="input" id="w-days" value="' + u.esc(w.days) + '" placeholder="Ej.: lunes y jueves"></div>' +
          '<div class="field"><label>Ejercicios / notas</label><textarea class="input" id="w-notes" rows="4" placeholder="Press banca, press militar, fondos…">' + u.esc(w.notes) + '</textarea></div>',
        foot: '<div class="btn-row">' + (isNew ? '' : '<button class="btn btn-danger" data-delw>Eliminar</button>') +
              '<button class="btn btn-primary" data-savew>Guardar</button></div>'
      });
      d.on(s2.el, 'click', '[data-savew]', function () {
        w.name = d.q('#w-name', s2.el).value.trim() || 'Rutina';
        w.days = d.q('#w-days', s2.el).value.trim();
        w.notes = d.q('#w-notes', s2.el).value.trim();
        st.saveWorkout(w).then(function () { d.toast('Rutina guardada'); s2.close(); list(); });
      });
      d.on(s2.el, 'click', '[data-delw]', function () {
        st.deleteWorkout(w.id).then(function () { d.toast('Rutina eliminada'); s2.close(); list(); });
      });
    }

    d.on(s.el, 'click', '[data-addw]', function () { editWorkout(null); });
    d.on(s.el, 'click', '[data-editw]', function (e, el) {
      editWorkout(st.S.workouts.filter(function (x) { return x.id === el.dataset.editw; })[0]);
    });
    d.on(s.el, 'click', '[data-savetr]', function () {
      st.saveProfile({
        trainDays: u.num(d.q('#tr-days', s.el).value, 0),
        trainMin: u.num(d.q('#tr-min', s.el).value, 0),
        trainTime: d.q('#tr-time', s.el).value,
        trainType: d.q('#tr-type', s.el).value
      }).then(function () { d.toast('Entrenamiento actualizado'); s.close(); NT.app.rerender(); });
    });
    return s;
  }

  /* ================= suplementos ================= */
  function openSupplements() {
    const s = ui.sheet({
      title: 'Suplementos',
      body:
        '<div class="note">Solo registro lo que tomas y a qué hora, para tenerlo ordenado. ' +
        'No doy recomendaciones sobre suplementos: eso lo ves con un profesional.</div>' +
        '<div class="card card-pad-0 mt16" id="sp-list"></div>' +
        '<button class="btn btn-block mt16" data-adds>➕ Agregar suplemento</button>'
    });

    function list() {
      const x = st.S.supplements;
      d.q('#sp-list', s.el).innerHTML = x.length
        ? x.map(function (o) {
            return '<button class="row" data-edits="' + o.id + '">' +
              '<span class="row-ico">💊</span>' +
              '<span class="row-main"><span class="row-t">' + u.esc(o.name) + '</span>' +
              '<span class="row-s">' + u.esc(o.dose || '') + (o.time ? ' · ' + u.pretty12(o.time) : '') +
                (o.freq ? ' · ' + u.esc(o.freq) : '') + '</span></span>' +
              '<span class="row-chev">›</span></button>';
          }).join('')
        : '<div class="empty-sm">Sin suplementos registrados</div>';
    }
    list();

    function edit(o) {
      const isNew = !o;
      const x = o || { name:'', dose:'', time:'08:00', freq:'diario' };
      const s2 = ui.sheet({
        title: isNew ? 'Nuevo suplemento' : 'Editar suplemento',
        body:
          '<div class="field"><label>Nombre</label><input class="input" id="s-name" value="' + u.esc(x.name) + '" placeholder="Ej.: Creatina monohidratada"></div>' +
          '<div class="grid-2">' +
            '<div class="field"><label>Cantidad</label><input class="input" id="s-dose" value="' + u.esc(x.dose) + '" placeholder="5 g"></div>' +
            '<div class="field"><label>Horario</label><input class="input" id="s-time" type="time" value="' + (x.time || '08:00') + '"></div>' +
          '</div>' +
          '<div class="field"><label>Frecuencia</label><select class="input" id="s-freq">' +
            ['diario','días de entrenamiento','2 veces al día','ocasional'].map(function (f) {
              return '<option' + (x.freq === f ? ' selected' : '') + '>' + f + '</option>';
            }).join('') + '</select></div>',
        foot: '<div class="btn-row">' + (isNew ? '' : '<button class="btn btn-danger" data-dels>Eliminar</button>') +
              '<button class="btn btn-primary" data-saves>Guardar</button></div>'
      });
      d.on(s2.el, 'click', '[data-saves]', function () {
        x.name = d.q('#s-name', s2.el).value.trim() || 'Suplemento';
        x.dose = d.q('#s-dose', s2.el).value.trim();
        x.time = d.q('#s-time', s2.el).value;
        x.freq = d.q('#s-freq', s2.el).value;
        st.saveSupplement(x).then(function () { d.toast('Suplemento guardado'); s2.close(); list(); });
      });
      d.on(s2.el, 'click', '[data-dels]', function () {
        st.deleteSupplement(x.id).then(function () { d.toast('Eliminado'); s2.close(); list(); });
      });
    }
    d.on(s.el, 'click', '[data-adds]', function () { edit(null); });
    d.on(s.el, 'click', '[data-edits]', function (e, el) {
      edit(st.S.supplements.filter(function (x) { return x.id === el.dataset.edits; })[0]);
    });
    return s;
  }

  return { openPreferences, openTraining, openSupplements };
})();


/* ===== 70-onboarding.js ===== */
/* ============================================================
   NUTRI TRACK — asistente de configuración inicial
   ============================================================ */
NT.onboarding = (function () {
  const u = NT.u, d = NT.dom, ui = NT.ui, st = NT.state, M = NT.model;
  let step = 0;
  let p = null;
  let meals = null;
  const STEPS = 6;

  function start(root) {
    p = Object.assign({}, st.S.profile);
    meals = JSON.parse(JSON.stringify(st.S.meals));
    step = 0;
    render(root);
  }

  function render(root) {
    root.innerHTML =
      '<div class="onb">' +
        '<div class="onb-prog">' +
          Array.from({ length: STEPS }, function (_, i) { return '<span class="' + (i <= step ? 'on' : '') + '"></span>'; }).join('') +
        '</div>' +
        '<div class="onb-body">' + body() + '</div>' +
        '<div class="onb-foot">' +
          '<div class="btn-row">' +
            (step > 0 ? '<button class="btn" data-back>Atrás</button>' : '') +
            '<button class="btn btn-primary" data-next>' + (step === STEPS - 1 ? 'Empezar' : 'Continuar') + '</button>' +
          '</div>' +
          (step === 0 ? '<button class="btn btn-ghost btn-block mt12" data-skip>Configurar después</button>' : '') +
        '</div>' +
      '</div>';
    bind(root);
  }

  function body() {
    if (step === 0) return '' +
      '<div class="logo" style="margin-bottom:26px"><span class="mark">N</span> NUTRI TRACK</div>' +
      '<h1>Tu asistente diario de alimentación</h1>' +
      '<p class="lead">No es una calculadora de calorías. Cada día te va a decir <b>qué comer, a qué hora, cuánto</b> ' +
      'y qué te falta para cerrar bien el día.</p>' +
      '<div class="card">' +
        f('🎯','Objetivos calculados','A partir de tu perfil, editables cuando quieras.') +
        f('🍽️','Comidas organizadas','Con horarios, cantidades y macros de cada una.') +
        f('♻️','Ajuste sobre la marcha','Si te sales del plan, recalculo lo que queda del día.') +
        f('🔒','100% privado','Todo se guarda solo en este dispositivo.') +
      '</div>' +
      '<div class="note mt16">Es una herramienta de organización y seguimiento. No da diagnósticos ni sustituye a un médico o nutriólogo.</div>';

    if (step === 1) return '' +
      '<h1>Tus datos</h1><p class="lead">Con esto calculo una propuesta inicial de calorías y macros.</p>' +
      '<div class="field"><label>¿Cómo te llamas?</label><input class="input" id="o-name" value="' + u.esc(p.name) + '" placeholder="Tu nombre"></div>' +
      '<div class="grid-2">' +
        '<div class="field"><label>Edad</label><div class="inline-unit"><input class="input" id="o-age" type="number" inputmode="numeric" value="' + p.age + '"><span class="u">años</span></div></div>' +
        '<div class="field"><label>Sexo</label>' + ui.seg('sex', [{v:'h',n:'Hombre'},{v:'m',n:'Mujer'}], p.sex) + '</div>' +
      '</div>' +
      '<div class="grid-2">' +
        '<div class="field"><label>Estatura</label><div class="inline-unit"><input class="input" id="o-height" type="number" inputmode="decimal" step="any" value="' + p.height + '"><span class="u">cm</span></div></div>' +
        '<div class="field"><label>Peso actual</label><div class="inline-unit"><input class="input" id="o-weight" type="number" inputmode="decimal" step="any" value="' + p.weight + '"><span class="u">kg</span></div></div>' +
      '</div>' +
      '<div class="field"><label>Peso objetivo</label><div class="inline-unit"><input class="input" id="o-weightGoal" type="number" inputmode="decimal" step="any" value="' + p.weightGoal + '"><span class="u">kg</span></div></div>';

    if (step === 2) return '' +
      '<h1>Tu actividad</h1><p class="lead">Separo lo que gastas en el día a día de lo que gastas entrenando.</p>' +
      '<div class="field"><label>Actividad diaria (sin contar el gimnasio)</label><select class="input" id="o-activity">' +
        Object.keys(M.ACTIVITY).map(function (k) {
          return '<option value="' + k + '"' + (p.activity === k ? ' selected' : '') + '>' + M.ACTIVITY[k].n + ' — ' + M.ACTIVITY[k].d + '</option>';
        }).join('') + '</select></div>' +
      '<div class="grid-2">' +
        '<div class="field"><label>Días de entrenamiento</label><div class="inline-unit"><input class="input" id="o-trainDays" type="number" inputmode="numeric" min="0" max="7" value="' + p.trainDays + '"><span class="u">/sem</span></div></div>' +
        '<div class="field"><label>Duración</label><div class="inline-unit"><input class="input" id="o-trainMin" type="number" inputmode="numeric" value="' + p.trainMin + '"><span class="u">min</span></div></div>' +
      '</div>' +
      '<div class="grid-2">' +
        '<div class="field"><label>Hora de entrenar</label><input class="input" id="o-trainTime" type="time" value="' + p.trainTime + '"></div>' +
        '<div class="field"><label>Tipo</label><select class="input" id="o-trainType">' +
          [['fuerza','Fuerza / pesas'],['cardio','Cardio'],['mixto','Mixto'],['ligero','Ligero']].map(function (o) {
            return '<option value="' + o[0] + '"' + (p.trainType === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
          }).join('') + '</select></div>' +
      '</div>' +
      '<div class="grid-2">' +
        '<div class="field"><label>Despertar</label><input class="input" id="o-wakeTime" type="time" value="' + p.wakeTime + '"></div>' +
        '<div class="field"><label>Dormir</label><input class="input" id="o-sleepTime" type="time" value="' + p.sleepTime + '"></div>' +
      '</div>';

    if (step === 3) return '' +
      '<h1>Tu objetivo</h1><p class="lead">Esto define cuánta proteína y cuánto déficit voy a proponerte.</p>' +
      '<div class="field">' +
        Object.keys(M.GOALS).map(function (k) {
          return '<button type="button" class="card mt12" style="display:block;width:100%;text-align:left;border-color:' +
            (p.goal === k ? 'var(--brand)' : 'var(--line)') + '" data-goal="' + k + '">' +
            '<div style="font-weight:650">' + M.GOALS[k].n + '</div>' +
            '<div class="tiny muted mt8">Proteína sugerida: ' + M.GOALS[k].prot + ' g por kg de peso</div></button>';
        }).join('') +
      '</div>' +
      '<div class="field mt16"><label>Ritmo</label>' +
        ui.seg('pace', Object.keys(M.PACE).map(function (k) { return { v:k, n:M.PACE[k].n }; }), p.pace) +
        '<div class="hint">Suave ≈ 0.3 kg/sem · Moderado ≈ 0.5 · Agresivo ≈ 0.7. Para conservar músculo suele convenir un ritmo moderado.</div></div>';

    if (step === 4) return '' +
      '<h1>Tus horarios</h1><p class="lead">¿A qué hora comes normalmente? Puedes cambiarlo después.</p>' +
      '<div class="card card-pad-0">' +
        meals.map(function (m, i) {
          return '<div class="row">' +
            '<span class="row-ico">' + m.emoji + '</span>' +
            '<span class="row-main"><span class="row-t">' + u.esc(m.name) + '</span>' +
            '<span class="row-s">' + Math.round(m.share * 100) + '% de tu día</span></span>' +
            '<input class="input" style="width:118px;padding:8px 10px" type="time" data-mtime="' + i + '" value="' + m.time + '"></div>';
        }).join('') +
      '</div>' +
      '<div class="note mt16">Cinco comidas ayudan a repartir la proteína a lo largo del día. Si prefieres menos, ' +
      'puedes desactivarlas luego desde <b>Comidas → Horarios</b>.</div>';

    /* paso 5: propuesta */
    collect();
    const g = M.computeTargets(p);
    return '' +
      '<h1>Tu propuesta inicial</h1><p class="lead">Calculada con la fórmula Mifflin-St Jeor. Es una <b>estimación</b>, no una indicación médica: podrás cambiarla cuando quieras.</p>' +
      '<div class="card">' +
        '<div class="dl"><dt>Metabolismo basal estimado</dt><dd>' + u.fmt(g.bmr) + ' kcal</dd></div>' +
        '<div class="dl"><dt>Gasto diario estimado</dt><dd>' + u.fmt(g.tdee) + ' kcal</dd></div>' +
        '<div class="dl"><dt><b>Objetivo diario</b></dt><dd><b>' + u.fmt(g.kcal) + ' kcal</b></dd></div>' +
      '</div>' +
      '<div class="kpi mt16">' +
        '<div><div class="k">Proteína</div><div class="v">' + u.fmt(g.protein) + '<small> g</small></div></div>' +
        '<div><div class="k">Carbos</div><div class="v">' + u.fmt(g.carbs) + '<small> g</small></div></div>' +
        '<div><div class="k">Grasas</div><div class="v">' + u.fmt(g.fat) + '<small> g</small></div></div>' +
      '</div>' +
      '<div class="kpi mt12">' +
        '<div><div class="k">Fibra</div><div class="v">' + u.fmt(g.fiber) + '<small> g</small></div></div>' +
        '<div><div class="k">Agua</div><div class="v">' + u.fmt(g.water / 1000, 1) + '<small> L</small></div></div>' +
        '<div><div class="k">Déficit</div><div class="v">' + u.fmt(g.deficit) + '<small> kcal</small></div></div>' +
      '</div>' +
      (g.floored ? '<div class="note warn mt16">El déficit calculado quedaba por debajo de tu metabolismo basal, así que subí las calorías a un piso más prudente.</div>' : '') +
      (g.weeks ? '<div class="note mt16">A este ritmo, bajar ' + u.fmt(g.kgToLose, 1) + ' kg tomaría del orden de <b>' +
        g.weeks + ' semanas</b>. Es una proyección lineal simplificada; en la práctica el ritmo varía.</div>' : '') +
      '<div class="note mt12">Voy a cargar tu biblioteca con <b>' + NT.SEED.length + ' alimentos</b> comunes en México. ' +
      'Puedes editarlos, borrarlos o agregar los tuyos con marca y etiqueta real.</div>';
  }

  function f(e, t, s) {
    return '<div class="row" style="padding-left:0;padding-right:0"><span class="row-ico">' + e + '</span>' +
      '<span class="row-main"><span class="row-t">' + t + '</span><span class="row-s" style="white-space:normal">' + s + '</span></span></div>';
  }

  function collect() {
    const get = function (id) { const el = d.q('#o-' + id); return el ? el.value : null; };
    ['name','age','height','weight','weightGoal','activity','trainDays','trainMin',
     'trainTime','trainType','wakeTime','sleepTime'].forEach(function (k) {
      const v = get(k);
      if (v === null) return;
      const el = d.q('#o-' + k);
      p[k] = el.type === 'number' ? u.num(v, 0) : v;
    });
    d.qa('[data-mtime]').forEach(function (el) {
      const i = u.num(el.dataset.mtime);
      if (meals[i]) meals[i].time = el.value;
    });
  }

  function bind(root) {
    ui.bindSeg(root, function (name, val) { p[name] = val; });
    d.on(root, 'click', '[data-goal]', function (e, el) {
      p.goal = el.dataset.goal;
      d.qa('[data-goal]', root).forEach(function (b) {
        b.style.borderColor = b.dataset.goal === p.goal ? 'var(--brand)' : 'var(--line)';
      });
    });
    d.on(root, 'click', '[data-next]', function () {
      collect();
      if (step === 1) {
        if (!p.weight || !p.height || !p.age) { d.toast('Completa edad, estatura y peso'); return; }
      }
      if (step < STEPS - 1) { step++; render(root); window.scrollTo(0, 0); return; }
      meals.sort(function (a, b) { return u.hhmmToMin(a.time) - u.hhmmToMin(b.time); });
      st.saveMeals(meals)
        .then(function () { return st.saveProfile(p); })
        .then(function () { return st.saveGoals(M.computeTargets(p)); })
        .then(function () { return st.setOnboarded(true); })
        .then(function () { NT.app.boot(); });
    });
    d.on(root, 'click', '[data-back]', function () { collect(); step--; render(root); window.scrollTo(0, 0); });
    d.on(root, 'click', '[data-skip]', function () {
      st.setOnboarded(true).then(function () { NT.app.boot(); });
    });
  }

  return { start };
})();


/* ===== 80-app.js ===== */
/* ============================================================
   NUTRI TRACK — arranque, navegación y recordatorios
   ============================================================ */
NT.app = (function () {
  const u = NT.u, d = NT.dom, st = NT.state;

  const TABS = [
    { id:'hoy',       n:'Hoy',      i:'🏠', view:function () { return NT.viewToday; } },
    { id:'comidas',   n:'Comidas',  i:'🍽️', view:function () { return NT.viewMeals; } },
    { id:'progreso',  n:'Progreso', i:'📊', view:function () { return NT.viewProgress; } },
    { id:'compras',   n:'Compras',  i:'🛒', view:function () { return NT.viewShop; } },
    { id:'perfil',    n:'Perfil',   i:'⚙️', view:function () { return NT.viewProfile; } }
  ];
  let tab = 'hoy';
  let root = null, mount = null;

  function boot() {
    root = document.getElementById('app');
    if (!st.S.onboarded) {
      root.innerHTML = '<div id="onb-root"></div>';
      NT.onboarding.start(document.getElementById('onb-root'));
      return;
    }
    root.innerHTML =
      '<div class="screen" id="view"></div>' +
      '<button class="fab" id="fab">＋ Registrar</button>' +
      '<nav class="nav"><div class="nav-inner">' +
        TABS.map(function (t) {
          return '<button data-nav="' + t.id + '" class="' + (t.id === tab ? 'on' : '') + '">' +
            '<span class="ni">' + t.i + '</span>' + t.n + '</button>';
        }).join('') +
      '</div></nav>';
    mount = document.getElementById('view');

    d.on(root, 'click', '[data-nav]', function (e, el) { go(el.dataset.nav); });
    document.getElementById('fab').addEventListener('click', function () { NT.log.openLog({}); });

    rerender();
    startReminders();
    autoPlan();
  }

  /* Si está activado, arma solo el plan del día cuando aún no existe. */
  function autoPlan() {
    if (!st.S.prefs.autoPlan) return;
    if (st.S.plan) return;
    if (st.S.dateKey !== u.todayKey()) return;
    st.generatePlan({ variant: 0 });
  }

  function go(id) {
    if (id === 'alimentos') { NT.viewMeals.setTab('alimentos'); id = 'comidas'; }
    if (id === 'plan') { NT.viewMeals.setTab('plan'); id = 'comidas'; }
    tab = id;
    d.qa('[data-nav]').forEach(function (b) { b.classList.toggle('on', b.dataset.nav === tab); });
    window.scrollTo(0, 0);
    rerender();
  }

  function currentView() {
    const t = TABS.filter(function (x) { return x.id === tab; })[0] || TABS[0];
    return t.view();
  }

  function rerender() {
    if (!mount) return;
    // Se reemplaza el contenedor en cada render: así mueren los listeners
    // delegados del render anterior y no se acumulan (evita disparos dobles).
    const fresh = document.createElement('div');
    fresh.className = 'screen';
    fresh.id = 'view';
    mount.replaceWith(fresh);
    mount = fresh;
    currentView().render(mount);
  }

  /* ---------------- recordatorios ---------------- */
  let timer = null;
  function firedKey() { return 'nt_fired_' + u.todayKey(); }
  function getFired() {
    try { return JSON.parse(localStorage.getItem(firedKey()) || '{}'); } catch (e) { return {}; }
  }
  function setFired(k) {
    const f = getFired(); f[k] = 1;
    try { localStorage.setItem(firedKey(), JSON.stringify(f)); } catch (e) {}
  }
  function notify(title, body) {
    if (!('Notification' in window) || Notification.permission !== 'granted') {
      d.toast(title);
      return;
    }
    try { new Notification(title, { body: body, icon: NT.ICON, badge: NT.ICON, tag: 'nutritrack' }); }
    catch (e) { d.toast(title); }
  }
  function checkReminders() {
    const P = st.S.prefs;
    if (!P.reminders) return;
    const now = u.nowMinutes(), fired = getFired(), day = st.S.day;
    if (!day) return;

    if (P.remindMeals) {
      day.byMeal.forEach(function (b) {
        const m = u.hhmmToMin(b.meal.time);
        if (now >= m && now < m + 10 && !fired['meal_' + b.meal.id] && !b.entries.length) {
          setFired('meal_' + b.meal.id);
          const plan = NT.model.planRemaining(day).filter(function (x) { return x.meal.id === b.meal.id; })[0];
          notify('⏰ Es hora de tu ' + b.meal.name.toLowerCase(),
            plan ? 'Te toca ~' + u.fmt(plan.target.kcal) + ' kcal y ' + u.fmt(plan.target.protein) + ' g de proteína.' : '');
        }
      });
    }
    if (P.remindWater) {
      [11 * 60, 16 * 60, 20 * 60].forEach(function (t, i) {
        if (now >= t && now < t + 10 && !fired['water_' + i] && day.water < st.S.goals.water) {
          setFired('water_' + i);
          notify('💧 Recuerda tomar agua',
            'Llevas ' + u.fmt(day.water / 1000, 1) + ' L de ' + u.fmt(st.S.goals.water / 1000, 1) + ' L.');
        }
      });
    }
    if (P.remindProtein) {
      const t = 20 * 60;
      if (now >= t && now < t + 10 && !fired.protein && day.rest.protein > 15) {
        setFired('protein');
        notify('📊 Te falta proteína',
          'Todavía te faltan ' + u.fmt(day.rest.protein) + ' g de proteína para tu objetivo de hoy.');
      }
    }
  }
  function startReminders() {
    if (timer) clearInterval(timer);
    checkReminders();
    timer = setInterval(checkReminders, 60000);
  }

  /* ---------------- inicio ---------------- */
  function init() {
    st.subscribe(function () {
      // durante el arranque llegan emisiones antes de que exista el día:
      // pintar en ese momento reventaría la pantalla "Hoy".
      if (!st.S.ready || !st.S.day) return;
      if (!st.S.onboarded) return;
      if (!mount) { boot(); return; }
      rerender();
    });
    st.init().then(function () {
      boot();
      registerSW();
    }).catch(function (e) {
      console.error(e);
      document.getElementById('app').innerHTML =
        '<div class="screen"><div class="note warn mt24">No pude iniciar el almacenamiento local: ' +
        u.esc(e.message) + '</div></div>';
    });

    // refresca el día al volver a la app
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && st.S.ready) {
        if (st.S.dateKey !== u.todayKey()) st.loadDate(u.todayKey());
        else st.refresh();
        checkReminders();
      }
    });
  }

  function registerSW() {
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol === 'file:') return;
    navigator.serviceWorker.register('sw.js').catch(function () { /* sin caché offline */ });
  }

  return { init, boot, go, rerender, notify };
})();

document.addEventListener('DOMContentLoaded', function () { NT.app.init(); });

</script>
</body>
