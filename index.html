   NUTRI TRACK — modelo, motor de cálculo y estado
   ============================================================ */
NT.model = (function () {
  const u = NT.u;

  const MICROS = [
    { k:'fiber',     n:'Fibra',      unit:'g',  rda:30 },
    { k:'sugar',     n:'Azúcares',   unit:'g',  rda:50,  limit:true },
    { k:'sodium',    n:'Sodio',      unit:'mg', rda:2300, limit:true },
    { k:'calcium',   n:'Calcio',     unit:'mg', rda:1000 },
    { k:'iron',      n:'Hierro',     unit:'mg', rda:8 },
    { k:'magnesium', n:'Magnesio',   unit:'mg', rda:400 },
    { k:'potassium', n:'Potasio',    unit:'mg', rda:3400 },
    { k:'zinc',      n:'Zinc',       unit:'mg', rda:11 },
    { k:'vitA',      n:'Vitamina A', unit:'µg', rda:900 },
    { k:'vitC',      n:'Vitamina C', unit:'mg', rda:90 },
    { k:'vitD',      n:'Vitamina D', unit:'µg', rda:20 },
    { k:'vitE',      n:'Vitamina E', unit:'mg', rda:15 },
    { k:'vitK',      n:'Vitamina K', unit:'µg', rda:120 },
    { k:'b12',       n:'Vitamina B12', unit:'µg', rda:2.4 },
    { k:'folate',    n:'Folato',     unit:'µg', rda:400 }
  ];

  const CATS = {
    proteina:  { n:'Proteínas',        e:'🥩' },
    carbo:     { n:'Carbohidratos',    e:'🍚' },
    fruta:     { n:'Frutas',           e:'🍎' },
    verdura:   { n:'Verduras',         e:'🥦' },
    lacteo:    { n:'Lácteos',          e:'🥛' },
    grasa:     { n:'Grasas y semillas',e:'🥑' },
    bebida:    { n:'Bebidas',          e:'☕' },
    suplemento:{ n:'Suplementos',      e:'💊' },
    otro:      { n:'Otros',            e:'🍽️' }
  };

  /* ---------------- valores por defecto ---------------- */
  function defaultProfile() {
    return {
      name: '', age: 30, sex: 'h', height: 172, weight: 69, weightGoal: 59,
      activity: 'ligero',              // sedentario|ligero|moderado|alto|muy_alto
      trainDays: 4, trainMin: 60, trainTime: '19:00', trainType: 'fuerza',
      workStart: '09:00', workEnd: '18:00',
      sleepHours: 7.5, wakeTime: '06:00', sleepTime: '23:00',
      goal: 'perdida_grasa',           // perdida_grasa|mantenimiento|ganancia|recomposicion
      pace: 'moderado',                // suave|moderado|agresivo
      createdAt: Date.now()
    };
  }

  function defaultMeals() {
    return [
      { id:'m1', name:'Desayuno', time:'06:30', emoji:'🍳', enabled:true, share:0.25 },
      { id:'m2', name:'Colación',  time:'10:30', emoji:'🍎', enabled:true, share:0.10 },
      { id:'m3', name:'Comida',    time:'14:00', emoji:'🍽️', enabled:true, share:0.35 },
      { id:'m4', name:'Colación',  time:'18:00', emoji:'🥤', enabled:true, share:0.10 },
      { id:'m5', name:'Cena',      time:'21:00', emoji:'🌙', enabled:true, share:0.20 }
    ];
  }

  function defaultPrefs() {
    return {
      reminders: true, remindWater: true, remindMeals: true, remindProtein: true,
      autoPlan: true,
      dislikes: [], avoid: [], weeklyBudget: null,
      weightUnit: 'kg', theme: 'auto', firstRun: true
    };
  }

  const ACTIVITY = {
    sedentario: { f:1.20, n:'Sedentario', d:'Trabajo de escritorio, poco movimiento' },
    ligero:     { f:1.35, n:'Ligero',     d:'De pie a ratos, caminatas cortas' },
    moderado:   { f:1.50, n:'Moderado',   d:'Bastante movimiento durante el día' },
    alto:       { f:1.65, n:'Alto',       d:'Trabajo físico la mayor parte del día' },
    muy_alto:   { f:1.80, n:'Muy alto',   d:'Trabajo físico intenso' }
  };
  const GOALS = {
    perdida_grasa: { n:'Pérdida de grasa manteniendo masa muscular', prot:2.0, fatG:0.8 },
    mantenimiento: { n:'Mantenimiento',        prot:1.8, fatG:0.9 },
    ganancia:      { n:'Ganancia muscular',    prot:1.8, fatG:0.9 },
    recomposicion: { n:'Recomposición corporal', prot:2.2, fatG:0.8 }
  };
  const PACE = {
    suave:     { fat:-0.12, gain: 0.06, n:'Suave',     d:'~0.3 kg/semana' },
    moderado:  { fat:-0.20, gain: 0.10, n:'Moderado',  d:'~0.5 kg/semana' },
    agresivo:  { fat:-0.25, gain: 0.14, n:'Agresivo',  d:'~0.7 kg/semana' }
  };

  const TRAIN_MET = { fuerza:6.0, cardio:7.5, mixto:6.8, ligero:4.0 };

  /* ---------------- estimación de objetivos ---------------- */
  function computeTargets(p) {
    p = Object.assign(defaultProfile(), p || {});
    const kg = u.num(p.weight, 70), cm = u.num(p.height, 170), age = u.num(p.age, 30);

    // Mifflin-St Jeor
    const bmr = Math.round(10 * kg + 6.25 * cm - 5 * age + (p.sex === 'm' ? -161 : 5));

    const af = (ACTIVITY[p.activity] || ACTIVITY.ligero).f;
    const base = bmr * af;

    // gasto por entrenamiento, promediado a la semana
    const met = TRAIN_MET[p.trainType] || 6.0;
    const perSession = met * 3.5 * kg / 200 * u.num(p.trainMin, 0);   // kcal por sesión
    const trainDaily = perSession * u.num(p.trainDays, 0) / 7;

    const tdee = Math.round(base + trainDaily);

    const g = GOALS[p.goal] || GOALS.perdida_grasa;
    const pc = PACE[p.pace] || PACE.moderado;
    let adj = 0;
    if (p.goal === 'perdida_grasa') adj = pc.fat;
    else if (p.goal === 'recomposicion') adj = pc.fat * 0.5;
    else if (p.goal === 'ganancia') adj = pc.gain;

    let kcal = Math.round(tdee * (1 + adj));
    const floor = Math.round(bmr * 1.05);
    let floored = false;
    if (kcal < floor) { kcal = floor; floored = true; }
    kcal = Math.round(kcal / 10) * 10;

    // proteína y grasa por kg de peso corporal; carbohidratos = resto
    let protein = Math.round(g.prot * kg);
    let fat = Math.round(g.fatG * kg);
    let carbKcal = kcal - protein * 4 - fat * 9;
    if (carbKcal < kcal * 0.15) {                 // no dejar los carbohidratos demasiado bajos
      const need = kcal * 0.15 - carbKcal;
      const cutFat = Math.min(fat - Math.round(0.6 * kg), Math.round(need / 9));
      if (cutFat > 0) { fat -= cutFat; carbKcal += cutFat * 9; }
    }
    const carbs = Math.max(0, Math.round(carbKcal / 4));
    const fiber = Math.round(Math.max(25, kcal / 1000 * 14));
    const water = Math.max(2000, Math.round(kg * 35 / 100) * 100);

    // estimación de tiempo hasta el objetivo (solo informativa)
    const deficit = tdee - kcal;
    const kgToLose = Math.max(0, kg - u.num(p.weightGoal, kg));
    const weeks = deficit > 50 ? Math.round(kgToLose * 7700 / (deficit * 7)) : null;

    return {
      kcal, protein, carbs, fat, fiber, water,
      bmr, tdee, deficit, floored, weeks, kgToLose,
      auto: true, method: 'Mifflin-St Jeor', updatedAt: Date.now()
    };
  }

  /* ---------------- nutrientes de un registro ---------------- */
  function portionOf(food, portionId) {
    const ps = food.portions || [];
    return ps.filter(function (x) { return x.id === portionId; })[0] || ps[0] ||
           { id:'g', label:'g', grams:1 };
  }

  function nutrientsFor(food, grams) {
    const k = grams / 100;
    const out = {
      kcal: (food.kcal || 0) * k,
      protein: (food.protein || 0) * k,
      carbs: (food.carbs || 0) * k,
      fat: (food.fat || 0) * k,
      micros: {}, incomplete: false
    };
    MICROS.forEach(function (m) {
      const v = food.micros ? food.micros[m.k] : null;
      if (v === null || v === undefined) { out.micros[m.k] = null; out.incomplete = true; }
      else out.micros[m.k] = v * k;
    });
    return out;
  }

  function makeEntry(food, qty, portionId, opts) {
    opts = opts || {};
    const por = portionOf(food, portionId);
    const grams = u.r1(u.num(qty, 1) * por.grams);
    const n = nutrientsFor(food, grams);
    return {
      id: u.uid('e'),
      date: opts.date || u.todayKey(),
      ts: opts.ts || Date.now(),
      time: opts.time || u.minToHhmm(u.nowMinutes()),
      mealId: opts.mealId || null,
      foodId: food.id, foodName: food.name, emoji: food.emoji || '🍽️',
      state: food.state || 'na',
      qty: u.num(qty, 1), portionId: por.id, portionLabel: por.label, grams: grams,
      kcal: n.kcal, protein: n.protein, carbs: n.carbs, fat: n.fat,
      micros: n.micros, incomplete: n.incomplete,
      source: opts.source || 'manual', note: opts.note || ''
    };
  }

  /* ---------------- totales del día ---------------- */
  function emptyTotals() {
    const t = { kcal:0, protein:0, carbs:0, fat:0, micros:{}, incompleteCount:0 };
    MICROS.forEach(function (m) { t.micros[m.k] = { v:0, missing:0 }; });
    return t;
  }

  function sumEntries(entries) {
    const t = emptyTotals();
    entries.forEach(function (e) {
      t.kcal += e.kcal || 0; t.protein += e.protein || 0;
      t.carbs += e.carbs || 0; t.fat += e.fat || 0;
      if (e.incomplete) t.incompleteCount++;
      MICROS.forEach(function (m) {
        const v = e.micros ? e.micros[m.k] : null;
        if (v === null || v === undefined) t.micros[m.k].missing++;
        else t.micros[m.k].v += v;
      });
    });
    return t;
  }

  function buildDay(dateKey, entries, meals, goals, waterMl) {
    const totals = sumEntries(entries.filter(function (e) { return e.type !== 'water'; }));
    const rest = {
      kcal: goals.kcal - totals.kcal,
      protein: goals.protein - totals.protein,
      carbs: goals.carbs - totals.carbs,
      fat: goals.fat - totals.fat,
      fiber: goals.fiber - (totals.micros.fiber ? totals.micros.fiber.v : 0),
      water: goals.water - (waterMl || 0)
    };
    const nowMin = u.nowMinutes();
    const isToday = dateKey === u.todayKey();

    const byMeal = meals.filter(function (m) { return m.enabled !== false; }).map(function (m) {
      const es = entries.filter(function (e) { return e.mealId === m.id && e.type !== 'water'; });
      const t = sumEntries(es);
      const mMin = u.hhmmToMin(m.time);
      let status = 'next';
      if (es.length) status = 'done';
      else if (!isToday) status = 'missed';
      else if (nowMin >= mMin - 30 && nowMin <= mMin + 90) status = 'now';
      else if (nowMin > mMin + 90) status = 'missed';
      return { meal:m, entries:es, totals:t, status:status, minutes:mMin };
    }).sort(function (a, b) { return a.minutes - b.minutes; });

    const loose = entries.filter(function (e) { return !e.mealId && e.type !== 'water'; });

    let current = byMeal.filter(function (b) { return b.status === 'now'; })[0] || null;
    const upcoming = byMeal.filter(function (b) { return b.status === 'next' || b.status === 'now'; });
    if (!current) current = upcoming[0] || null;
    const pendingShare = upcoming.reduce(function (s, b) { return s + (b.meal.share || 0); }, 0);

    return { dateKey, entries, totals, rest, byMeal, loose, current, upcoming, pendingShare, water: waterMl || 0 };
  }

  /* --------- reparto de lo que falta entre las comidas pendientes --------- */
  function planRemaining(day) {
    const up = day.upcoming;
    if (!up.length) return [];
    const totalShare = up.reduce(function (s, b) { return s + (b.meal.share || 1); }, 0) || 1;
    return up.map(function (b) {
      const w = (b.meal.share || 1) / totalShare;
      return {
        meal: b.meal,
        status: b.status,
        target: {
          kcal: Math.max(0, day.rest.kcal) * w,
          protein: Math.max(0, day.rest.protein) * w,
          carbs: Math.max(0, day.rest.carbs) * w,
          fat: Math.max(0, day.rest.fat) * w
        }
      };
    });
  }

  /* ---------------- motor de sugerencias ----------------
     Busca combinaciones de 1 o 2 alimentos de la biblioteca que se
     acerquen a los macros restantes sin excederlos de forma agresiva. */
  function suggest(rest, foods, opts) {
    opts = opts || {};
    const need = {
      kcal: Math.max(0, rest.kcal),
      protein: Math.max(0, rest.protein),
      carbs: Math.max(0, rest.carbs),
      fat: Math.max(0, rest.fat)
    };
    if (need.kcal < 40 && need.protein < 8) return [];

    const pool = foods.filter(function (f) {
      if (f.archived) return false;
      if (f.cat === 'suplemento' || f.cat === 'bebida' || f.cat === 'otro') return false;
      if ((opts.exclude || []).indexOf(f.id) >= 0) return false;
      return (f.kcal || 0) > 0;
    });

    /* fuente de proteína: densidad proteica razonable */
    const prot = pool.filter(function (f) {
      return f.protein >= 9 && (f.protein * 4) / Math.max(1, f.kcal) > 0.35;
    });
    /* guarnición: verdura, fruta o carbohidrato */
    const sides = pool.filter(function (f) {
      return f.cat === 'verdura' || f.cat === 'fruta' || (f.cat === 'carbo' && f.carbs >= 10);
    });

    /* porción máxima creíble según densidad energética y tipo */
    function capFor(f) {
      if (f.cat === 'verdura') return 300;
      if (f.cat === 'fruta') return 250;
      if (f.kcal >= 500) return 40;      // semillas, cremas, aceites
      if (f.kcal >= 350) return 70;      // avena, galletas, arroz crudo
      if (f.kcal >= 200) return 130;     // quesos, tortillas, panes
      if (f.kcal >= 110) return 250;     // carnes, pescados
      return 320;                        // cocidos y bajos en densidad
    }
    function roundG(g) { return g >= 100 ? Math.round(g / 10) * 10 : Math.round(g / 5) * 5; }

    function gramsForProtein(f, gProt) {
      if (!f.protein) return 0;
      const cap = Math.min(capFor(f), 250);
      let g = gProt / f.protein * 100;
      // que no se coma más del 80% de las calorías restantes
      if (f.kcal > 0) g = Math.min(g, need.kcal * 0.8 / f.kcal * 100);
      return roundG(Math.max(25, Math.min(cap, g)));
    }
    function gramsForSide(f, kcalLeft) {
      let g = kcalLeft / Math.max(1, f.kcal) * 100;
      return roundG(Math.max(25, Math.min(capFor(f), g)));
    }
    function nut(f, g) {
      const k = g / 100;
      return { kcal:f.kcal*k, protein:f.protein*k, carbs:f.carbs*k, fat:f.fat*k };
    }
    function score(sum, items) {
      function dd(got, want, wOver, wUnder) {
        const diff = got - want;
        return diff > 0 ? diff * wOver : -diff * wUnder;
      }
      let sc = dd(sum.protein, need.protein, 0.8, 3.2) * 4 +
               dd(sum.kcal, need.kcal, 1.8, 0.30) +
               dd(sum.fat, need.fat, 3.2, 0.30) * 2 +
               dd(sum.carbs, need.carbs, 0.9, 0.18) * 1.2;
      items.forEach(function (it) {
        if (it.food.favorite) sc -= 25;          // prioriza lo que sí compras
        sc += it.grams * 0.05;                   // castiga porciones enormes
      });
      return sc;
    }

    const out = [];
    prot.forEach(function (pf) {
      const g1 = gramsForProtein(pf, need.protein);
      if (!g1) return;
      const n1 = nut(pf, g1);
      if (n1.kcal > need.kcal * 1.25) return;
      const one = [{ food: pf, grams: g1 }];
      out.push({ items: one, sum: n1, score: score(n1, one) });

      sides.forEach(function (sf) {
        if (sf.id === pf.id) return;
        const kcalLeft = need.kcal - n1.kcal;
        if (kcalLeft < 50) return;
        const g2 = gramsForSide(sf, kcalLeft);
        const n2 = nut(sf, g2);
        const sum = { kcal:n1.kcal+n2.kcal, protein:n1.protein+n2.protein,
                      carbs:n1.carbs+n2.carbs, fat:n1.fat+n2.fat };
        const items = [{food:pf,grams:g1},{food:sf,grams:g2}];
        out.push({ items: items, sum: sum, score: score(sum, items) });
      });
    });

    out.sort(function (a, b) { return a.score - b.score; });

    const seen = {}, top = [];
    for (let i = 0; i < out.length && top.length < (opts.limit || 4); i++) {
      const key = out[i].items[0].food.id;
      if (seen[key]) continue;
      seen[key] = 1; top.push(out[i]);
    }
    return top;
  }


  /* ---------------- mejores alimentos para lo que falta ----------------
     Compara el "perfil energético" de lo que te falta (qué parte de las
     calorías restantes deberían venir de proteína, carbohidrato y grasa)
     contra el perfil de cada alimento. El que más se parece, gana. */
  function bestFoodsFor(rest, foods, opts) {
    opts = opts || {};
    const need = {
      kcal: Math.max(0, rest.kcal), protein: Math.max(0, rest.protein),
      carbs: Math.max(0, rest.carbs), fat: Math.max(0, rest.fat)
    };
    if (need.kcal < 30 && need.protein < 5) return [];

    const base = Math.max(1, need.protein * 4 + need.carbs * 4 + need.fat * 9);
    const want = { p: need.protein * 4 / base, c: need.carbs * 4 / base, f: need.fat * 9 / base };

    function capFor(f) {
      if (f.cat === 'verdura') return 300;
      if (f.cat === 'fruta') return 250;
      if (f.kcal >= 500) return 40;
      if (f.kcal >= 350) return 80;
      if (f.kcal >= 200) return 130;
      if (f.kcal >= 110) return 250;
      return 320;
    }

    const NO_SIRVEN = ['cilantro','ajo','chile_serrano','chile_guajillo','chipotle_adobo',
                       'limon','salsa_roja','salsa_verde','apio','lechuga','pepino','cafe'];
    const minKcal = Math.max(55, need.kcal * 0.08);

    const rows = foods.filter(function (f) {
      if (f.archived || f.kcal <= 5) return false;
      // fuera condimentos, hierbas, dulces, refrescos y suplementos
      if (['otro','suplemento','bebida'].indexOf(f.cat) >= 0) return false;
      if (NO_SIRVEN.indexOf(f.id) >= 0) return false;
      if ((opts.exclude || []).indexOf(f.id) >= 0) return false;
      return true;
    }).map(function (f) {
      const kb = Math.max(1, f.protein * 4 + f.carbs * 4 + f.fat * 9);
      const prof = { p: f.protein * 4 / kb, c: f.carbs * 4 / kb, f: f.fat * 9 / kb };
      // distancia entre perfiles (0 = idéntico)
      const dist = Math.abs(prof.p - want.p) * 1.6 + Math.abs(prof.c - want.c) +
                   Math.abs(prof.f - want.f) * 1.4;

      // cantidad sugerida: lo que se agote primero
      let g = capFor(f);
      if (f.protein > 0 && need.protein > 0) g = Math.min(g, need.protein / f.protein * 100);
      if (f.kcal > 0) g = Math.min(g, need.kcal * 0.75 / f.kcal * 100);
      if (f.fat > 1.5 && need.fat > 0) g = Math.min(g, need.fat / f.fat * 100);
      g = Math.max(15, g >= 100 ? Math.round(g / 10) * 10 : Math.round(g / 5) * 5);

      const k = g / 100;
      const n = { kcal:f.kcal*k, protein:f.protein*k, carbs:f.carbs*k, fat:f.fat*k,
                  fiber: f.micros && f.micros.fiber !== null ? f.micros.fiber * k : null };
      const cover = need.protein > 0 ? Math.min(1, n.protein / need.protein) : 0;
      const score = dist - (f.favorite ? 0.28 : 0) - cover * 0.9 +
                    (n.kcal > need.kcal ? 0.6 : 0) +
                    (n.kcal < minKcal ? 2.5 : 0);   // una porción que casi no aporta, no sirve
      return { food:f, grams:g, n:n, dist:dist, score:score, aporta:n.kcal >= minKcal };
    }).filter(function (x) { return x.aporta; });

    rows.sort(function (a, b) { return a.score - b.score; });
    return rows.slice(0, opts.limit || 8);
  }

  /* ---------------- alimentos ricos en un micronutriente ---------------- */
  function bestForMicro(microKey, foods, limit) {
    return foods.filter(function (f) {
      return !f.archived && f.micros && f.micros[microKey] !== null &&
             f.micros[microKey] !== undefined && f.micros[microKey] > 0;
    }).map(function (f) {
      const por = (f.portions || []).filter(function (p) { return p.id !== 'g'; })[0];
      const g = por ? por.grams : 100;
      return { food:f, grams:g, amount: f.micros[microKey] * g / 100,
               per100: f.micros[microKey], label: por ? por.label : '100 g' };
    }).sort(function (a, b) { return b.amount - a.amount; }).slice(0, limit || 4);
  }

  return { MICROS, CATS, ACTIVITY, GOALS, PACE, TRAIN_MET,
           defaultProfile, defaultMeals, defaultPrefs,
           computeTargets, portionOf, nutrientsFor, makeEntry,
           emptyTotals, sumEntries, buildDay, planRemaining, suggest,
           bestFoodsFor, bestForMicro };
})();


/* ===== 22-planner.js ===== */
/* ============================================================
   NUTRI TRACK — planificador de comidas (Fases 2, 4 y 5)
   Arma qué comer, a qué hora y cuánto, respetando preferencias
   y recalculando cuando el día se sale del plan.
   ============================================================ */
NT.planner = (function () {
  const u = NT.u, M = NT.model;

  /* ---------- azar reproducible: el mismo día da el mismo plan ---------- */
  function seedOf(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function rng(seed) {
    let s = seed || 1;
    return function () { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  }
  function pick(arr, rand) { return arr.length ? arr[Math.floor(rand() * arr.length) % arr.length] : null; }

  /* ---------- arquetipos de comida ---------- */
  const ARCHETYPES = {
    desayuno: { roles:['proteina','carbo','fruta'], veg:0,   kw:/desayun/i },
    colacion: { roles:['snack'],                    veg:0,   kw:/colaci|snack|refriger/i },
    fuerte:   { roles:['proteina','carbo','verdura'], veg:180, kw:/comida|almuerz/i },
    cena:     { roles:['proteina','verdura','carbo'], veg:200, kw:/cena/i }
  };

  function archetypeFor(meal, index, total) {
    const n = u.norm(meal.name);
    if (ARCHETYPES.desayuno.kw.test(n)) return 'desayuno';
    if (ARCHETYPES.colacion.kw.test(n)) return 'colacion';
    if (ARCHETYPES.cena.kw.test(n)) return 'cena';
    if (ARCHETYPES.fuerte.kw.test(n)) return 'fuerte';
    if ((meal.share || 0) <= 0.14) return 'colacion';
    if (index === 0) return 'desayuno';
    if (index === total - 1) return 'cena';
    return 'fuerte';
  }

  /* ---------- selección de candidatos según preferencias ---------- */
  function pools(foods, prefs) {
    const avoid = {};
    (prefs.avoid || []).concat(prefs.dislikes || []).forEach(function (id) { avoid[id] = 1; });
    const ok = foods.filter(function (f) {
      return !f.archived && !avoid[f.id] && (f.kcal || 0) >= 0 && f.cat !== 'suplemento';
    });
    function sortFav(list) {
      return list.slice().sort(function (a, b) {
        return (b.favorite ? 1 : 0) - (a.favorite ? 1 : 0) || a.name.localeCompare(b.name, 'es');
      });
    }
    return {
      proteina: sortFav(ok.filter(function (f) {
        return f.protein >= 9 && (f.protein * 4) / Math.max(1, f.kcal) > 0.34 &&
               ['proteina','lacteo'].indexOf(f.cat) >= 0;
      })),
      desayunoProt: sortFav(ok.filter(function (f) {
        return f.protein >= 9 && ['proteina','lacteo'].indexOf(f.cat) >= 0 &&
               /huevo|clara|yogur|queso|requeson|whey|prote|atun|jamon|leche/i.test(f.name);
      })),
      carbo: sortFav(ok.filter(function (f) { return f.cat === 'carbo' && f.carbs >= 15; })),
      verdura: sortFav(ok.filter(function (f) { return f.cat === 'verdura'; })),
      fruta: sortFav(ok.filter(function (f) { return f.cat === 'fruta'; })),
      grasa: sortFav(ok.filter(function (f) {
        return f.cat === 'grasa' && f.fat >= 10 &&
               /aguacate|almendra|nuez|cacahuate|chia|chía|linaza|oliva/i.test(f.name);
      })),
      carboDesayuno: sortFav(ok.filter(function (f) {
        return f.cat === 'carbo' && f.carbs >= 15 &&
               /avena|pan|tortilla|arroz|papa|camote|salmas|elote|bolillo/i.test(f.name);
      })),
      verduraGuarnicion: sortFav(ok.filter(function (f) {
        return f.cat === 'verdura' && !/cebolla|chile|ajo|apio|betabel/i.test(f.name);
      })),
      snackProt: sortFav(ok.filter(function (f) {
        return f.protein >= 8 && !/yema/i.test(f.name) &&
               /yogur|atun|whey|requeson|huevo|clara|queso|leche|jamon|almendra|cacahuate/i.test(f.name);
      })),
      snack: sortFav(ok.filter(function (f) {
        return f.cat === 'fruta' || f.cat === 'lacteo' ||
               /yogur|atun|whey|almendra|cacahuate|nuez|manzana|platano|salmas|requeson|huevo/i.test(f.name);
      }))
    };
  }

  function capFor(f) {
    if (f.cat === 'verdura') return 300;
    if (f.cat === 'fruta') return 250;
    if (f.kcal >= 500) return 35;
    if (f.kcal >= 350) return 90;
    if (f.kcal >= 200) return 140;
    if (f.kcal >= 110) return 260;
    return 340;
  }
  function roundG(g) { return g >= 100 ? Math.round(g / 10) * 10 : Math.round(g / 5) * 5; }
  function nut(f, g) {
    const k = g / 100;
    return { kcal:f.kcal*k, protein:f.protein*k, carbs:f.carbs*k, fat:f.fat*k };
  }
  function addTo(sum, n) {
    sum.kcal += n.kcal; sum.protein += n.protein; sum.carbs += n.carbs; sum.fat += n.fat; return sum;
  }

  /* ---------- construye una comida concreta para un objetivo ---------- */
  /* elige un platillo del recetario que quepa en el objetivo de la comida */
  function pickRecipe(target, arche, rand, ctx) {
    if (!ctx || !ctx.foodsById || !NT.recipes) return null;
    const key = arche === 'fuerte' ? 'comida' : arche;
    const universo = (ctx.recipePool && ctx.recipePool[key] && ctx.recipePool[key].length)
      ? ctx.recipePool[key] : NT.recipes.forMeal(key);
    let cands = universo.filter(function (r) {
      if (ctx.usedRecipes && ctx.usedRecipes[r.id]) return false;
      if (!NT.recipes.isAvailable(r, ctx.foodsById, ctx.prefs)) return false;
      if (!NT.recipes.fitsTarget(r, target, ctx.foodsById)) return false;
      if (key === 'colacion') {
        const tieneProt = r.ingredients.some(function (i) { return i.role === 'prot'; });
        if (!tieneProt) return false;
      }
      return true;
    });
    if (!cands.length && ctx.recipePool) {
      // el menú de la semana no dio opciones: abre a todo el recetario
      cands = NT.recipes.forMeal(key).filter(function (r) {
        return NT.recipes.isAvailable(r, ctx.foodsById, ctx.prefs) &&
               NT.recipes.fitsTarget(r, target, ctx.foodsById);
      });
    }
    if (!cands.length) return null;
    // evita las de días recientes, salvo que no quede nada
    const frescas = cands.filter(function (r) { return !(ctx.avoidRecipes || {})[r.id]; });
    if (frescas.length) cands = frescas;
    const rec = cands[Math.floor(rand() * cands.length) % cands.length];
    if (ctx.usedRecipes) ctx.usedRecipes[rec.id] = 1;
    const scaled = NT.recipes.scale(rec, target, ctx.foodsById);
    return {
      items: scaled.items, sum: scaled.sum,
      recipeId: rec.id, recipeName: rec.name, recipeEmoji: rec.emoji,
      minutes: rec.minutes, steps: rec.steps, tags: rec.tags
    };
  }

  function buildMeal(target, P, arche, rand, used, ctx) {
    if (ctx && ctx.useRecipes !== false) {
      const fromRecipe = pickRecipe(target, arche, rand, ctx);
      if (fromRecipe) return fromRecipe;
    }
    return buildFromFoods(target, P, arche, rand, used);
  }

  function buildFromFoods(target, P, arche, rand, used) {
    const items = [];
    const sum = { kcal:0, protein:0, carbs:0, fat:0 };
    const A = ARCHETYPES[arche] || ARCHETYPES.fuerte;

    function choose(list) {
      if (!list || !list.length) return null;
      const fresh = list.filter(function (f) { return !used[f.id]; });
      const from = fresh.length ? fresh : list;
      // sesgo hacia el principio de la lista (favoritos primero)
      const i = Math.floor(Math.pow(rand(), 1.7) * from.length);
      const f = from[Math.min(i, from.length - 1)];
      if (f) used[f.id] = 1;
      return f;
    }
    function push(f, g, role) {
      if (!f || g <= 0) return;
      const n = nut(f, g);
      items.push({ foodId:f.id, name:f.name, emoji:f.emoji, state:f.state, grams:g, baseGrams:g, n:n,
                   role: role || f.cat, cap: capFor(f),
                   per100: { kcal:f.kcal, protein:f.protein, carbs:f.carbs, fat:f.fat } });
      addTo(sum, n);
    }

    if (arche === 'colacion') {
      const s = choose(P.snackProt.length ? P.snackProt : P.snack);
      if (s) {
        const g = target.protein / Math.max(1, s.protein) * 100;
        const maxByKcal = target.kcal * 0.8 / Math.max(1, s.kcal) * 100;
        push(s, roundG(u.clamp(Math.min(g, maxByKcal), 20, capFor(s))), s.cat === 'fruta' ? 'carbo' : 'proteina');
      }
      if (sum.kcal < target.kcal * 0.7) {
        const f2 = choose(P.fruta);
        if (f2) push(f2, roundG(u.clamp((target.kcal - sum.kcal) / Math.max(1, f2.kcal) * 100, 30, capFor(f2))), 'carbo');
      }
      return { items, sum };
    }

    // 1) verdura fija (aporta volumen y micronutrientes, casi sin calorías)
    if (A.veg) {
      const v = choose(P.verduraGuarnicion.length ? P.verduraGuarnicion : P.verdura);
      if (v) push(v, A.veg, 'verdura');
    }
    // 2) fuente de proteína
    let protPool = arche === 'desayuno' && P.desayunoProt.length ? P.desayunoProt : P.proteina;
    // no elijas una fuente cuya grasa reviente el presupuesto de la comida
    if (target.protein > 0) {
      const maxRatio = (target.fat / target.protein) * 1.45;
      const lean = protPool.filter(function (f) { return (f.fat / Math.max(1, f.protein)) <= maxRatio; });
      if (lean.length >= 3) protPool = lean;
    }
    const pf = choose(protPool);
    if (pf) {
      let g = (target.protein - sum.protein) / Math.max(1, pf.protein) * 100;
      push(pf, roundG(u.clamp(g, 30, capFor(pf))), 'proteina');
    }
    // 3) carbohidrato
    const cf = choose(arche === 'desayuno'
      ? (P.carboDesayuno.length ? P.carboDesayuno : P.carbo)
      : P.carbo);
    if (cf) {
      let g = (target.carbs - sum.carbs) / Math.max(1, cf.carbs) * 100;
      const maxByKcal = Math.max(0, target.kcal - sum.kcal) * 0.95 / Math.max(1, cf.kcal) * 100;
      push(cf, roundG(u.clamp(Math.min(g, maxByKcal), 20, capFor(cf))), 'carbo');
    }
    // 4) fruta en el desayuno
    if (A.roles.indexOf('fruta') >= 0 && sum.kcal < target.kcal * 0.85) {
      const fr = choose(P.fruta);
      if (fr) {
        const g = (target.kcal - sum.kcal) * 0.6 / Math.max(1, fr.kcal) * 100;
        push(fr, roundG(u.clamp(g, 40, capFor(fr))), 'carbo');
      }
    }
    // 5) completa grasa si quedó muy por debajo
    const fatGap = target.fat - sum.fat;
    if (fatGap > 7 && P.grasa.length) {
      const gf = choose(P.grasa);
      if (gf) push(gf, roundG(u.clamp(fatGap / Math.max(1, gf.fat) * 100, 5, capFor(gf))), 'grasa');
    }
    return { items, sum };
  }


  /* ---------- ajuste final: cierra la brecha de carbohidratos y recorta grasa ---------- */
  function recalcItem(it) {
    const k = it.grams / 100;
    it.n = { kcal:it.per100.kcal*k, protein:it.per100.protein*k, carbs:it.per100.carbs*k, fat:it.per100.fat*k };
  }
  function sumMeals(list) {
    const t = { kcal:0, protein:0, carbs:0, fat:0 };
    list.forEach(function (m) {
      m.sum = { kcal:0, protein:0, carbs:0, fat:0 };
      m.items.forEach(function (it) { addTo(m.sum, it.n); });
      addTo(t, m.sum);
    });
    return t;
  }
  function scaleRole(list, role, factor) {
    list.forEach(function (m) {
      m.items.forEach(function (it) {
        if (it.role !== role) return;
        const g = roundG(u.clamp(it.grams * factor, 10, it.cap));
        it.grams = g;
        recalcItem(it);
      });
    });
  }
  function addItem(m, f, grams, role) {
    if (!f || grams <= 0) return;
    const k = grams / 100;
    m.items.push({
      foodId:f.id, name:f.name, emoji:f.emoji, state:f.state, grams:grams, baseGrams:grams,
      n:{ kcal:f.kcal*k, protein:f.protein*k, carbs:f.carbs*k, fat:f.fat*k },
      role: role || f.cat, cap: capFor(f),
      per100:{ kcal:f.kcal, protein:f.protein, carbs:f.carbs, fat:f.fat }
    });
  }

  function balancePlan(list, budget, P, rand) {
    let total = sumMeals(list);

    /* 1) recorta proteína si se pasó */
    if (total.protein > budget.protein * 1.10) {
      const pFrom = roleSum(list, 'proteina', 'protein');
      if (pFrom > 10) {
        scaleRole(list, 'proteina', u.clamp((pFrom - (total.protein - budget.protein)) / pFrom, 0.6, 1));
        total = sumMeals(list);
      }
    }
    /* 2) recorta grasa si se pasó */
    if (total.fat > budget.fat * 1.10) {
      const fFrom = roleSum(list, 'grasa', 'fat');
      if (fFrom > 2) {
        scaleRole(list, 'grasa', u.clamp((fFrom - (total.fat - budget.fat)) / fFrom, 0, 1));
        total = sumMeals(list);
      }
    }
    /* 3) rellena comidas que quedaron demasiado flacas tras los recortes */
    if (P && rand) {
      const usedIds = {};
      list.forEach(function (m) { m.items.forEach(function (it) { usedIds[it.foodId] = 1; }); });
      list.forEach(function (m) {
        if (!m.target || m.sum.kcal >= m.target.kcal * 0.75) return;
        const gap = m.target.kcal - m.sum.kcal;
        const pool = (m.archetype === 'colacion' ? P.fruta : P.carbo).filter(function (f) { return !usedIds[f.id]; });
        const src = pool.length ? pool : (m.archetype === 'colacion' ? P.fruta : P.carbo);
        if (!src.length) return;
        const f = src[Math.floor(rand() * src.length) % src.length];
        usedIds[f.id] = 1;
        addItem(m, f, roundG(u.clamp(gap / Math.max(1, f.kcal) * 100, 25, capFor(f))), 'carbo');
      });
      total = sumMeals(list);
    }
    /* 3.5) si el día quedó muy bajo en grasa, súbela: primero escalando las
       grasas que ya hay y, si no alcanza, agregando una a la comida principal */
    if (budget.fat > 0 && total.fat < budget.fat * 0.85) {
      const fatNow = roleSum(list, 'grasa', 'fat');
      if (fatNow > 2) {
        scaleRole(list, 'grasa', u.clamp((budget.fat - (total.fat - fatNow)) / fatNow, 1, 2.4));
        total = sumMeals(list);
      }
      if (P && rand && total.fat < budget.fat * 0.85 && (P.grasa || []).length) {
        const gap = budget.fat - total.fat;
        const target2 = list.slice().sort(function (a, b) { return b.sum.kcal - a.sum.kcal; })[0];
        if (target2) {
          const usados = {};
          target2.items.forEach(function (it) { usados[it.foodId] = 1; });
          const opciones = P.grasa.filter(function (f) { return !usados[f.id]; });
          const f = (opciones.length ? opciones : P.grasa)[Math.floor(rand() * (opciones.length || P.grasa.length))];
          if (f && f.fat > 0) {
            addItem(target2, f, roundG(u.clamp(gap / f.fat * 100, 5, capFor(f))), 'grasa');
            total = sumMeals(list);
          }
        }
      }
    }

    /* 4) cierra la brecha de carbohidratos del día */
    for (let pass = 0; pass < 3; pass++) {
      const carbNow = roleSum(list, 'carbo', 'carbs');
      const gap = budget.carbs - total.carbs;
      if (carbNow > 5 && Math.abs(gap) > 6) {
        scaleRole(list, 'carbo', u.clamp((carbNow + gap) / carbNow, 0.55, 1.9));
        total = sumMeals(list);
      } else break;
    }
    /* 5) tope final de calorías */
    if (total.kcal > budget.kcal * 1.05) {
      const cFrom = roleSum(list, 'carbo', 'kcal');
      if (cFrom > 60) {
        scaleRole(list, 'carbo', u.clamp((cFrom - (total.kcal - budget.kcal)) / cFrom, 0.5, 1));
        total = sumMeals(list);
      }
    }
    return total;
  }

  function roleSum(list, role, key) {
    return list.reduce(function (s, m) {
      return s + m.items.reduce(function (a, it) { return a + (it.role === role ? it.n[key] : 0); }, 0);
    }, 0);
  }

  /* ---------- plan completo de un día ---------- */
  function buildDayPlan(dateKey, goals, meals, foods, prefs, opts) {
    opts = opts || {};
    const P = opts.pools || pools(foods, prefs || {});
    const rand = rng(seedOf(dateKey + '|' + (opts.variant || 0)));
    const used = {};
    const foodsById = opts.foodsById || (function () {
      const m = {}; foods.forEach(function (f) { m[f.id] = f; }); return m;
    })();
    const ctx = {
      foodsById: foodsById, prefs: prefs || {},
      avoidRecipes: opts.avoidRecipes || {}, usedRecipes: {},
      recipePool: opts.recipePool || null,
      useRecipes: opts.useRecipes !== false
    };
    const active = meals.filter(function (m) { return m.enabled !== false; })
                        .sort(function (a, b) { return u.hhmmToMin(a.time) - u.hhmmToMin(b.time); });
    const totalShare = active.reduce(function (s, m) { return s + (m.share || 0); }, 0) || 1;

    const budget = opts.budget || goals;
    const list = active.map(function (m, i) {
      const w = (m.share || 0) / totalShare;
      const target = {
        kcal: budget.kcal * w, protein: budget.protein * w,
        carbs: budget.carbs * w, fat: budget.fat * w
      };
      const arche = archetypeFor(m, i, active.length);
      const built = buildMeal(target, P, arche, rand, used, ctx);
      return { mealId:m.id, mealName:m.name, time:m.time, emoji:m.emoji,
               archetype:arche, target:target, items:built.items, sum:built.sum,
               recipeId: built.recipeId || null, recipeName: built.recipeName || null,
               recipeEmoji: built.recipeEmoji || null, minutes: built.minutes || null,
               steps: built.steps || null };
    });

    const total = balancePlan(list, budget, P, rand);
    return { id:'day_' + dateKey, date:dateKey, createdAt:Date.now(),
             goals:{ kcal:budget.kcal, protein:budget.protein, carbs:budget.carbs, fat:budget.fat },
             meals:list, total:total };
  }

  /* ---------- replanea SOLO lo que falta del día ---------- */
  function replanRemaining(day, goals, meals, foods, prefs, opts) {
    opts = opts || {};
    const pending = day.upcoming.map(function (b) { return b.meal; });
    if (!pending.length) return null;
    const rest = {
      kcal: Math.max(0, day.rest.kcal), protein: Math.max(0, day.rest.protein),
      carbs: Math.max(0, day.rest.carbs), fat: Math.max(0, day.rest.fat)
    };
    return buildDayPlan(day.dateKey, rest, pending, foods, prefs,
                        { budget: rest, variant: opts.variant || 0,
                          avoidRecipes: opts.avoidRecipes || {} });
  }


  /* ---------- despensa de la semana ----------
     Se limita la variedad para que la lista de compras sea realista:
     nadie compra 57 alimentos distintos para una semana. */
  const WEEK_TAKE = { proteina:5, desayunoProt:4, carbo:5, carboDesayuno:4,
                      verdura:6, verduraGuarnicion:5, fruta:4, grasa:3, snack:5, snackProt:4 };

  function shortlist(P, rand) {
    const out = {};
    Object.keys(P).forEach(function (k) {
      const list = P[k] || [];
      const n = WEEK_TAKE[k] || 5;
      const favs = list.filter(function (f) { return f.favorite; }).slice(0, n);
      const rest = list.filter(function (f) { return favs.indexOf(f) < 0; });
      const pick = favs.slice();
      while (pick.length < n && rest.length) {
        const i = Math.floor(rand() * rest.length) % rest.length;
        pick.push(rest.splice(i, 1)[0]);
      }
      out[k] = pick.length ? pick : list;
    });
    return out;
  }


  /* ---------- menú de la semana ----------
     Se eligen pocas recetas por tipo de comida y se rotan durante los 7 días.
     Así los ingredientes se repiten y la lista de compras es realista. */
  const RECIPE_TAKE = { desayuno:4, comida:5, cena:5, colacion:5 };

  function recipeShortlist(foodsById, prefs, rand) {
    const out = {};
    ['desayuno','comida','cena','colacion'].forEach(function (k) {
      const pool = NT.recipes.forMeal(k).filter(function (r) {
        return NT.recipes.isAvailable(r, foodsById, prefs);
      });
      // los que usan favoritos van primero
      pool.sort(function (a, b) { return favScore(b, foodsById) - favScore(a, foodsById); });
      const cabeza = pool.slice(0, Math.min(pool.length, (RECIPE_TAKE[k] || 5) + 4));
      const pick = [];
      while (pick.length < (RECIPE_TAKE[k] || 5) && cabeza.length) {
        const i = Math.floor(rand() * cabeza.length) % cabeza.length;
        pick.push(cabeza.splice(i, 1)[0]);
      }
      out[k] = pick.length ? pick : pool;
    });
    return out;
  }
  function favScore(recipe, foodsById) {
    return recipe.ingredients.reduce(function (s, i) {
      const f = foodsById[i.foodId];
      return s + (f && f.favorite ? 1 : 0);
    }, 0);
  }

  /* ---------- plan semanal ---------- */
  function buildWeekPlan(startKey, goals, meals, foods, prefs, opts) {
    opts = opts || {};
    const P = shortlist(pools(foods, prefs || {}), rng(seedOf(startKey + '|w' + (opts.variant || 0))));
    const foodsById = {};
    foods.forEach(function (f) { foodsById[f.id] = f; });
    const menuRand = rng(seedOf(startKey + '|menu' + (opts.variant || 0)));
    const recipePool = recipeShortlist(foodsById, prefs || {}, menuRand);
    const days = [];
    const recent = [];
    for (let i = 0; i < 7; i++) {
      const k = u.addDays(startKey, i);
      const avoid = {};
      recent.slice(-2).forEach(function (set) {
        Object.keys(set).forEach(function (id) { avoid[id] = 1; });
      });
      const day = buildDayPlan(k, goals, meals, foods, prefs,
                               { pools: P, variant: opts.variant || 0,
                                 foodsById: foodsById, avoidRecipes: avoid,
                                 recipePool: recipePool });
      const usados = {};
      day.meals.forEach(function (m) { if (m.recipeId) usados[m.recipeId] = 1; });
      recent.push(usados);
      days.push(day);
    }
    return { id:'week_' + startKey, start:startKey, createdAt:Date.now(),
             days:days, pantry: pantryOf(P), menu: recipePool };
  }

  function pantryOf(P) {
    const seen = {}, out = [];
    Object.keys(P).forEach(function (k) {
      (P[k] || []).forEach(function (f) { if (!seen[f.id]) { seen[f.id] = 1; out.push(f.id); } });
    });
    return out;
  }

  const CONDIMENTOS = ['ajo','cilantro','chile_serrano','chile_guajillo','chipotle_adobo','limon',
                       'aceite_oliva','aceite_vegetal','salsa_roja','salsa_verde','miel','azucar',
                       'mole_pasta','mantequilla','mayonesa'];

  function unitWord(label) {
    return String(label || 'pieza').split('(')[0].trim().split(/\s+/)[0] || 'pieza';
  }
  function plural(w, n) {
    if (n === 1) return w;
    if (/s$/i.test(w)) return w;                       // dosis, análisis…
    if (/[aeiouáéíóú]$/i.test(w)) return w + 's';      // pieza, lata, rebanada
    if (/[lrndzjx]$/i.test(w)) return w + 'es';        // limón, papel
    return w + 's';                                    // scoop, kit
  }

  /* ---------- lista de compras a partir de un plan semanal ---------- */
  function shoppingFrom(week, foodsById) {
    const agg = {};
    week.days.forEach(function (d) {
      d.meals.forEach(function (m) {
        m.items.forEach(function (it) {
          if (!agg[it.foodId]) agg[it.foodId] = { foodId:it.foodId, grams:0 };
          agg[it.foodId].grams += it.grams;
        });
      });
    });
    const rows = Object.keys(agg).map(function (id) {
      const f = foodsById[id];
      const grams = agg[id].grams;
      const r = { foodId:id, name: f ? f.name : id, emoji: f ? f.emoji : '🍽️',
                  state: f ? f.state : 'na',
                  cat: CONDIMENTOS.indexOf(id) >= 0 ? 'condimento' : (f ? f.cat : 'otro'),
                  grams: grams, display:'', cost:null, bought:false };
      if (f) {
        const piece = (f.portions || []).filter(function (p) {
          return p.id !== 'g' && p.grams !== 100 && /pieza|botella|lata|rebanada|filete|scoop|dosis|vaso/i.test(p.label);
        })[0];
        if (piece) {
          const n = Math.ceil(grams / piece.grams);
          r.display = n + ' ' + plural(unitWord(piece.label), n) + ' (~' + u.fmt(grams) + ' g)';
        }
        else if (grams >= 1000) r.display = u.fmt(grams / 1000, 1) + ' kg';
        else r.display = u.fmt(grams) + ' g';

        if (f.price) {
          if (f.price.per === 'kg' || f.price.per === 'litro') r.cost = f.price.amount * grams / 1000;
          else if (f.price.per === 'pieza') {
            const p0 = (f.portions || []).filter(function (p) { return p.id !== 'g' && p.grams !== 100; })[0];
            r.cost = p0 ? f.price.amount * Math.ceil(grams / p0.grams) : null;
          } else if (f.price.per === 'paquete') r.cost = f.price.amount;
        }
      } else {
        r.display = u.fmt(grams) + ' g';
      }
      return r;
    });
    rows.sort(function (a, b) { return a.cat.localeCompare(b.cat) || a.name.localeCompare(b.name, 'es'); });
    const cost = rows.reduce(function (s, r) { return s + (r.cost || 0); }, 0);
    const withPrice = rows.filter(function (r) { return r.cost !== null; }).length;
    return { id:'shop_' + week.start, weekStart:week.start, createdAt:Date.now(),
             rows:rows, cost:cost, priced:withPrice, total:rows.length };
  }

  /* ---------- preparación de comida (batch cooking) ---------- */
  function mealPrepFrom(week, foodsById) {
    const agg = {};
    week.days.forEach(function (d) {
      d.meals.forEach(function (m) {
        m.items.forEach(function (it) {
          const f = foodsById[it.foodId];
          if (!f) return;
          if (['proteina','carbo','verdura'].indexOf(f.cat) < 0) return;
          if (!agg[it.foodId]) agg[it.foodId] = { food:f, grams:0, days:{} };
          agg[it.foodId].grams += it.grams;
          agg[it.foodId].days[d.date] = 1;
        });
      });
    });
    return Object.keys(agg).map(function (k) { return agg[k]; })
      .filter(function (x) { return x.grams >= 150; })
      .sort(function (a, b) { return b.grams - a.grams; });
  }

  return { buildDayPlan, replanRemaining, buildWeekPlan, shoppingFrom, mealPrepFrom,
           pools, shortlist, archetypeFor };
})();


/* ===== 24-recipes.js ===== */
/* ============================================================
   NUTRI TRACK — motor de recetas
   Escala un platillo a los macros que te tocan y permite
   cambiar un ingrediente por el que sí tengas en casa,
   recalculando el resto del platillo.
   ============================================================ */
NT.recipes = (function () {
  const u = NT.u;

  const ROLE_MAP = { prot:'proteina', carbo:'carbo', verd:'verdura', grasa:'grasa', sazon:'sazon' };

  function all() { return NT.RECIPES; }
  function byId(id) { return NT.RECIPES.filter(function (r) { return r.id === id; })[0] || null; }
  function forMeal(archetype) {
    const key = archetype === 'fuerte' ? 'comida' : archetype;
    return NT.RECIPES.filter(function (r) { return r.meals.indexOf(key) >= 0; });
  }

  /* ¿se puede cocinar con lo que hay en la biblioteca / sin lo excluido? */
  function isAvailable(recipe, foodsById, prefs) {
    const avoid = {};
    ((prefs && prefs.avoid) || []).concat((prefs && prefs.dislikes) || [])
      .forEach(function (id) { avoid[id] = 1; });
    return recipe.ingredients.every(function (i) {
      const f = foodsById[i.foodId];
      return f && !f.archived && !avoid[i.foodId];
    });
  }

  function per100(f) { return { kcal:f.kcal, protein:f.protein, carbs:f.carbs, fat:f.fat }; }
  function nut(p, g) {
    const k = g / 100;
    return { kcal:p.kcal*k, protein:p.protein*k, carbs:p.carbs*k, fat:p.fat*k };
  }
  function zero() { return { kcal:0, protein:0, carbs:0, fat:0 }; }
  function add(a, b) { a.kcal+=b.kcal; a.protein+=b.protein; a.carbs+=b.carbs; a.fat+=b.fat; return a; }
  function sumItems(items) {
    return items.reduce(function (s, it) { return add(s, it.n); }, zero());
  }
  function roundG(g, role) {
    if (role === 'sazon') return Math.max(1, Math.round(g));
    return g >= 100 ? Math.round(g / 10) * 10 : Math.max(5, Math.round(g / 5) * 5);
  }
  function capFor(f) {
    if (f.cat === 'verdura') return 320;
    if (f.cat === 'fruta') return 260;
    if (f.kcal >= 500) return 45;
    if (f.kcal >= 350) return 110;
    if (f.kcal >= 200) return 160;
    if (f.kcal >= 110) return 300;
    return 380;
  }

  /* ---------- construye los items base de una receta ---------- */
  function baseItems(recipe, foodsById) {
    return recipe.ingredients.map(function (i) {
      const f = foodsById[i.foodId];
      if (!f) return null;
      const p = per100(f);
      return {
        foodId: f.id, name: f.name, emoji: f.emoji, state: f.state,
        grams: i.grams, baseGrams: i.grams,
        role: ROLE_MAP[i.role] || 'sazon', recipeRole: i.role,
        cap: capFor(f), per100: p, n: nut(p, i.grams)
      };
    }).filter(Boolean);
  }

  /* ---------- reescala una lista de items a un objetivo ---------- */
  function rescaleItems(items, target) {
    if (!items.length) return zero();

    function byRole(role) { return items.filter(function (it) { return it.role === role; }); }
    function sumOf(list, key) {
      return list.reduce(function (s, it) { return s + it.n[key]; }, 0);
    }
    function recalc(it) { it.n = nut(it.per100, it.grams); }
    function applyFactor(list, factor, lo, hi) {
      const f = u.clamp(factor, lo, hi);
      list.forEach(function (it) {
        it.grams = roundG(u.clamp(it.baseGrams * f, 5, it.cap), it.role);
        recalc(it);
      });
    }

    const prot = byRole('proteina'), carbo = byRole('carbo'),
          verd = byRole('verdura'), grasa = byRole('grasa'), sazon = byRole('sazon');

    // 1) referencia de tamaño del platillo
    items.forEach(function (it) { it.grams = it.baseGrams; recalc(it); });
    const base = sumItems(items);
    const sizeRatio = base.kcal > 0 ? target.kcal / base.kcal : 1;

    // 2) verduras y grasas siguen el tamaño, pero con poco margen
    applyFactor(verd, sizeRatio, 0.7, 1.5);
    applyFactor(grasa, sizeRatio, 0.6, 1.35);

    // 3) dos pasadas de proteína y carbohidrato (se afectan entre sí)
    for (let pass = 0; pass < 2; pass++) {
      const otherProt = sumOf(verd, 'protein') + sumOf(grasa, 'protein') +
                        sumOf(sazon, 'protein') + sumOf(carbo, 'protein');
      const baseProt = prot.reduce(function (s, it) { return s + it.per100.protein * it.baseGrams / 100; }, 0);
      if (baseProt > 0) {
        applyFactor(prot, (target.protein - otherProt) / baseProt, 0.35, 2.6);
      }
      const otherCarb = sumOf(prot, 'carbs') + sumOf(verd, 'carbs') +
                        sumOf(grasa, 'carbs') + sumOf(sazon, 'carbs');
      const baseCarb = carbo.reduce(function (s, it) { return s + it.per100.carbs * it.baseGrams / 100; }, 0);
      if (baseCarb > 0) {
        applyFactor(carbo, (target.carbs - otherCarb) / baseCarb, 0.25, 2.6);
      }
    }

    // 4) control de grasa: primero recorta la grasa añadida, luego la fuente
    //    de proteína si es la que se está pasando (mejor quedarse corto de
    //    proteína que reventar el objetivo de grasa del día)
    let total = sumItems(items);
    if (target.fat > 0 && total.fat > target.fat * 1.20) {
      const fatFromGrasa = sumOf(grasa, 'fat');
      if (fatFromGrasa > 1) {
        const need = total.fat - target.fat * 1.10;
        const cf = (fatFromGrasa - need) / fatFromGrasa;
        applyFactor(grasa, currentFactor(grasa) * u.clamp(cf, 0.25, 1), 0.2, 1.35);
        total = sumItems(items);
      }
      // si el carbohidrato es graso (totopos, granola…) recórtalo antes que la proteína
      const fatFromCarbo = sumOf(carbo, 'fat');
      if (total.fat > target.fat * 1.20 && fatFromCarbo > total.fat * 0.22) {
        const need15 = total.fat - target.fat * 1.10;
        const cf2 = (fatFromCarbo - need15) / fatFromCarbo;
        applyFactor(carbo, currentFactor(carbo) * u.clamp(cf2, 0.35, 1), 0.2, 3.0);
        total = sumItems(items);
      }
      if (total.fat > target.fat * 1.20 && sumOf(prot, 'fat') > 3) {
        const fatProt = sumOf(prot, 'fat');
        const need2 = total.fat - target.fat * 1.15;
        const pf = (fatProt - need2) / fatProt;
        applyFactor(prot, currentFactor(prot) * u.clamp(pf, 0.55, 1), 0.3, 2.6);
        total = sumItems(items);
      }
    }

    // 5) ajuste fino por calorías, moviendo el carbohidrato
    if (target.kcal > 0 && carbo.length) {
      for (let i = 0; i < 2; i++) {
        const carbKcal = sumOf(carbo, 'kcal');
        if (carbKcal <= 0) break;
        if (total.kcal > target.kcal * 1.08) {
          const cut = total.kcal - target.kcal;
          applyFactor(carbo, currentFactor(carbo) * u.clamp((carbKcal - cut) / carbKcal, 0.2, 1), 0.15, 3.0);
        } else if (total.kcal < target.kcal * 0.92) {
          const need = target.kcal - total.kcal;
          applyFactor(carbo, currentFactor(carbo) * u.clamp((carbKcal + need) / carbKcal, 1, 2.2), 0.15, 3.0);
        } else break;
        total = sumItems(items);
      }
    }
    return sumItems(items);
  }

  /* factor actual respecto a la receta base (para no perderlo al reajustar) */
  function currentFactor(list) {
    if (!list.length) return 1;
    const a = list.reduce(function (s, it) { return s + it.grams; }, 0);
    const b = list.reduce(function (s, it) { return s + it.baseGrams; }, 0);
    return b > 0 ? a / b : 1;
  }

  /* ---------- escala una receta completa ---------- */
  function scale(recipe, target, foodsById) {
    const items = baseItems(recipe, foodsById);
    const sum = rescaleItems(items, target);
    return {
      recipeId: recipe.id, recipeName: recipe.name, recipeEmoji: recipe.emoji,
      minutes: recipe.minutes, steps: recipe.steps, tags: recipe.tags,
      items: items, sum: sum
    };
  }

  /* ---------- sustituir un ingrediente por lo que sí hay ---------- */
  function swapIngredient(items, index, newFood, target) {
    const old = items[index];
    if (!old || !newFood) return null;
    const p = per100(newFood);

    // gramos de arranque: igualar el nutriente dominante del papel que cumplía
    let g;
    if (old.role === 'proteina') g = p.protein > 0 ? old.n.protein / p.protein * 100 : old.grams;
    else if (old.role === 'carbo') g = p.carbs > 0 ? old.n.carbs / p.carbs * 100 : old.grams;
    else if (old.role === 'grasa') g = p.fat > 0 ? old.n.fat / p.fat * 100 : old.grams;
    else g = p.kcal > 0 ? old.n.kcal / p.kcal * 100 : old.grams;
    g = roundG(u.clamp(g, 5, capFor(newFood)), old.role);

    items[index] = {
      foodId: newFood.id, name: newFood.name, emoji: newFood.emoji, state: newFood.state,
      grams: g, baseGrams: g, role: old.role, recipeRole: old.recipeRole,
      cap: capFor(newFood), per100: p, n: nut(p, g), swapped: true, swappedFrom: old.name
    };
    // el resto del platillo se reacomoda alrededor del cambio
    const sum = rescaleItems(items, target);
    return { items: items, sum: sum, from: old.name, to: newFood.name };
  }

  /* ---------- candidatos para sustituir ---------- */
  function swapCandidates(item, foods, limit) {
    const role = item.role;
    const cands = foods.filter(function (f) {
      if (f.archived || f.id === item.foodId || f.cat === 'suplemento') return false;
      if (role === 'proteina') return f.protein >= 8;
      if (role === 'carbo') return f.carbs >= 8;
      if (role === 'verdura') return f.cat === 'verdura' || f.cat === 'fruta';
      if (role === 'grasa') return f.fat >= 8;
      return true;
    }).map(function (f) {
      const p = per100(f);
      let g;
      if (role === 'proteina') g = p.protein > 0 ? item.n.protein / p.protein * 100 : 100;
      else if (role === 'carbo') g = p.carbs > 0 ? item.n.carbs / p.carbs * 100 : 100;
      else if (role === 'grasa') g = p.fat > 0 ? item.n.fat / p.fat * 100 : 100;
      else g = p.kcal > 0 ? item.n.kcal / p.kcal * 100 : 100;
      g = roundG(u.clamp(g, 5, capFor(f)), role);
      const n = nut(p, g);
      const score = Math.abs(n.kcal - item.n.kcal) / 45 +
                    Math.abs(n.protein - item.n.protein) / 7 +
                    Math.abs(n.fat - item.n.fat) / 6 -
                    (f.favorite ? 4 : 0) -
                    (f.cat === (item.cat || '') ? 1 : 0);
      return { food:f, grams:g, n:n, score:score };
    });
    cands.sort(function (a, b) { return a.score - b.score; });
    return cands.slice(0, limit || 14);
  }

  /* ¿la receta encaja en el presupuesto de grasa de esa comida? */
  function fitsTarget(recipe, target, foodsById) {
    if (!target || !target.protein) return true;
    let p = 0, fat = 0;
    recipe.ingredients.forEach(function (i) {
      const f = foodsById[i.foodId];
      if (!f) return;
      p += f.protein * i.grams / 100;
      fat += f.fat * i.grams / 100;
    });
    if (p <= 0) return true;
    return (fat / p) <= (target.fat / target.protein) * 1.8;
  }

  return { all, byId, forMeal, isAvailable, fitsTarget, scale, rescaleItems, swapIngredient,
           swapCandidates, baseItems, sumItems, ROLE_MAP };
})();


/* ===== 30-state.js ===== */
/* ============================================================
   NUTRI TRACK — estado de la aplicación
   ============================================================ */
NT.state = (function () {
  const db = NT.db, u = NT.u, M = NT.model;

  const S = {
    ready: false,
    profile: null,
    goals: null,
    meals: null,
    prefs: null,
    foods: [],
    foodsById: {},
    dateKey: u.todayKey(),
    entries: [],       // registros del día visible
    water: 0,
    day: null,
    plan: null,        // plan del día visible
    week: null,        // plan semanal vigente
    shopping: null,    // lista de compras vigente
    measurements: [],
    workouts: [],
    supplements: [],
    onboarded: false
  };

  const listeners = [];
  function subscribe(fn) { listeners.push(fn); return function () { const i = listeners.indexOf(fn); if (i >= 0) listeners.splice(i, 1); }; }
  function emit() { listeners.forEach(function (fn) { try { fn(S); } catch (e) { console.error(e); } }); }

  function indexFoods() {
    S.foodsById = {};
    S.foods.forEach(function (f) { S.foodsById[f.id] = f; });
  }

  function recompute() {
    S.day = M.buildDay(S.dateKey, S.entries, S.meals, S.goals, S.water);
  }

  /* ---------------- arranque ---------------- */
  function init() {
    return db.open().then(function () {
      return Promise.all([
        db.kvGet('profile'), db.kvGet('goals'), db.kvGet('meals'),
        db.kvGet('prefs'), db.kvGet('onboarded', false), db.all('foods')
      ]);
    }).then(function (r) {
      S.profile = Object.assign(M.defaultProfile(), r[0] || {});
      S.meals = r[2] || M.defaultMeals();
      S.prefs = Object.assign(M.defaultPrefs(), r[3] || {});
      S.onboarded = !!r[4];
      S.foods = r[5] || [];
      S.goals = r[1] || M.computeTargets(S.profile);

      if (!S.foods.length) {
        S.foods = NT.SEED.map(function (f) { return JSON.parse(JSON.stringify(f)); });
        return db.putAll('foods', S.foods);
      }
    }).then(function () {
      indexFoods();
      return Promise.all([loadMeasurements(), loadWorkouts(), loadSupplements()]);
    }).then(function () {
      return loadDate(u.todayKey());
    }).then(function () {
      S.ready = true;
      emit();
      return S;
    });
  }

  /* ---------------- fecha visible ---------------- */
  function loadDate(key) {
    S.dateKey = key;
    return db.byIndex('entries', 'byDate', key).then(function (rows) {
      rows.sort(function (a, b) { return (a.ts || 0) - (b.ts || 0); });
      S.entries = rows.filter(function (e) { return e.type !== 'water'; });
      S.water = rows.filter(function (e) { return e.type === 'water'; })
                    .reduce(function (s, e) { return s + (e.ml || 0); }, 0);
      recompute();
      emit();
      return loadPlan(key);
    }).then(function () { return S; });
  }
  function refresh() { return loadDate(S.dateKey); }

  /* ---------------- plan diario ---------------- */
  function loadPlan(key) {
    return db.get('plans', 'day_' + (key || S.dateKey)).then(function (p) {
      if ((key || S.dateKey) === S.dateKey) { S.plan = p; emit(); }
      return p;
    });
  }
  function recentRecipes(days) {
    const keys = [];
    for (let i = 1; i <= (days || 3); i++) keys.push('day_' + u.addDays(S.dateKey, -i));
    return Promise.all(keys.map(function (k) { return db.get('plans', k); }))
      .then(function (rows) {
        const avoid = {};
        rows.filter(Boolean).forEach(function (p) {
          (p.meals || []).forEach(function (m) { if (m.recipeId) avoid[m.recipeId] = 1; });
        });
        return avoid;
      });
  }
  function generatePlan(opts) {
    opts = opts || {};
    return recentRecipes(3).then(function (avoid) {
      const p = NT.planner.buildDayPlan(S.dateKey, S.goals, S.meals, S.foods, S.prefs,
                                        { variant: opts.variant || 0, avoidRecipes: avoid,
                                          foodsById: S.foodsById });
      S.plan = p;
      return db.put('plans', p).then(function () { emit(); return p; });
    });
  }
  function savePlan(p) {
    S.plan = p;
    return db.put('plans', p).then(function () { emit(); return p; });
  }
  function deletePlan() {
    const id = 'day_' + S.dateKey;
    S.plan = null;
    return db.del('plans', id).then(function () { emit(); });
  }
  /* replanea únicamente las comidas que faltan, con lo que queda del día */
  function replanRemaining(variant) {
    if (!S.day) return Promise.resolve(null);
    const fresh = NT.planner.replanRemaining(S.day, S.goals, S.meals, S.foods, S.prefs,
                                             { variant: variant || Math.floor(Date.now() / 1000) % 97 });
    if (!fresh) return Promise.resolve(null);
    const base = S.plan || NT.planner.buildDayPlan(S.dateKey, S.goals, S.meals, S.foods, S.prefs, {});
    const byId = {};
    fresh.meals.forEach(function (m) { byId[m.mealId] = m; });
    base.meals = base.meals.map(function (m) { return byId[m.mealId] || m; });
    base.replannedAt = Date.now();
    return savePlan(base);
  }
  /* registra de golpe todos los alimentos planeados de una comida */
  function logPlannedMeal(mealId) {
    if (!S.plan) return Promise.resolve([]);
    const pm = S.plan.meals.filter(function (m) { return m.mealId === mealId; })[0];
    if (!pm) return Promise.resolve([]);
    const jobs = pm.items.map(function (it) {
      const f = S.foodsById[it.foodId];
      if (!f) return null;
      return M.makeEntry(f, it.grams, 'g', { date: S.dateKey, mealId: mealId, source: 'plan' });
    }).filter(Boolean);
    if (!jobs.length) return Promise.resolve([]);
    return db.putAll('entries', jobs).then(function () { return refresh(); }).then(function () { return jobs; });
  }

  /* ---------------- plan semanal, compras, mediciones ---------------- */
  /* Nota: estas cargas NO emiten evento. Emitir aquí provocaba
     render → carga → emit → render… en bucle. */
  function loadWeek(startKey) {
    return db.get('plans', 'week_' + startKey).then(function (w) { S.week = w; return w; });
  }
  function generateWeek(startKey) {
    const w = NT.planner.buildWeekPlan(startKey, S.goals, S.meals, S.foods, S.prefs);
    S.week = w;
    return db.put('plans', w).then(function () { emit(); return w; });
  }
  function loadShopping(startKey) {
    return db.get('shopping', 'shop_' + startKey).then(function (x) { S.shopping = x; return x; });
  }
  function generateShopping(week) {
    const list = NT.planner.shoppingFrom(week, S.foodsById);
    S.shopping = list;
    return db.put('shopping', list).then(function () { emit(); return list; });
  }
  function saveShopping(list) {
    S.shopping = list;
    return db.put('shopping', list).then(function () { emit(); return list; });
  }

  function loadMeasurements() {
    return db.all('measurements').then(function (rows) {
      rows.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
      S.measurements = rows; emit(); return rows;
    });
  }
  function saveMeasurement(m) {
    if (!m.id) m.id = u.uid('med');
    // si hay peso y % de grasa pero no masa grasa, se deriva (queda marcado como derivado)
    if ((m.fatMass === null || m.fatMass === undefined) &&
        m.weight && m.bodyFat) {
      m.fatMass = u.r1(m.weight * m.bodyFat / 100);
      m.fatMassDerived = true;
    }
    if ((m.muscleMass === null || m.muscleMass === undefined) && m.weight && m.fatMass) {
      m.leanMass = u.r1(m.weight - m.fatMass);
    }
    return db.put('measurements', m).then(loadMeasurements).then(function () {
      // el peso más reciente actualiza el perfil
      const latest = S.measurements[0];
      if (latest && latest.weight && latest.id === m.id) {
        return saveProfile({ weight: u.num(latest.weight, S.profile.weight) });
      }
    }).then(function () { return m; });
  }
  function deleteMeasurement(id) { return db.del('measurements', id).then(loadMeasurements); }

  function savePhoto(rec) {
    if (!rec.id) rec.id = u.uid('ph');
    return db.put('photos', rec);
  }
  function allPhotos() {
    return db.all('photos').then(function (r) {
      r.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
      return r;
    });
  }
  function deletePhoto(id) { return db.del('photos', id); }

  function loadWorkouts() {
    return db.all('workouts').then(function (r) {
      r.sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      S.workouts = r; emit(); return r;
    });
  }
  function saveWorkout(w) {
    if (!w.id) w.id = u.uid('w');
    return db.put('workouts', w).then(loadWorkouts);
  }
  function deleteWorkout(id) { return db.del('workouts', id).then(loadWorkouts); }

  function loadSupplements() {
    return db.all('supplements').then(function (r) { S.supplements = r; emit(); return r; });
  }
  function saveSupplement(x) {
    if (!x.id) x.id = u.uid('sup');
    return db.put('supplements', x).then(loadSupplements);
  }
  function deleteSupplement(id) { return db.del('supplements', id).then(loadSupplements); }

  /* ---------------- perfil / objetivos ---------------- */
  function saveProfile(patch) {
    S.profile = Object.assign({}, S.profile, patch);
    return db.kvSet('profile', S.profile).then(function () {
      if (!S.goals || S.goals.auto !== false) {
        S.goals = M.computeTargets(S.profile);
        return db.kvSet('goals', S.goals);
      }
    }).then(function () { recompute(); emit(); return S; });
  }
  function saveGoals(patch) {
    S.goals = Object.assign({}, S.goals, patch, { updatedAt: Date.now() });
    return db.kvSet('goals', S.goals).then(function () { recompute(); emit(); return S; });
  }
  function recalcGoals() {
    S.goals = M.computeTargets(S.profile);
    return db.kvSet('goals', S.goals).then(function () { recompute(); emit(); return S; });
  }
  function saveMeals(meals) {
    S.meals = meals;
    return db.kvSet('meals', meals).then(function () { recompute(); emit(); return S; });
  }
  function savePrefs(patch) {
    S.prefs = Object.assign({}, S.prefs, patch);
    return db.kvSet('prefs', S.prefs).then(function () { emit(); return S; });
  }
  function setOnboarded(v) {
    S.onboarded = !!v;
    return db.kvSet('onboarded', !!v).then(function () { emit(); return S; });
  }

  /* ---------------- alimentos ---------------- */
  function saveFood(food) {
    food.nameKey = u.norm(food.name + ' ' + (food.brand || ''));
    const ix = S.foods.findIndex(function (f) { return f.id === food.id; });
    if (ix >= 0) S.foods[ix] = food; else S.foods.push(food);
    indexFoods();
    return db.put('foods', food).then(function () { emit(); return food; });
  }
  function deleteFood(id) {
    S.foods = S.foods.filter(function (f) { return f.id !== id; });
    indexFoods();
    return db.del('foods', id).then(function () { emit(); });
  }
  function toggleFavorite(id) {
    const f = S.foodsById[id]; if (!f) return Promise.resolve();
    f.favorite = !f.favorite;
    return saveFood(f);
  }
  function searchFoods(term, opts) {
    opts = opts || {};
    const q = u.norm(term);
    let list = S.foods.filter(function (f) { return !f.archived; });
    if (opts.cat) list = list.filter(function (f) { return f.cat === opts.cat; });
    if (q) {
      list = list.filter(function (f) {
        return u.norm(f.name + ' ' + (f.brand || '')).indexOf(q) >= 0;
      });
      list.sort(function (a, b) {
        const ai = u.norm(a.name).indexOf(q), bi = u.norm(b.name).indexOf(q);
        return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi) || a.name.localeCompare(b.name);
      });
    } else {
      list.sort(function (a, b) {
        return (b.favorite ? 1 : 0) - (a.favorite ? 1 : 0) || a.name.localeCompare(b.name, 'es');
      });
    }
    return list;
  }

  /* ---------------- registros ---------------- */
  function addEntry(entry) {
    return db.put('entries', entry).then(function () {
      if (entry.date === S.dateKey) { S.entries.push(entry); recompute(); emit(); }
      return entry;
    });
  }
  function addEntries(list) {
    return db.putAll('entries', list).then(function () { return refresh(); });
  }
  function updateEntry(entry) {
    return db.put('entries', entry).then(function () { return refresh(); });
  }
  function removeEntry(id) {
    return db.del('entries', id).then(function () { return refresh(); });
  }
  function logFood(food, qty, portionId, opts) {
    const e = M.makeEntry(food, qty, portionId, Object.assign({ date: S.dateKey }, opts || {}));
    return addEntry(e).then(function () { return e; });
  }
  function addWater(ml) {
    const e = { id: u.uid('w'), type:'water', date: S.dateKey, ts: Date.now(),
                time: u.minToHhmm(u.nowMinutes()), ml: ml };
    return db.put('entries', e).then(function () { S.water += ml; recompute(); emit(); return e; });
  }
  function resetWater() {
    return db.byIndex('entries', 'byDate', S.dateKey).then(function (rows) {
      const ws = rows.filter(function (e) { return e.type === 'water'; });
      return Promise.all(ws.map(function (e) { return db.del('entries', e.id); }));
    }).then(refresh);
  }

  /* ---------------- exportar / importar ---------------- */
  function exportAll() {
    return Promise.all([
      db.all('foods'), db.all('entries'), db.all('measurements'),
      db.all('workouts'), db.all('supplements'), db.all('plans'), db.all('shopping')
    ]).then(function (r) {
      return {
        app: 'NUTRI TRACK', version: NT.VERSION, exportedAt: new Date().toISOString(),
        profile: S.profile, goals: S.goals, meals: S.meals, prefs: S.prefs,
        foods: r[0], entries: r[1], measurements: r[2],
        workouts: r[3], supplements: r[4], plans: r[5], shopping: r[6]
      };
    });
  }
  function importAll(data) {
    if (!data || data.app !== 'NUTRI TRACK') return Promise.reject(new Error('Archivo no reconocido'));
    const jobs = [];
    if (data.profile) jobs.push(db.kvSet('profile', data.profile));
    if (data.goals) jobs.push(db.kvSet('goals', data.goals));
    if (data.meals) jobs.push(db.kvSet('meals', data.meals));
    if (data.prefs) jobs.push(db.kvSet('prefs', data.prefs));
    jobs.push(db.kvSet('onboarded', true));
    ['foods','entries','measurements','workouts','supplements','plans','shopping'].forEach(function (k) {
      if (Array.isArray(data[k]) && data[k].length) jobs.push(db.clear(k).then(function () { return db.putAll(k, data[k]); }));
    });
    return Promise.all(jobs).then(function () { return init(); });
  }
  function wipe() {
    return Promise.all(['kv','foods','entries','measurements','workouts','supplements','plans','shopping']
      .map(function (s) { return db.clear(s); }));
  }

  return { S, subscribe, emit, init, loadDate, refresh,
           loadPlan, generatePlan, savePlan, deletePlan, replanRemaining, logPlannedMeal,
           loadWeek, generateWeek, loadShopping, generateShopping, saveShopping,
           loadMeasurements, saveMeasurement, deleteMeasurement,
           savePhoto, allPhotos, deletePhoto,
           loadWorkouts, saveWorkout, deleteWorkout,
           loadSupplements, saveSupplement, deleteSupplement,
           saveProfile, saveGoals, recalcGoals, saveMeals, savePrefs, setOnboarded,
           saveFood, deleteFood, toggleFavorite, searchFoods,
           addEntry, addEntries, updateEntry, removeEntry, logFood, addWater, resetWater,
           exportAll, importAll, wipe };
})();

/* ============================================================
   NUTRI TRACK — componentes de interfaz reutilizables
   ============================================================ */
NT.ui = (function () {
  const u = NT.u, d = NT.dom;

  /* ---------------- hoja modal (bottom sheet) ---------------- */
  let openSheets = [];
  function sheet(opts) {
    const scrim = d.h('<div class="scrim"></div>');
    const el = d.h(
      '<div class="sheet" role="dialog" aria-modal="true">' +
        '<div class="sheet-head"><div class="sheet-grab"></div>' +
          '<h2>' + u.esc(opts.title || '') + '</h2>' +
          '<button class="x" data-close aria-label="Cerrar">✕</button>' +
        '</div>' +
        '<div class="sheet-body"></div>' +
      '</div>');
    el.querySelector('.sheet-body').innerHTML = opts.body || '';
    if (opts.foot) {
      const f = d.h('<div class="sheet-foot"></div>');
      f.innerHTML = opts.foot;
      el.appendChild(f);
    }
    scrim.appendChild(el);
    document.body.appendChild(scrim);
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(function () { scrim.classList.add('show'); });

    const api = {
      el: el,
      scrim: scrim,
      body: el.querySelector('.sheet-body'),
      close: function () {
        scrim.classList.remove('show');
        setTimeout(function () {
          scrim.remove();
          openSheets = openSheets.filter(function (s) { return s !== api; });
          if (!openSheets.length) document.body.style.overflow = '';
          if (opts.onClose) opts.onClose();
        }, 260);
      }
    };
    openSheets.push(api);
    scrim.addEventListener('click', function (e) { if (e.target === scrim) api.close(); });
    d.on(el, 'click', '[data-close]', function () { api.close(); });
    if (opts.onMount) opts.onMount(api);
    return api;
  }
  function closeAllSheets() { openSheets.slice().forEach(function (s) { s.close(); }); }

  function confirm(msg, opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      const s = sheet({
        title: opts.title || 'Confirmar',
        body: '<p class="muted" style="font-size:14px">' + u.esc(msg) + '</p>',
        foot: '<div class="btn-row">' +
                '<button class="btn" data-no>Cancelar</button>' +
                '<button class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" data-yes>' +
                u.esc(opts.ok || 'Aceptar') + '</button></div>',
        onClose: function () { resolve(false); }
      });
      d.on(s.el, 'click', '[data-no]', function () { s.close(); });
      d.on(s.el, 'click', '[data-yes]', function () { resolve(true); s.close(); });
    });
  }

  /* ---------------- barra de progreso de macro ---------------- */
  function bar(cfg) {
    const goal = cfg.goal || 0;
    const val = cfg.value || 0;
    const pct = goal > 0 ? u.clamp(val / goal * 100, 0, 100) : 0;
    const over = goal > 0 && val > goal * 1.02;
    const rest = goal - val;
    const dec = cfg.dec ? 1 : 0;
    return '' +
      '<div class="bar-row">' +
        '<div class="bar-top">' +
          '<span class="bar-name"><span class="dot" style="background:' + cfg.color + '"></span>' + u.esc(cfg.name) + '</span>' +
          '<span class="bar-val"><b>' + u.fmt(val, dec) + '</b> / ' + u.fmt(goal, dec) + ' ' + u.esc(cfg.unit || '') + '</span>' +
        '</div>' +
        '<div class="track"><div class="fill' + (over ? ' over' : '') + '" style="width:' + pct.toFixed(1) + '%;background:' + (over ? 'var(--bad)' : cfg.color) + '"></div></div>' +
        '<div class="bar-rest">' +
          (rest >= 0
            ? 'Te faltan <b>' + u.fmt(rest, dec) + ' ' + u.esc(cfg.unit || '') + '</b>'
            : 'Te pasaste por <b>' + u.fmt(-rest, dec) + ' ' + u.esc(cfg.unit || '') + '</b>') +
        '</div>' +
      '</div>';
  }

  /* ---------------- anillo de calorías ---------------- */
  function ring(value, goal, label) {
    const R = 48, C = 2 * Math.PI * R;
    const pct = goal > 0 ? u.clamp(value / goal, 0, 1) : 0;
    const over = goal > 0 && value > goal * 1.02;
    const off = C * (1 - pct);
    return '' +
      '<div class="ring">' +
        '<svg width="112" height="112" viewBox="0 0 112 112" aria-hidden="true">' +
          '<circle cx="56" cy="56" r="' + R + '" fill="none" stroke="var(--line)" stroke-width="10"/>' +
          '<circle cx="56" cy="56" r="' + R + '" fill="none" stroke="' + (over ? 'var(--bad)' : 'var(--kcal)') + '" stroke-width="10" ' +
            'stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/>' +
        '</svg>' +
        '<div class="ring-mid"><div class="big">' + u.fmt(Math.max(0, goal - value)) + '</div>' +
        '<div class="sub">' + u.esc(label || 'kcal restantes') + '</div></div>' +
      '</div>';
  }

  /* ---------------- selector segmentado ---------------- */
  function seg(name, options, current) {
    return '<div class="seg" data-seg="' + u.esc(name) + '">' +
      options.map(function (o) {
        return '<button type="button" data-val="' + u.esc(o.v) + '" class="' + (o.v === current ? 'on' : '') + '">' + u.esc(o.n) + '</button>';
      }).join('') + '</div>';
  }
  function bindSeg(root, onChange) {
    d.on(root, 'click', '.seg button', function (e, btn) {
      const wrap = btn.closest('.seg');
      d.qa('button', wrap).forEach(function (b) { b.classList.remove('on'); });
      btn.classList.add('on');
      if (onChange) onChange(wrap.dataset.seg, btn.dataset.val);
    });
  }

  function toggle(on) { return '<span class="toggle' + (on ? ' on' : '') + '"></span>'; }

  function macroPills(t) {
    return '<span class="pill-macro">P <b>' + u.fmt(t.protein) + '</b>g</span>' +
           '<span class="pill-macro">C <b>' + u.fmt(t.carbs) + '</b>g</span>' +
           '<span class="pill-macro">G <b>' + u.fmt(t.fat) + '</b>g</span>' +
           '<span class="pill-macro">' + u.fmt(t.kcal) + ' kcal</span>';
  }

  function stateTag(state) {
    if (state === 'crudo') return '<span class="tag tag-raw">crudo</span>';
    if (state === 'cocido') return '<span class="tag tag-cook">cocido</span>';
    return '';
  }

  function empty(icon, title, text) {
    return '<div class="empty"><div class="ico">' + icon + '</div>' +
           '<div style="font-weight:650;color:var(--txt-2);margin-bottom:4px">' + u.esc(title) + '</div>' +
           '<p>' + u.esc(text || '') + '</p></div>';
  }

  /* ---------------- gráfica de líneas sencilla (SVG) ---------------- */
  function lineChart(points, opts) {
    opts = opts || {};
    const W = opts.w || 320, H = opts.h || 120, P = 6;
    if (!points.length) return '';
    const xs = points.map(function (p, i) { return i; });
    const ys = points.map(function (p) { return p.y; });
    const minY = opts.min !== undefined ? opts.min : Math.min.apply(null, ys);
    const maxY = opts.max !== undefined ? opts.max : Math.max.apply(null, ys);
    const span = (maxY - minY) || 1;
    const px = function (i) { return P + i * (W - 2 * P) / Math.max(1, xs.length - 1); };
    const py = function (v) { return H - P - (v - minY) / span * (H - 2 * P); };
    const dAttr = points.map(function (p, i) { return (i ? 'L' : 'M') + px(i).toFixed(1) + ' ' + py(p.y).toFixed(1); }).join(' ');
    const area = dAttr + ' L' + px(points.length - 1).toFixed(1) + ' ' + H + ' L' + px(0).toFixed(1) + ' ' + H + ' Z';
    const color = opts.color || 'var(--brand)';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:' + H + 'px;display:block">' +
      '<path d="' + area + '" fill="' + color + '" opacity=".10"/>' +
      '<path d="' + dAttr + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
      points.map(function (p, i) { return '<circle cx="' + px(i).toFixed(1) + '" cy="' + py(p.y).toFixed(1) + '" r="2.8" fill="' + color + '"/>'; }).join('') +
      '</svg>';
  }

  return { sheet, closeAllSheets, confirm, bar, ring, seg, bindSeg, toggle,
           macroPills, stateTag, empty, lineChart };
})();
